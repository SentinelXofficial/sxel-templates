id: tomcat-directory-listing
brief:
    title: Apache Tomcat - Directory Listing Enabled
    by: oleveloper
    level: medium
    about: Directory listing is enabled on the Apache Tomcat server, allowing users to view the contents of web directories.This could lead to unauthorized access to sensitive files and potential information ...
    label:
        - tomcat
        - misconfig
        - listing
        - kisa
        - vuln
moves:
