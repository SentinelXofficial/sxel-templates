id: shell-history
brief:
    title: Shell History
    by: pentest_swissky
    level: low
    about: Discover history for bash, ksh, sh, and zsh
    label:
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.bash_history'
        - '{{BaseURL}}/.ksh_history'
        - '{{BaseURL}}/.sh_history'
        - '{{BaseURL}}/.zsh_history'
      signs:
        - "on": word
          has:
            - 'mkdir '
            - 'chmod '
            - 'mv '
            - 'nano '
            - 'vim '
            - 'pico '
            - 'sudo '
            - 'cd '
            - 'cp '
            - ps aux
            - 'ls '
            - logout
          in: body
          need: all
        - "on": word
          has:
            - <?xml
            - <env
            - application/javascript
            - application/json
            - application/xml
            - html>
            - text/html
            - image/
          in: response
          need: all
        - "on": status
          status:
            - 200
