id: wp-googlecaptcha-fpd
brief:
    title: WordPress Plugin reCaptcha by BestWebSoft (google-captcha) - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress ManageWP Worker plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - debug
        - wordpress
        - fpd
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/google-captcha/includes/captcha-for-formidable.php'
      signs: []
