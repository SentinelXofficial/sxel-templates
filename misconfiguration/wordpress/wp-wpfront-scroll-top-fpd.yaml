id: wp-wpfront-scroll-top-fpd
brief:
    title: WordPress WPFront Scroll Top - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin WPFront Scroll Top plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - wpfront-scroll-top
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wpfront-scroll-top/wpfront-scroll-top.php'
      signs: []
