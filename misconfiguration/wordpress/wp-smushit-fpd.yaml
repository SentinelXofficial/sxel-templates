id: wp-smushit-fpd
brief:
    title: WP Smushit - Full Path Disclosure
    by: theamanrawat
    level: low
    about: Smushit WordPress plugin contains a full path disclosure vulnerability due to improper access restrictions in its source files, allowing unauthenticated attackers to retrieve full server paths and ...
    label:
        - debug
        - wordpress
        - wp
        - wp-plugin
        - wp-smushit
        - fpd
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wp-smushit/core/cdn/class-cdn-controller.php'
        - '{{BaseURL}}/wp-content/plugins/wp-smushit/wp-smush.php'
      signs: []
