id: wp-w3-total-cache-fpd
brief:
    title: WordPress W3 Total Cache - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress W3 Total Cache plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - w3-total-cache
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/w3-total-cache/inc/lightbox/purchase.php'
      signs: []
