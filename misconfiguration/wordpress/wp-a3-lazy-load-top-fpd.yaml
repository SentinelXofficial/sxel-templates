id: wp-a3-lazy-load-top-fpd
brief:
    title: WordPress a3 Lazy Load - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin a3 Lazy Load plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - a3-lazy-load
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/a3-lazy-load/a3-lazy-load.php'
        - '{{BaseURL}}/wp-content/plugins/a3-lazy-load/admin/a3-lazy-load-admin.php'
      signs: []
