id: wp-hello-dolly-fpd
brief:
    title: WordPress Plugin Hello Dolly - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin Hello Dolly plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - debug
        - wordpress
        - fpd
        - vuln
        - hello-dolly
        - wp-plugin
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/hello-dolly/hello.php'
      signs: []
