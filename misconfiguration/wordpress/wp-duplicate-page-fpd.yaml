id: wp-duplicate-page-fpd
brief:
    title: WordPress Duplicate Page - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin Duplicate Page files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - duplicate-page
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/duplicate-page/duplicatepage.php'
      signs: []
