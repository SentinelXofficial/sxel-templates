id: wp-pagenavi-fpd
brief:
    title: WordPress WP-PageNavi - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress WP-PageNavi plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - debug
        - wp
        - wp-plugin
        - wordpress
        - fpd
        - vuln
        - wp-pagenavi
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wp-pagenavi/admin.php'
        - '{{BaseURL}}/wp-content/plugins/wp-pagenavi/wp-pagenavi.php'
      signs: []
