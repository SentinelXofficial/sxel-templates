id: wp-better-wp-security-fpd
brief:
    title: WordPress Plugin iThemes Security - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin iThemes Security files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - debug
        - wordpress
        - fpd
        - vuln
        - better-wp-security
        - wp-plugin
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/better-wp-security/core/admin-pages/page-logs.php'
      signs: []
