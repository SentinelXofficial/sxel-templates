id: wordpress-menu-image-fpd
brief:
    title: WordPress Menu Image - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin Menu Image plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - menu-image
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/menu-image/freemius/templates/checkout.php'
      signs: []
