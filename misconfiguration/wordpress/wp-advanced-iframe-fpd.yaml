id: wp-advanced-iframe-fpd
brief:
    title: WordPress Advanced iFrame - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Advanced iFrame plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - advanced-iframe
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/advanced-iframe/advanced-iframe.php'
        - '{{BaseURL}}/wp-content/plugins/advanced-iframe/advanced-iframe-admin-page.php'
      signs: []
