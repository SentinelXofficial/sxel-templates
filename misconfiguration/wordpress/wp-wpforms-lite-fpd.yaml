id: wp-wpforms-lite-fpd
brief:
    title: WordPress WPForms - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin WPForms files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - wpforms-lite
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wpforms-lite/src/Frontend/Modern.php'
      signs: []
