id: wp-ssl-insecure-content-fixer-fpd
brief:
    title: WordPress Plugin SSL Insecure Content Fixer - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress SSL Insecure Content Fixer plugin files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - debug
        - wordpress
        - fpd
        - vuln
        - ssl-insecure-content-fixer
        - wp-plugin
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/ssl-insecure-content-fixer/includes/nonces.php'
        - '{{BaseURL}}/wp-content/plugins/ssl-insecure-content-fixer/nowp/ajax.php'
      signs: []
