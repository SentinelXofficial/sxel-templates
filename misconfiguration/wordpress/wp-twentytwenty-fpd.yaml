id: wp-twentytwenty-fpd
brief:
    title: WordPress Twenty Twenty Theme - Full Path Disclosure
    by: 0x_Akoko
    level: info
    about: WordPress theme twentytwenty internal file system path of a WordPress installation is exposed or disclosed to unauthorized users.
    label:
        - debug
        - wordpress
        - fpd
        - vuln
        - twentytwenty
        - wp-themes
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/themes/twentytwenty/functions.php'
      signs: []
