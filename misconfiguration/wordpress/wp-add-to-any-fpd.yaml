id: wp-add-to-any-fpd
brief:
    title: WordPress AddToAny Share Buttons Plugin - Full Path Disclosure
    by: pussycat0x
    level: low
    about: The AddToAny Share Buttons plugin for WordPress was detected to be vulnerable to Full Path Disclosure, allowing unauthenticated access to the full application path.
    label:
        - wordpress
        - wp
        - wp-plugin
        - fpd
        - disclosure
        - add-to-any
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/add-to-any/add-to-any.php'
        - '{{BaseURL}}/wp-content/plugins/add-to-any/addtoany.php'
        - '{{BaseURL}}/wp-content/plugins/add-to-any/includes/addtoany.class.php'
        - '{{BaseURL}}/wp-content/plugins/add-to-any/admin/class-addtoany-admin.php'
        - '{{BaseURL}}/wp-content/plugins/add-to-any/admin/settings.php'
      signs: []
