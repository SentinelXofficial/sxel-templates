id: wp-contact-form-7-fpd
brief:
    title: WordPress Contact Form 7 - Full Path Disclosure
    by: pussycat0x
    level: low
    about: The WordPress Contact Form 7 plugin was detected to be vulnerable to Full Path Disclosure, where direct access to PHP files revealed the full server filesystem path and could aid further exploitation.
    label:
        - wordpress
        - wp-plugin
        - fpd
        - contact-form-7
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/contact-form-7/includes/functions.php'
      signs: []
