id: wp-wordfence-fpd
brief:
    title: Wordfence - Full Path Disclosure
    by: theamanrawat
    level: low
    about: Wordfence WordPress plugin contains a full path disclosure vulnerability due to improper access restrictions in its source files, allowing unauthenticated attackers to retrieve full server paths an...
