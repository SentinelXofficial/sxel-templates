id: wordpress-meta-box-fpd
brief:
    title: WordPress Meta Box - Full Path Disclosure
    by: pussycat0x
    level: low
    about: The Meta Box – WordPress Custom Fields Framework plugin for WordPress was detected to be vulnerable to Full Path Disclosure, allowing unauthenticated attackers to obtain the full application path.
    label:
        - wordpress
        - wp-plugin
        - fpd
        - disclosure
        - meta-box
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/meta-box/meta-box.php'
        - '{{BaseURL}}/wp-content/plugins/meta-box/inc/loader.php'
        - '{{BaseURL}}/wp-content/plugins/meta-box/inc/core.php'
      signs: []
