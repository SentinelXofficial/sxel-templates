id: wordfence-rules-disclosure
brief:
    title: WordPress Wordfence - Rules File Disclosure
    by: ritikchaddha
    level: medium
    about: The Wordfence Security plugin for WordPress stores configuration files in the /wp-content/wflogs/ directory. These files may be accessible without authentication and can expose sensitive configurat...
    label:
        - wordpress
        - wp-plugin
        - wordfence
        - rules
        - disclosure
        - exposure
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/wflogs/rules.php'
      signs:
        - "on": word
          has:
            - wfWAFrule
            - $this
          in: body
          need: all
        - "on": status
          status:
            - 200
