id: wp-the-events-calendar-fpd
brief:
    title: WordPress The Events Calendar - Full Path Disclosure
    by: ritikchaddha
    level: low
    about: WordPress The Events Calendar plugin is vulnerable to full path disclosure via direct access to plugin files.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - events-calendar
        - exposure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/the-events-calendar/src/Tribe/Main.php'
        - '{{BaseURL}}/wp-content/plugins/the-events-calendar/src/Tribe/Admin/Admin.php'
        - '{{BaseURL}}/wp-content/plugins/the-events-calendar/common/src/Tribe/Main.php'
      signs: []
