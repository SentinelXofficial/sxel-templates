id: wp-breadcrumb-navxt-fpd
brief:
    title: WordPress Breadcrumb NavXT - Full Path Disclosure
    by: theamanrawat
    level: low
    about: The Breadcrumb NavXT plugin for WordPress was detected to be vulnerable to Full Path Disclosure, allowing unauthenticated attackers to obtain the full application path that could aid other attacks ...
