id: wp-all-in-one-seo-pack-fpd
brief:
    title: WordPress All in One SEO Pack - Full Path Disclosure
    by: theamanrawat
    level: low
    about: All in One SEO Pack for WordPress contains a full path disclosure vulnerability due to improper access restrictions in its source files, allowing unauthenticated attackers to retrieve full server p...
