id: wp-updraftplus-fpd
brief:
    title: WordPress UpdraftPlus - Full Path Disclosure
    by: DhiyaneshDk
    level: low
    about: WordPress Plugin UpdraftPlus files are publicly accessible without ABSPATH protection, exposing sensitive server path information through PHP error messages when accessed directly.
    label:
        - wp
        - wordpress
        - wp-plugin
        - fpd
        - updraftplus
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/updraftplus/admin.php'
        - '{{BaseURL}}/wp-content/plugins/updraftplus/class-updraftplus.php'
        - '{{BaseURL}}/wp-content/plugins/updraftplus/restorer.php'
        - '{{BaseURL}}/wp-content/plugins/updraftplus/backup.php'
        - '{{BaseURL}}/wp-content/plugins/updraftplus/includes/class-commands.php'
      signs: []
