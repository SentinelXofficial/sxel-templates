id: csp-script-src-wildcard
brief:
    title: Content-Security-Policy "script-src" Wildcard Detected
    by: pussycat0x
    level: info
    about: Detected a wildcard (*) within the script-src directive of the Content-Security-Policy. This allowed scripts to load from any origin, weakening the CSP and increasing XSS risk.
    label:
        - csp
        - misconfig
        - headers
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Content-Security-Policy
          in: header
          need: all
