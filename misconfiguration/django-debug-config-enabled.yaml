id: django-debug-config-enabled
brief:
    title: Django Debug Configuration Enabled
    by: dhiyaneshDK
    level: medium
    about: Django debug configuration is enabled, which allows an attacker to obtain system configuration information such as paths or settings.
    label:
        - django
        - debug
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/NON_EXISTING_PATH/'
      signs:
        - "on": word
          has:
            - URLconf defined
            - Page not found
            - Django tried these URL patterns, in this order
          in: body
          need: all
        - "on": status
          status:
            - 404
