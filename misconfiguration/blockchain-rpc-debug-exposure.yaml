id: blockchain-rpc-debug-exposure
brief:
    title: Blockchain RPC Debug Trace Methods - Exposure
    by: 0xBassia
    level: medium
    about: The blockchain RPC endpoint has debug-level tracing methods enabled (debug_traceTransaction, debug_traceBlockByNumber, trace_block, trace_filter). These methods return complete EVM execution traces...
    label:
        - misconfig
        - blockchain
        - rpc
        - debug
        - trace
        - web3
    score: CVSS:6.5
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"jsonrpc":"2.0","method":"debug_traceTransaction","params":[],"id":1}'
      signs:
        - "on": word
          has:
            - '"jsonrpc"'
            - '"error"'
            - missing value for required argument
          in: body
          need: all
        - "on": word
          has:
            - does not exist
            - not available
            - not found
            - not supported
          in: body
          need: all
        - "on": status
          status:
            - 200
