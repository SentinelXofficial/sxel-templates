id: gitlab-uninitialized-password
brief:
    title: Uninitialized GitLab instances
    by: GitLab Red Team
    level: high
    about: Prior to version 14, GitLab installations required a root password to be
    label:
        - gitlab
        - misconfig
        - unauth
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/users/sign_in'
      signs:
        - "on": word
          has:
            - Change your password
            - New password
            - Confirm new password
          in: body
          need: all
        - "on": word
          has:
            - gitlab_session
          in: header
          need: all
        - "on": status
          status:
            - 200
