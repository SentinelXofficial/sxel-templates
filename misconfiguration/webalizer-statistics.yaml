id: webalizer-statistics
brief:
    title: Webalizer Statistics Information Disclosure
    by: 0x_Akoko
    level: low
    about: The remote host is running the Webalizer Report generator. Webalizer parses web logs and gives a potential attacker information regarding hosts that have accessed the server, resources accessed, to...
    label:
        - webalizer
        - logs
        - statistics
        - tenable
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/stats/index.html'
      signs:
        - "on": word
          has:
            - Generated by The Webalizer
            - Usage Statistics
          in: body
          need: all
        - "on": status
          status:
            - 200
