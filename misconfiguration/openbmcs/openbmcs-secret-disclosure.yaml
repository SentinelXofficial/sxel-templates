id: openbmcs-secret-disclosure
brief:
    title: OpenBMCS 2.4 - Information Disclosure
    by: dhiyaneshDK
    level: high
    about: OpenBMCS 2.4 contains an information disclosure vulnerability. The application allows directory listing and exposure of some sensitive files, which can allow an attacker to leverage the disclosed i...
    label:
        - misconfig
        - edb
        - openbmcs
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/debug/'
      signs:
        - "on": word
          has:
            - change_password_sqls
            - Index of /debug
          in: body
          need: all
        - "on": status
          status:
            - 200
