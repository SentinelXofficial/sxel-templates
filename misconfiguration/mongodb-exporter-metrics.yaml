id: mongodb-exporter-metrics
brief:
    title: MongoDB Exporter - Detect
    by: pussycat0x
    level: medium
    about: MongoDB exporter was detected.
    label:
        - mongodb
        - exposure
        - debug
        - misconfig
        - vuln
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/metrics'
      signs:
        - "on": word
          has:
            - '# HELP'
          in: body
          need: all
        - "on": word
          has:
            - mongodb
            - mongodb_exporter_build_info
          in: body
          need: all
        - "on": status
          status:
            - 200
