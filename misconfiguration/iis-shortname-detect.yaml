id: iis-shortname-detect
brief:
    title: IIS - Short Name Detect
    by: nodauf
    level: info
    about: A website running via IIS on an old .net framework contains a get request vulnerability. Using the the tilde character "~" in the request, an attacker can locate short names of files and folders no...
    label:
        - iis
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/{{randstring}}*~1*/a.aspx'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Origin: '{{BaseURL}}'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/*~1*/a.aspx'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Origin: '{{BaseURL}}'
      signs: []
    - verb: OPTIONS
      to:
        - '{{BaseURL}}/{{randstring}}*~1*/a.aspx'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Origin: '{{BaseURL}}'
      signs: []
    - verb: OPTIONS
      to:
        - '{{BaseURL}}/*~1*/a.aspx'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Origin: '{{BaseURL}}'
      signs: []
