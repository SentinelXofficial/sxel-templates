id: sap-getversion-info
brief:
    title: SAPControl GetVersionInfo - Detect
    by: LRVT
    level: info
    about: Detected SAP systems where the SAP Start Service (sapstartsrv) SAPControl SOAP interface exposes the GetVersionInfo web method without authentication.
    label:
        - misconfig
        - sap
        - sapcontrol
        - soap
        - version
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: text/xml; charset=UTF-8
        SOAPAction: '''""'''
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
          <SOAP-ENV:Header>
            <sapsess:Session xmlns:sapsess="http://www.sap.com/webas/630/soap/features/session/">
              <enableSession>true</enableSession>
            </sapsess:Session>
          </SOAP-ENV:Header>
          <SOAP-ENV:Body>
            <ns1:GetVersionInfo xmlns:ns1="urn:SAPControl"></ns1:GetVersionInfo>
          </SOAP-ENV:Body>
        </SOAP-ENV:Envelope>
      signs:
        - "on": word
          has:
            - GetVersionInfoResponse
          in: body
          need: all
        - "on": word
          has:
            - <VersionInfo>
            - <Filename>
          in: body
          need: all
        - "on": status
          status:
            - 200
