    by: t3l3machus
    level: low
    about: The SAP ICM (Internet Communication Manager) admin monitor interface is often set to public and can be accessed without authentication. The interface discloses version information about the underly...
    label:
        - sap
        - misconfig
        - admin
        - dashboard
        - vuln
moves:
