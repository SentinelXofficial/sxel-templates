id: ingress-nginx-valid-admission
brief:
    title: Kubernetes Ingress-Nginx Valid AdmissionReview - Detection
    by: burso
    level: info
    about: Sends a valid minimal AdmissionReview JSON to reliably detect Kubernetes Ingress-Nginx Admission webhook endpoints.
    label:
        - tech
        - kubernetes
        - ingress
        - nginx
        - k8s
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/validate'
      head:
        Content-Type: application/json
      body: |-
        {
          "kind": "AdmissionReview",
          "apiVersion": "admission.k8s.io/v1",
          "request": {
            "uid": "{{string}}",
            "kind": {
              "group": "networking.k8s.io",
              "version": "v1",
              "kind": "Ingress"
            },
            "operation": "CREATE",
            "object": {
              "metadata": {
                "name": "test-{{string}}",
                "namespace": "default"
              },
              "spec": {
                "rules": [
                  {
                    "host": "example.com",
                    "http": {
                      "paths": []
                    }
                  }
                ]
              }
            }
          }
        }
      signs: []
