id: cookies-without-httponly
brief:
    title: Cookies without HttpOnly attribute - Detect
    by: RJ Coleman
    level: info
    about: Checks whether cookies in the HTTP response contain the HttpOnly attribute. If the HttpOnly flag is set, it means that the cookie is HTTP-only
    label:
        - misconfig
        - http
        - cookie
        - generic
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
