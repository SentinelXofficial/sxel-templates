id: exist-db-dashboard-access
brief:
    title: eXist-DB Dashboard Access
    by: ritikchaddha
    level: high
    about: Detects eXist DB dashboard login endpoint access. eXist DB is a document-oriented database that allows you to store and query XML data. The dashboard is a web interface that allows you to manage th...
    label:
        - misconfig
        - exist-db
        - dashboard
        - login
        - exposure
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/exist/apps/dashboard/login'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user={{username}}&password=
      signs:
        - "on": word
          has:
            - application/xml
          in: content_type
          need: all
        - "on": status
          status:
            - 200
