id: apachespark-ui-exposed
brief:
    title: Apache Spark Application UI - Exposed
    by: ritikchaddha
    level: medium
    about: Detects exposed PySparkShell Application UI by Apache Spark on port 4040. The UI should not be exposed to the internet as it may leak sensitive job and cluster information.
    label:
        - spark
        - pyspark
        - ui
        - exposed
        - panel
        - apache
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/jobs/'
        - '{{BaseURL}}:4040/jobs/'
      signs:
        - "on": word
          has:
            - Spark Jobs
            - application UI
          in: body
          need: all
        - "on": status
          status:
            - 200
