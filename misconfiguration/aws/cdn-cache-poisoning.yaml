id: cdn-cache-poisoning
brief:
    title: Misconfigured CDN Cache Poisoning via X-Amz-Server-Side-Encryption Header
    by: 0xcharan
    level: info
    about: When the X-Amz-Server-Side-Encryption header is sent with user controlled value, it can lead to a misconfigured CDN cache response with a 400 status code, making the page inaccessible.
    label:
        - cache
        - aws
        - poisoning
        - cdn
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?{{string}}'
      head:
        X-Amz-Server-Side-Encryption: '{{randstr}}'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/?{{string}}'
      signs: []
