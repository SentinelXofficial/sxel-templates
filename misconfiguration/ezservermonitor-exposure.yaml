id: ezservermonitor-exposure
brief:
    title: eZ Server Monitor - Exposure
    by: pussycat0x
    level: low
    about: Detected exposed eZ Server Monitor instances that revealed sensitive server information, including hostname, OS, kernel version, CPU details, memory usage, disk space, network interfaces with IP ad...
    label:
        - misconfig
        - exposure
        - ezservermonitor
        - monitoring
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
        - '{{BaseURL}}/esm/'
        - '{{BaseURL}}/monitoring/'
        - '{{BaseURL}}/ezservermonitor/'
      signs:
        - "on": word
          has:
            - <title>eZ Server Monitor
            - eZ Server Monitor - v
          in: body
          need: all
        - "on": word
          has:
            - web/css/frontend.css
            - <span class="icon-gauge"></span>eSM
          in: body
          need: all
        - "on": status
          status:
            - 200
