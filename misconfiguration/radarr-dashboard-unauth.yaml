      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>Radarr</title>
          in: body
          need: all
        - "on": word
          has:
            - Login - Radarr
          in: body
          need: all
        - "on": status
          status:
            - 200
