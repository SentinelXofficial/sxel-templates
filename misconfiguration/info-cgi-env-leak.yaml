id: info-cgi-env-leak
brief:
    title: info.cgi  Environment Variable - Disclosure
    by: pussycat0x
    level: medium
    about: Detected exposure of server environment variables through the info.cgi script. This can leak sensitive paths, internal IPs, software versions, credentials in env, etc.
    label:
        - cgi
        - exposure
        - info
        - env
        - disclosure
        - generic
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/info.cgi'
        - '{{BaseURL}}/cgi-bin/info.cgi'
        - '{{BaseURL}}/cgi-sys/info.cgi'
        - '{{BaseURL}}/scripts/info.cgi'
        - '{{BaseURL}}/lite-scripts/info.cgi'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - SERVER_SOFTWARE
            - SERVER_NAME
            - GATEWAY_INTERFACE
            - SERVER_PROTOCOL
            - REQUEST_METHOD
            - QUERY_STRING
            - REMOTE_ADDR
            - HTTP_USER_AGENT
          in: body
          need: all
        - "on": word
          has:
            - PATH=
            - '/bin:'
            - '/usr/bin:'
            - LD_LIBRARY_PATH
            - MYSQL_HOME
            - OPENSSL_CONF
            - DOCUMENT_ROOT
            - SCRIPT_FILENAME
          in: body
          need: all
