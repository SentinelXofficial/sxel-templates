id: cookies-without-secure
brief:
    title: Cookies without Secure attribute - Detect
    by: vthiery
    level: info
    about: Checks whether cookies in the HTTP response contain the Secure attribute. If the Secure flag is set, it means that the cookie can only be transmitted over HTTPS
    label:
        - misconfig
        - http
        - cookie
        - generic
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
