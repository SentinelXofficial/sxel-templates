id: hazelcast-management-exposure
brief:
    title: Hazelcast Management Center - Configuration Exposure
    by: S3R4PH
    level: medium
    about: Detected poor architectural configurations or unsecured REST API endpoints in Hazelcast by checking the cluster endpoint, which exposes internal member IPs, UUIDs, and version information.
    label:
        - config
        - exposure
        - hazelcast
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/hazelcast/rest/cluster'
      signs:
        - "on": word
          has:
            - memberVersion
            - members
          in: body
          need: all
        - "on": status
          status:
            - 200
