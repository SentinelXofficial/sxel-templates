id: xss-deprecated-header
brief:
    title: XSS-Protection Header - Cross-Site Scripting
    by: joshlarsen
    level: info
    about: Setting the XSS-Protection header is deprecated. Setting the header to anything other than `0` can actually introduce an XSS vulnerability.
    label:
        - xss
        - misconfig
        - generic
        - vuln
moves:
