id: springboot-trace
brief:
    title: Detect Springboot Trace Actuator
    by: that_juan_
    level: low
    about: View recent HTTP requests and responses
    label:
        - misconfig
        - springboot
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/trace'
      signs:
        - "on": word
          has:
            - '"timestamp"'
            - '"info"'
            - '"method"'
            - '"path"'
          in: body
          need: all
        - "on": word
          has:
            - application/json
            - application/vnd.spring-boot.actuator
            - application/vnd.spring-boot.actuator.v1+json
            - application/vnd.spring-boot.actuator.v2+json
            - application/vnd.spring-boot.actuator.v3+json
          in: header
          need: all
        - "on": status
          status:
            - 200
