id: springboot-flyway
brief:
    title: Springboot Flyway API
    by: ELSFA7110
    level: low
    about: This endpoint to retrieve the migrations
    label:
        - misconfig
        - springboot
        - exposure
        - flyway
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/flyway'
        - '{{BaseURL}}/actuator/flyway'
      signs:
        - "on": word
          has:
            - flywayBeans
          in: body
          need: all
        - "on": word
          has:
            - application/json
            - application/vnd.spring-boot.actuator
            - application/vnd.spring-boot.actuator.v1+json
            - application/vnd.spring-boot.actuator.v2+json
          in: header
          need: all
        - "on": status
          status:
            - 200
