id: prometheus-log
brief:
    title: Exposed Prometheus
    by: dhiyaneshDK
    level: low
    about: Prometheus instance is exposed.
    label:
        - prometheus
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/prometheus'
        - '{{BaseURL}}/actuator/prometheus'
        - '{{BaseURL}}/actuator/prometheus;%2f..%2f..%2f'
      signs:
        - "on": word
          has:
            - gateway_request_total
            - logback_events_total
          in: body
          need: all
        - "on": status
          status:
            - 200
