id: label-studio-signup
brief:
    title: Label Studio - Sign-up Detect
    by: DhiyaneshDK
    level: info
    about: Detects the presence of the Label Studio sign-up.
    label:
        - label-studio
        - sign-up
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/user/signup'
      head:
        Accept: '*/*'
      signs:
        - "on": word
          has:
            - Label Studio
            - Sign up
            - Create Account
          in: body
          need: all
        - "on": status
          status:
            - 200
