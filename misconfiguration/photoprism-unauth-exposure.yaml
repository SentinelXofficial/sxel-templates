id: photoprism-unauth-exposure
brief:
    title: PhotoPrism - Unauthenticated Exposure
    by: pussycat0x
    level: high
    about: PhotoPrism instance is running in public mode with authentication disabled (PHOTOPRISM_AUTH_MODE=public), exposing all photos, albums, GPS locations, face recognition data, and server configuration...
    label:
        - photoprism
        - exposure
        - unauth
        - misconfig
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/v1/config'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - PhotoPrism
            - '"public":true'
            - '"authMode":"public"'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
