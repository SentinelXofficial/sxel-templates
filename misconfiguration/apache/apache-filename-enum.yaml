id: apache-filename-enum
brief:
    title: Apache Filename Enumeration
    by: geeknik
    level: low
    about: If the client provides an invalid Accept header, the server will respond with a 406 Not Acceptable error containing a pseudo directory listing.
    label:
        - apache
        - misconfig
        - hackerone
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index'
      head:
        Accept: fake/value
      signs:
        - "on": status
          status:
            - 406
        - "on": word
          has:
            - Not Acceptable
            - 'Available variants:'
            - <address>Apache Server at
          in: body
          need: all
