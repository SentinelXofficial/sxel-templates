id: default-spx-key
brief:
    title: SPX PHP Profiler - Default Key
    by: vagnerd
    level: high
    about: SPX PHP profiler default spx key were discovered.
    label:
        - spx-php
        - debug
        - misconfig
        - spx
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?SPX_KEY=dev&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=devel&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=stg&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=stag&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=staging&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=prd&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=prod&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=production&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=test&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=testing&SPX_UI_URI=/'
        - '{{BaseURL}}/?SPX_KEY=spx&SPX_UI_URI=/'
      signs:
        - "on": word
          has:
            - <title>SPX Control Panel</title>
            - SPX_ENABLED
            - Configuration
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
