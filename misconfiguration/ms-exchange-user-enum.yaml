id: ms-exchange-user-enum
brief:
    title: Microsoft Exchange Autodiscover - User Enumeration
    by: righettod
    level: info
    about: Microsoft Exchange (on premise) is prone to a user enumeration via the ActiveSync protocol using the AutodiscoverV2 endpoint.
    label:
        - ms-exchange
        - microsoft
        - misconfig
        - enum
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/autodiscover/autodiscover.json?Protocol=ActiveSync&Email={{rand_text_alpha(6)}}%40oast.pro&RedirectCount=1'
      signs:
        - "on": word
          has:
            - /autodiscover/autodiscover.json?Email=
          in: header
          need: all
        - "on": status
          status:
            - 302
