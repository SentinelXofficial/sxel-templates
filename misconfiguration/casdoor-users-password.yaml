id: casdoor-users-password
brief:
    title: Casdoor get-users Account Password Disclosure
    by: DhiyaneshDk
    level: high
    about: Casdoor get-users Account Password is exposed.
    label:
        - casdoor
        - exposure
        - misconfig
        - disclosure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/get-users?p=123&pageSize=123'
      signs:
        - "on": word
          has:
            - '"name":'
            - '"password":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
