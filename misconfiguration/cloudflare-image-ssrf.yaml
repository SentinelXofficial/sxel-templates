id: cloudflare-external-image-resize
brief:
    title: Cloudflare External Image Resizing Misconfiguration
    by: vavkamil
    level: info
    about: Cloudflare Image Resizing defaults to restricting resizing to the same domain. This prevents third parties from resizing any image at any origin. However, you can enable this option if you check Re...
    label:
        - cloudflare
        - misconfig
        - oast
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cdn-cgi/image/width/https://{{interactsh-url}}'
      head:
        Accept: '*/*'
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
