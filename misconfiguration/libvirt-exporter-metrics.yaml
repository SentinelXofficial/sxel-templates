id: libvirt-exporter-metrics
brief:
    title: Libvirt Exporter Metrics
    by: DhiyaneshDk
    level: low
    about: Libvirt Exporter is leaking metrics.
    label:
        - libvirt
        - exposure
        - debug
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/metrics'
      signs:
        - "on": word
          has:
            - '# HELP'
            - libvirt_
          in: body
          need: all
        - "on": status
          status:
            - 200
