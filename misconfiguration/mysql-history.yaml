id: mysql-history
brief:
    title: Mysql History - File Disclosure
    by: kazet
    level: low
    about: The mysql_history file is a history file used by the MySQL command-line client (mysql) to store a record of the SQL commands and statements entered by a user during their interactive MySQL sessions...
    label:
        - misconfig
        - disclosure
        - config
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.mysql_history'
      signs:
        - "on": word
          has:
            - _HiStOrY_V2_
            - show databases;
          in: body
          need: all
        - "on": word
          has:
            - application/octet-stream
            - text/plain
            - filename=".mysql_
          in: header
          need: all
        - "on": word
          has:
            - <?xml
            - <env
            - application/javascript
            - application/json
            - application/xml
            - html>
            - text/html
            - image/
          in: response
          need: all
        - "on": status
          status:
            - 200
