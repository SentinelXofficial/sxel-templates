id: metadata-service-hetzner
brief:
    title: Hetzner Cloud Metadata Service Check
    by: sullo
    level: critical
    about: The Hetzner Cloud host is configured as a proxy which allows access to the instance metadata service. This could allow significant access to the host/infrastructure.
    label:
        - exposure
        - config
        - hetzner
        - proxy
        - misconfig
        - metadata
        - vuln
    score: CVSS:9.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}http://{{hostval}}/v1/metadata/private-networks'
      signs:
        - "on": word
          has:
            - 'alias_ips:'
            - 'local-ipv4:'
            - 'instance-id:'
          in: body
