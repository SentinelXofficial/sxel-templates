id: metadata-service-aws
brief:
    title: Amazon AWS Metadata Service Check
    by: sullo
    level: critical
    about: The host is configured as a proxy which allows access to the metadata provided by a cloud provider such as AWS or OVH. This could allow significant access to the host/infrastructure.
    label:
        - exposure
        - proxy
        - aws
        - amazon
        - misconfig
        - metadata
        - vuln
    score: CVSS:9.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}http://{{hostval}}/latest/meta-data/'
      signs:
        - "on": word
          has:
            - public-ipv4
            - privateIp
          in: body
