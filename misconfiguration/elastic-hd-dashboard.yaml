id: elastic-hd-dashboard
brief:
    title: Elastic HD Dashboard Exposure
    by: tess
    level: low
    about: Elastic HD Dashboard is exposed.
    label:
        - misconfig
        - exposure
        - elastic
        - discovery
moves:
