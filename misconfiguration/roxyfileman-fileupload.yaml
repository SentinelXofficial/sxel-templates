id: roxyfileman-fileupload
brief:
    title: Roxy Fileman 1.4.4 - Arbitrary File Upload
    by: DhiyaneshDK
    level: high
    about: Roxy Fileman 1.4.4 is susceptible to remote code execution via the FORBIDDEN_UPLOADS setting, which is checked when renaming an existing file to a new file extension. An attacker can bypass this ch...
    label:
        - misconfig
        - edb
        - roxy
        - fileman
        - rce
        - fileupload
        - intrusive
        - vuln
    score: CVSS:8.8
