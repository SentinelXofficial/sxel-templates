id: laravel-debug-infoleak
brief:
    title: Laravel Debug Info Leak
    by: pwnhxl
    level: medium
    about: This template can be used to detect a Laravel debug information leak by making a POST-based request.
    label:
        - misconfig
        - laravel
        - debug
        - infoleak
        - vuln
    score: CVSS:6.5
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      signs:
        - "on": word
          has:
            - vendor/laravel/framework/src/Illuminate/
            - MethodNotAllowedHttpException
          in: body
          need: all
        - "on": word
          has:
            - DB_PASSWORD
            - REDIS_PASSWORD
            - MAIL_PASSWORD
            - ALIYUN_ACCESSKEYSECRET
            - ALIYUN_ACCESSKEYID
            - SMS_AUTH_TOKEN
            - APP_KEY
          in: body
          need: all
        - "on": status
          status:
            - 405
