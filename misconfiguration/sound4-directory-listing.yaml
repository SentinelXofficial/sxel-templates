id: sound4-directory-listing
brief:
    title: SOUND4 Impact/Pulse/First/Eco <=2.x - Information Disclosure
    by: arafatansari
    level: medium
    about: The application is vulnerable to sensitive directory indexing / information disclosure vulnerability. An unauthenticated attacker can visit the log directory and disclose the server's log files con...
    label:
        - misconfig
        - listing
        - sound4
        - disclosure
        - packetstorm
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/log/'
      signs:
        - "on": word
          has:
            - <title>Index of /log</title>
            - Parent Directory
          in: body
          need: all
        - "on": status
          status:
            - 200
