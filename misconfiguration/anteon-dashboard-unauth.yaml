id: anteon-dashboard-unauth
brief:
    title: Anteon Dashboard - Unauthenticated
    by: DhiyaneshDk
    level: medium
    about: The Anteon Dashboard was found to be accessible via the /dashboard endpoint without authentication.This exposure may allow unauthorized users to gain insights into internal services, configurations...
    label:
        - anteon
        - misconfig
        - dashboard
        - unauth
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/dashboard'
      signs: []
