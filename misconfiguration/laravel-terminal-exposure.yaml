id: laravel-terminal-exposure
brief:
    title: Laravel Terminal - Exposed
    by: pussycat0x
    level: high
    about: The web application was built on the Laravel framework, with Laravel Terminal enabled and publicly accessible; this was detected in the production environment and led to disclosure of sensitive app...
    label:
        - laravel
        - terminal
        - exposure
        - misconfig
        - rce
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/asf/terminal'
      signs:
        - "on": word
          has:
            - Laravel Terminal
            - terminal.endpoint
          in: body
          need: all
        - "on": status
          status:
            - 200
