id: jboss-web-service
brief:
    title: JBoss Web Service Console - Detect
    by: DhiyaneshDK
    level: low
    about: The JBoss Web Service console discloses the details of the remote system, The console displays all the web services and exposed by the system leading to a potential information disclosure.
    label:
        - jboss
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/jbossws/services'
      signs:
        - "on": word
          has:
            - JBossWS/Services</div>
          in: body
          need: all
        - "on": word
          has:
            - no endpoints deployed
          in: body
          need: all
        - "on": status
          status:
            - 200
