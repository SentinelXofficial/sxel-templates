id: unauthenticated-netdata
brief:
    title: Unauthenticated Netdata
    by: dhiyaneshDk
    level: medium
    about: Netdata is exposed.
    label:
        - netdata
        - unauth
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/v1/data?chart=system.cpu&format=json&points=125&group=average&gtime=0&options=ms%7Cflip%7Cjsonwrap%7Cnonzero&after=-120&dimensions=iowait'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - view_update_every
            - dimensions
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
