id: posteio-installer
brief:
    title: First Poste.io Configuration Installation Wizard
    by: ritikchaddha
    level: high
    about: Poste.io is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - exposure
        - install
        - poste
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/admin/install/server'
      signs:
        - "on": word
          has:
            - <title>Initial server configuration
            - Generate</button>
          in: body
          need: all
        - "on": status
          status:
            - 200
