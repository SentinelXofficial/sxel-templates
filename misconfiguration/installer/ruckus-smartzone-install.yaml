id: ruckus-smartzone-install
brief:
    title: Ruckus SmartZone Exposed Installation
    by: ritikchaddha
    level: high
    about: Ruckus SmartZone is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - ruckus
        - smartzone
        - install
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/adminweb/'
      signs:
        - "on": word
          has:
            - Welcome to the Ruckus
            - Setup Wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
