id: pandora-fms-installer
brief:
    title: Pandora FMS Installation Page - Exposure
    by: DhiyaneshDK
    level: high
    about: Detects exposed Pandora FMS installation page.
    label:
        - misconfig
        - install
        - exposure
        - pandora-fms
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - Pandora FMS - Installation Wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
