id: alma-installer
brief:
    title: Alma Installation Exposure
    by: DhiyaneshDK
    level: high
    about: Alma is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - alma
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/setup/start'
      signs:
        - "on": word
          has:
            - <title>Setup wizard | Alma Installation</title>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
