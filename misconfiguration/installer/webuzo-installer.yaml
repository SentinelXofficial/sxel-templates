id: webuzo-installer
brief:
    title: Webuzo Installer
    by: DhiyaneshDk
    level: high
    about: Webuzo is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - webuzo
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - Webuzo Installer
            - Webuzo Initial Setup
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
