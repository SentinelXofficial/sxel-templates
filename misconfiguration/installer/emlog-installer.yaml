id: emlog-installer
brief:
    title: Emlog Pro - Installation
    by: ritikchaddha
    level: high
    about: Emlog Pro Installation page has been exposed.
    label:
        - emlog
        - install
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - '>MySQL'
            - install.php?action=install
            - emlog
          in: body
          need: all
        - "on": status
          status:
            - 200
