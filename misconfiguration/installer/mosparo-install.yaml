id: mosparo-install
brief:
    title: mosparo Exposed Installation
    by: DhiyaneshDK
    level: high
    about: mosparo is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - mosparo
        - install
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/setup/'
      signs:
        - "on": word
          has:
            - <title>Setup - mosparo
          in: body
          need: all
        - "on": status
          status:
            - 200
