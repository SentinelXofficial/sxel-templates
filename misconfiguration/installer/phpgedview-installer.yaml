id: phpgedview-installer
brief:
    title: PhpGedView Installer Exposure
    by: ritikchaddha
    level: high
    about: PhpGedView is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - phpgedview
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - Installation Wizard
            - phpgedview
          in: body
          need: all
        - "on": status
          status:
            - 200
