id: ampache-music-installer
brief:
    title: Ampache Music Installer
    by: tess
    level: high
    about: Ampache Music is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - ampache
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - 'Ampache :: For the Love of Music - Installation'
            - Choose Installation Language
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
