id: dokuwiki-installer
brief:
    title: DokuWiki Install Exposure
    by: DhiyaneshDk
    level: high
    about: DokuWiki is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - dokuwiki
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - DokuWiki Installer
            - Superuser
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
