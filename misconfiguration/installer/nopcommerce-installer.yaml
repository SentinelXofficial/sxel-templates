id: nopcommerce-installer
brief:
    title: nopCommerce Installer - Detect
    by: DhiyaneshDk
    level: critical
    about: nopCommerce installer panel was detected.
    label:
        - misconfig
        - nopcommerce
        - install
        - vuln
    score: CVSS:9.4
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install'
      signs:
        - "on": word
          has:
            - nopCommerce installation
            - Store information
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
