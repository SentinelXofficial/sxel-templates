id: vtiger-installer
brief:
    title: Vtiger CRM Installer Exposure
    by: DhiyaneshDk
    level: high
    about: Vtiger CRM is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - vtiger
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.php?module=Install&view=Index'
      signs:
        - "on": word
          has:
            - Installation Wizard
            - Welcome to Vtiger CRM
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
