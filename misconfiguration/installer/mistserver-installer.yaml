id: mistserver-installer
brief:
    title: MistServer Installation Wizard - Exposure
    by: DhiyaneshDk
    level: high
    about: MistServer installation/setup wizard is publicly accessible, allowing unauthorized users to create admin accounts and take full control of the streaming server. This is a first-user-wins vulnerabil...
    label:
        - misconfig
        - mistserver
        - install
        - exposure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - MistServer
            - Management Interface
          in: body
          need: all
        - "on": word
          has:
            - Create new account
            - No account has been created yet
            - Select other host
          in: body
          need: all
        - "on": status
          status:
            - 200
