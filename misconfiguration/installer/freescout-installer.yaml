id: freescout-installer
brief:
    title: FreeScout Installer Exposure
    by: DhiyaneshDk
    level: high
    about: FreeScout is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - exposure
        - install
        - freescout
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install'
      signs:
        - "on": word
          has:
            - FreeScout Installer
            - Easy Installation and Setup Wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
