id: clipbucket-installer
brief:
    title: ClipBucket Installer - Exposure
    by: DhiyaneshDk
    level: high
    about: ClipBucket is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - clipbucket
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cb_install/'
      signs:
        - "on": status
          status:
            - 200
