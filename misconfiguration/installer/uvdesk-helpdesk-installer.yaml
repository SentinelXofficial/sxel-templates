id: uvdesk-helpdesk-installer
brief:
    title: UVDesk Helpdesk Installation Page - Exposure
    by: DhiyaneshDK
    level: high
    about: Detects exposed UVDesk Helpdesk Installation page.
    label:
        - misconfig
        - install
        - exposure
        - uvdesk
        - helpdesk
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/#welcome'
      signs:
        - "on": word
          has:
            - UVDesk Helpdesk Community Edition - Installation Wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
