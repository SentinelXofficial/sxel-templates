id: fleetcart-installer
brief:
    title: FleetCart Installation Page - Exposure
    by: DhiyaneshDK
    level: high
    about: Detects exposed FleetCart setup installation pages which could allow unauthorized access or information disclosure.
    label:
        - misconfig
        - install
        - exposure
        - fleetcart
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install'
      signs:
        - "on": word
          has:
            - FleetCart - Installation
          in: body
          need: all
        - "on": status
          status:
            - 200
