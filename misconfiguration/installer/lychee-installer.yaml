id: lychee-installer
brief:
    title: Lychee Installer
    by: DhiyaneshDk
    level: high
    about: Lychee is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - lychee
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install'
      signs:
        - "on": word
          has:
            - Lychee Installer
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
