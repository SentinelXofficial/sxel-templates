id: facturascripts-installer
brief:
    title: FacturaScripts Installer Exposure
    by: DhiyaneshDk
    level: high
    about: FacturaScripts is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - facturascripts
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - FacturaScripts installer
            - connect to the database
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
