id: phpbb-installer
brief:
    title: phpBB Installation File Exposure
    by: DhiyaneshDk
    level: high
    about: phpBB is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - phpbb
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install/app.php'
      signs:
        - "on": word
          has:
            - Installation Panel
            - Introduction
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
