id: unifi-wizard-install
brief:
    title: UniFi Wizard Installer
    by: DhiyaneshDk
    level: high
    about: UniFi Wizard is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - install
        - unifi
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/manage/wizard/'
      signs:
        - "on": word
          has:
            - UniFi Wizard
            - app-unifi-wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
