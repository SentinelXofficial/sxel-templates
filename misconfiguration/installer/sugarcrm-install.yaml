id: sugarcrm-install
brief:
    title: SugarCRM Exposed Installation
    by: ritikchaddha
    level: high
    about: SugarCRM is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - sugar
        - sugarcrm
        - install
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - <title>Sugar Setup Wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
