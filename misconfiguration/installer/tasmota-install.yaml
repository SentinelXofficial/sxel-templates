id: tasmota-install
brief:
    title: Tasmota Installer Exposure
    by: ritikchaddha
    level: high
    about: Tasmota is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - tasmota
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install/'
      signs:
        - "on": word
          has:
            - Install Tasmota
            - Tasmota Installer
          in: body
          need: all
        - "on": status
          status:
            - 200
