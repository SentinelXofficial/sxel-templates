id: kace-sma-installer
brief:
    title: KACE Systems Management Appliance - Installer
    by: ritikchaddha
    level: high
    about: The exposure of the KACE Systems Management Appliance’s installer interface through the /common/setup.php endpoint allowed unauthorized access to the system setup wizard. This interface was publi...
    label:
        - kace
        - sma
        - installer
        - exposure
        - quest
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/common/setup.php'
      signs:
        - "on": word
          has:
            - Initial Setup
            - setup_wizard
            - KACE
          in: body
          need: all
        - "on": status
          status:
            - 200
