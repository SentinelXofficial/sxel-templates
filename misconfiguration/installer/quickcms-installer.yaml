id: quickcms-installer
brief:
    title: QuickCMS Installation Wizard
    by: DhiyaneshDK
    level: high
    about: PMM is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - exposure
        - install
        - quickcms
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install/'
      signs:
        - "on": word
          has:
            - QuickCMS Installation
          in: body
          need: all
        - "on": status
          status:
            - 200
