id: imprivata-installer
brief:
    title: Imprivata Appliance Installation Exposure
    by: ritikchaddha
    level: medium
    about: Imprivata Appliance is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - imprivata
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wizard/base.php'
      signs:
        - "on": word
          has:
            - <title>Appliance Setup Wizard
            - Imprivata
          in: body
          need: all
        - "on": status
          status:
            - 200
