id: bagisto-installer
brief:
    title: Bagisto Installer Exposure
    by: ritikchaddha
    level: high
    about: Bagisto is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - bagisto
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/installer'
      signs:
        - "on": word
          has:
            - Bagisto Installer
          in: body
          need: all
        - "on": status
          status:
            - 200
