id: contentify-installer
brief:
    title: Contentify Installer Exposure
    by: ritikchaddha
    level: high
    about: Contentify is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - contentify
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install'
      signs:
        - "on": word
          has:
            - Contentify - Step 1
            - start the installation
          in: body
          need: all
        - "on": status
          status:
            - 200
