id: open-web-analytics-installer
brief:
    title: Open Web Analytics Installer - Exposure
    by: DhiyaneshDK
    level: high
    about: Open Web Analytics is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - open-web-analytics
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install.php'
      signs:
        - "on": word
          has:
            - Installation - Open Web Analytics
          in: body
          need: all
        - "on": status
          status:
            - 200
