id: yzmcms-installer
brief:
    title: YzmCMS - Installer
    by: ritikchaddha
    level: high
    about: YzmCMS is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - yzmcms
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/application/install/index.php'
      signs:
        - "on": word
          has:
            - 安装程序 - YzmCMS
            - YzmCMS
          in: body
          need: all
        - "on": word
          has:
            - /index.php?step=2
            - /install.css
          in: body
          need: all
        - "on": status
          status:
            - 200
