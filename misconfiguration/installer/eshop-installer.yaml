id: eshop-installer
brief:
    title: EShop Installer Exposure
    by: DhiyaneshDk
    level: high
    about: EShop is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - eshop
        - install
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/install/'
      signs:
        - "on": word
          has:
            - eShop Installer
            - Welcome to Installer
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
