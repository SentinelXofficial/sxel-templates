id: matomo-installer
brief:
    title: Matomo Installer Exposure
    by: DhiyaneshDk
    level: high
    about: Matomo is susceptible to the Installation page exposure due to misconfiguration.
    label:
        - misconfig
        - matomo
        - install
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Matomo
            - Installation status
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
