id: aem-dispatcher-bypass
brief:
    title: Adobe Experience Manager - Dispatcher Bypass
    by: DhiyaneshDK
    level: medium
    about: Detected potential Adobe Experience Manager (AEM) Dispatcher misconfigurations that could have allowed bypassing request filtering, exposing internal endpoints, or permitting unauthorised access to...
    label:
        - adobe
        - aem
        - dispatcher
moves:
    - verb: GET
      to:
        - '{{BaseURL}}{{paths}}'
      signs:
        - "on": word
          has:
            - '"success":true'
            - '"results":'
            - '"hits":'
          in: body
          need: all
        - "on": status
          status:
            - 200
