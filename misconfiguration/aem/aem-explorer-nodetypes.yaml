id: aem-explorer-nodetypes
brief:
    title: Adobe AEM Explorer NodeTypes Exposure
    by: dhiyaneshDk
    level: high
    about: Adobe AEM Explorer NodeTypes is exposed.
    label:
        - misconfig
        - aem
        - adobe
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/crx/explorer/nodetypes/index.jsp'
      signs:
        - "on": word
          has:
            - nodetypeadmin
            - Registered Node Types
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
