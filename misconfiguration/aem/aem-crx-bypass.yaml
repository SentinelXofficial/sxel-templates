        Referer: '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - buildCount
            - downloadName
            - acHandling
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
