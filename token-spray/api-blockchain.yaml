id: api-blockchain
brief:
    title: Blockchain API Test
    by: daffainfo
    level: info
    about: Bitcoin Payment, Wallet & Transaction Data
    label:
        - token-spray
        - blockchain
moves:
    - verb: GET
      to:
        - '{{BaseURL}}https://api.blockchain.com/v3/exchange/accounts'
      head:
        X-API-Token: '{{token}}'
      signs:
        - "on": word
          has:
            - '"currency"'
            - '"balance"'
            - '"available"'
          in: body
          need: all
