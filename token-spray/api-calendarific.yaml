id: api-calendarific
brief:
    title: Calendarific API Test
    by: daffainfo
    level: info
    about: Worldwide Holidays
    label:
        - token-spray
        - calendarific
moves:
    - verb: GET
      to:
        - https://calendarific.com/api/v2/holidays?api_key={{token}}&country=US&year=2021
      signs:
        - "on": word
          has:
            - '"holidays"'
            - '"name"'
            - '"description"'
          in: body
          need: all
