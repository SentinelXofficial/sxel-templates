id: api-currencylayer
brief:
    title: Currencylayer API Test
    by: daffainfo
    level: info
    about: Exchange rates and currency conversion
    label:
        - token-spray
        - currencylayer
moves:
    - verb: GET
      to:
        - http://api.currencylayer.com/live?access_key={{token}}
      signs:
        - "on": word
          has:
            - '"terms"'
            - '"source"'
            - '"quotes"'
          in: body
          need: all
