id: api-linkedin
brief:
    title: LinkedIn API Test
    by: dwisiswant0
    level: info
    about: ""
    label:
        - token-spray
        - linkedin
moves:
    - verb: GET
      to:
        - https://api.linkedin.com/v2/me?oauth2_access_token={{token}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"id":'
            - '"firstName":'
            - '"localized":'
          in: body
          need: all
