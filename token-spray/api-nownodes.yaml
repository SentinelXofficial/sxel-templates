id: api-nownodes
brief:
    title: Nownodes API Test
    by: daffainfo
    level: info
    about: Blockchain-as-a-service solution that provides high-quality connection via API
    label:
        - token-spray
        - nownodes
moves:
    - verb: GET
      to:
        - '{{BaseURL}}https://bsc-blockbook.nownodes.io/api'
      head:
        Content-Type: application/json
        api-key: '{{token}}'
      signs:
        - "on": word
          has:
            - '"coin":'
            - '"host":'
            - '"version":'
          in: body
          need: all
