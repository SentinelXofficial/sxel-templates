id: api-wordcloud
brief:
    title: Word Cloud API Test
    by: daffainfo
    level: info
    about: Easily create word clouds
    label:
        - token-spray
        - wordcloud
moves:
    - verb: POST
      to:
        - '{{BaseURL}}https://textvis-word-cloud-v1.p.rapidapi.com/v1/textToCloud'
      head:
        Content-Length: "349"
        content-type: application/json
        x-rapidapi-host: textvis-word-cloud-v1.p.rapidapi.com
        x-rapidapi-key: '{{token}}'
      body: |-
        {
          "text": "This is a test. I repeat, this is a test. We are only testing the functionality of this api, nothing else. End of test.",
          "scale": 0.5,
          "width": 400,
          "height": 400,
          "colors": [
            "#375E97",
            "#FB6542",
            "#FFBB00",
            "#3F681C"
          ],
          "font": "Tahoma",
          "use_stopwords": true,
          "language": "en",
          "uppercase": false
        }
      signs:
        - "on": word
          has:
            - '{"message":"You are not subscribed to this API."}'
          in: body
