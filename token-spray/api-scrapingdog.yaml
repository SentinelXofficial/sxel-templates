id: api-scrapingdog
brief:
    title: ScrapingDog API Test
    by: daffainfo
    level: info
    about: Proxy API for Web scraping
    label:
        - token-spray
        - scrapingdog
moves:
    - verb: GET
      to:
        - https://api.scrapingdog.com/scrape?api_key={{token}}&url=https://example.com/ip&dynamic=false
      signs:
        - "on": word
          has:
            - <title>Example Domain</title>
          in: body
