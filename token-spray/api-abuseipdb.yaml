id: api-abuseipdb
brief:
    title: AbuseIPDB API - Test
    by: daffainfo
    level: info
    about: AbuseIPDB API test was conducted.
    label:
        - token-spray
        - abuseipdb
moves:
    - verb: POST
      to:
        - '{{BaseURL}}https://api.abuseipdb.com/api/v2/report'
      head:
        Accept: application/json
        Content-Length: "16"
        Content-Type: application/x-www-form-urlencoded
        Key: '{{token}}'
      body: ip=127.0.0.1&categories=18,22&comment=SSH%20login%20attempts%20with%20user%20root.
      signs:
        - "on": word
          has:
            - 'data":'
            - 'ipAddress":'
          in: body
          need: all
