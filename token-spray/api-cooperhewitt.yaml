id: api-cooperhewitt
brief:
    title: Cooper Hewitt API
    by: daffainfo
    level: info
    about: Smithsonian Design Museum
    label:
        - token-spray
        - cooperhewitt
moves:
    - verb: GET
      to:
        - https://api.collection.cooperhewitt.org/rest/?method=api.spec.formats&access_token={{token}}
      signs:
        - "on": word
          has:
            - '"stat":'
            - '"formats":'
            - '"default_format":'
          in: body
          need: all
