id: api-bhagavadgita
brief:
    title: Bhagavad Gita API Test
    by: daffainfo
    level: info
    about: Open Source Shrimad Bhagavad Gita API including 21+ authors translation in Sanskrit/English/Hindi
    label:
        - token-spray
        - bhagavadgita
moves:
    - verb: GET
      to:
        - https://bhagavadgitaapi.in/slok?api_key={{token}}
      signs:
        - "on": word
          has:
            - '"chapter"'
            - '"verse"'
            - '"slok"'
          in: body
          need: all
