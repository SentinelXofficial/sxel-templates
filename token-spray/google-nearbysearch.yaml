id: api-googlenearbysearch
brief:
    title: Google Nearby Search API Test
    by: zzeitlin
    level: info
    about: ""
    label:
        - token-spray
        - google
        - search
        - nearby
moves:
    - verb: GET
      to:
        - https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=-33.8670522,151.1957362&radius=100&types=food&name=harbour&key={{token}}
      signs:
        - "on": word
          has:
            - error_message
          in: body
