id: api-abstract-exchange-rates
brief:
    title: Abstract Api Exchange Rates Test
    by: daffainfo
    level: info
    about: Get live and historical data from 60+ fiat and crypto currencies via a modern REST API
    label:
        - token-spray
        - abstractapi
moves:
    - verb: GET
      to:
        - https://exchange-rates.abstractapi.com/v1/live/?api_key={{token}}&base=USD
      signs:
        - "on": word
          has:
            - '"base":'
            - '"last_updated":'
            - '"exchange_rate":'
          in: body
          need: all
