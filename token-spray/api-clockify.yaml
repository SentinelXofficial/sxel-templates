id: api-clockify
brief:
    title: Clockify API Test
    by: daffainfo
    level: info
    about: Clockify's REST-based API can be used to push/pull data to/from it & integrate it with other systems
    label:
        - token-spray
        - clockify
moves:
    - verb: GET
      to:
        - '{{BaseURL}}https://api.clockify.me/api/v1/user'
      head:
        Content-Type: application/json
        X-Api-Key: '{{token}}'
      signs:
        - "on": word
          has:
            - '"id":'
            - '"email":'
            - '"name":'
          in: body
          need: all
