id: api-exchangerateapi
brief:
    title: ExchangeRate-API API Test
    by: daffainfo
    level: info
    about: Free currency conversion
    label:
        - token-spray
        - exchangerateapi
moves:
    - verb: GET
      to:
        - https://v6.exchangerate-api.com/v6/{{token}}/latest/USD
      signs:
        - "on": word
          has:
            - '"time_next_update_utc"'
            - '"base_code"'
            - '"conversion_rates"'
          in: body
          need: all
