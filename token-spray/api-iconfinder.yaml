id: api-iconfinder
brief:
    title: IconFinder API Test
    by: daffainfo
    level: info
    about: Web Icons
    label:
        - token-spray
        - iconfinder
moves:
    - verb: GET
      to:
        - '{{BaseURL}}https://api.iconfinder.com/v4/icons/search?query=arrow&count=10'
      head:
        Accept: application/json
        Authorization: Bearer {{token}}
      signs:
        - "on": word
          has:
            - '"icons":'
            - '"is_icon_glyph":'
            - '"download_url":'
          in: body
          need: all
