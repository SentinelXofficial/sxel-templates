id: api-proxykingdom
brief:
    title: ProxyKingdom API Test
    by: daffainfo
    level: info
    about: Rotating Proxy API that produces a working proxy on every request
    label:
        - token-spray
        - proxykingdom
moves:
    - verb: GET
      to:
        - https://api.proxykingdom.com/proxy?token={{token}}
      signs:
        - "on": word
          has:
            - '"address"'
            - '"port"'
            - '"protocol"'
          in: body
          need: all
