id: api-opengraphr
brief:
    title: OpenGraphr API Test
    by: daffainfo
    level: info
    about: Really simple API to retrieve Open Graph data from an URL
    label:
        - token-spray
        - opengraphr
moves:
    - verb: GET
      to:
        - https://api.opengraphr.com/v1/og?api_token={{token}}&url=https://google.com
      signs:
        - "on": word
          has:
            - '"title"'
            - '"image"'
            - '"url"'
          in: body
          need: all
