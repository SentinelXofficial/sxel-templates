id: api-abstract-website-scraping
brief:
    title: Abstract Api Web Scraping Test
    by: daffainfo
    level: info
    about: Scrape and extract data from any website, with powerful options like proxy / browser customization, CAPTCHA handling, ad blocking, and more.
    label:
        - token-spray
        - abstractapi
moves:
    - verb: GET
      to:
        - https://scrape.abstractapi.com/v1/?api_key={{token}}&url=https://test.test
      signs:
        - "on": word
          has:
            - '"code":"validation_error"'
            - Reached error page
          in: body
          need: all
