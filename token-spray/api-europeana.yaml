id: api-europeana
brief:
    title: Europeana API Test
    by: daffainfo
    level: info
    about: European Museum and Galleries content
    label:
        - token-spray
        - europeana
moves:
    - verb: GET
      to:
        - https://api.europeana.eu/record/v2/search.json?wskey={{token}}&query=*&rows=0&profile=facets
      signs:
        - "on": word
          has:
            - success
            - apikey
            - action
          in: body
          need: all
