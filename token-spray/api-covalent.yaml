id: api-covalent
brief:
    title: Covalent API Test
    by: daffainfo
    level: info
    about: https://github.com/daffainfo/all-about-apikey/tree/main/covalent
    label:
        - token-spray
        - covalent
moves:
    - verb: GET
      to:
        - https://api.covalenthq.com/v1/3/address/balances_v2/?&key={{token}}
      signs:
        - "on": word
          has:
            - '"address":'
            - '"updated_at":'
            - '"next_update_at":'
          in: body
          need: all
