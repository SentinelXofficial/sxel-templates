id: api-accuweather
brief:
    title: AccuWeather API Test
    by: zzeitlin
    level: info
    about: ""
    label:
        - token-spray
        - accuweather
moves:
    - verb: GET
      to:
        - http://api.accuweather.com/locations/v1/search?language=en-US&apikey={{token}}&q=Athens,%20Greece
      signs:
        - "on": word
          has:
            - '"Version"'
            - '"LocalizedName"'
            - '"DataSets"'
          in: body
          need: all
