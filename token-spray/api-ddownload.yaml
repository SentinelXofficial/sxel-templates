id: api-ddownload
brief:
    title: ddownload API Test
    by: daffainfo
    level: info
    about: File Sharing and Storage
    label:
        - token-spray
        - ddownload
moves:
    - verb: GET
      to:
        - https://api-v2.ddownload.com/api/account/info?key={{token}}
      signs:
        - "on": word
          has:
            - '"storage_left"'
            - '"premium_traffic_left"'
            - '"email"'
          in: body
          need: all
