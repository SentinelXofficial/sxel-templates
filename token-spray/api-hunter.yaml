id: api-hunter
brief:
    title: Hunter API Test
    by: daffainfo
    level: info
    about: API for domain search, professional email finder, author finder and email verifier
    label:
        - token-spray
        - hunter
moves:
    - verb: GET
      to:
        - https://api.hunter.io/v2/domain-search?domain=stripe.com&api_key={{token}}
      signs:
        - "on": word
          has:
            - '"domain"'
            - '"disposable"'
            - '"webmail"'
          in: body
          need: all
