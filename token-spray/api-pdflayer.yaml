id: api-pdflayer
brief:
    title: pdflayer API Test
    by: daffainfo
    level: info
    about: HTML/URL to PDF
    label:
        - token-spray
        - pdflayer
moves:
    - verb: GET
      to:
        - '{{BaseURL}}https://api.pdflayer.com/api/convert?access_key={{token}}&document_url=https://test.test'
      signs:
        - "on": word
          has:
            - '"document_url_not_found"'
            - '"The document URL you specified was not found.'
          in: body
          need: all
