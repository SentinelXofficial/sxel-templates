id: audiocodes-default-login
brief:
    title: AudioCodes 310HD, 320HD, 420HD, 430HD & 440HD - Default Login
    by: d4vy
    level: high
    about: AudioCodes devices 310HD, 320HD, 420HD, 430HD & 440HD contain a default login vulnerability. Default login credentials were discovered. An attacker can obtain access to user accounts and access sen...
    label:
        - iot
        - audiocodes
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.cgi'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user={{username}}&psw={{url_encode(base64("{{password}}"))}}
      signs:
        - "on": word
          has:
            - redirect('/mainform.cgi?go=mainframe.htm')
          in: body
          need: all
        - "on": word
          has:
            - Login failed. Check username and password
          in: body
          need: all
        - "on": status
          status:
            - 200
