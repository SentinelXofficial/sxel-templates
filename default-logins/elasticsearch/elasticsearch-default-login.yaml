id: elasticsearch-default-login
brief:
    title: ElasticSearch - Default Login
    by: Mohammad Reza Omrani | @omranisecurity
    level: high
    about: Elasticsearch default credentials were discovered.
    label:
        - default-login
        - elasticsearch
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/internal/security/login'
      head:
        Content-Type: application/json
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}/login'
        User-Agent: Mozilla/5.0 (Windows; Windows NT 10.1; Win64; x64; en-US) Gecko/20100101 Firefox/49.5
        kbn-version: 8.8.2
        x-kbn-context: '%7B%22name%22%3A%22security_login%22%2C%22url%22%3A%22%2Flogin%22%7D'
      body: '{"providerType":"basic","providerName":"basic","currentURL":"{{BaseURL}}/login","params":{"username":"{{username}}","password":"{{password}}" }}'
      signs:
        - "on": word
          has:
            - 'Set-Cookie: sid='
            - 'kbn-license-sig:'
          in: header
          need: all
        - "on": status
          status:
            - 200
