id: geoserver-default-login
brief:
    title: Geoserver Admin - Default Login
    by: For3stCo1d
    level: high
    about: Geoserver default admin credentials were discovered.
    label:
        - geoserver
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/geoserver/j_spring_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username={{user}}&password={{pass}}
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/geoserver/web/'
      signs: []
