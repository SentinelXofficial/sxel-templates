id: sonarqube-default-login
brief:
    title: SonarQube Default Login - Detect
    by: Ep1cSage
    level: high
    about: SonarQube contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
    label:
        - default-login
        - sonarqube
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/authentication/login'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: login={{username}}&password={{password}}
      signs: []
