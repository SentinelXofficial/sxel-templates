id: minio-default-login
brief:
    title: Minio - Default Login
    by: pikpikcu
    level: high
    about: Minio default admin credentials were discovered.
    label:
        - default-login
        - minio
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/v1/login'
      head:
        Content-Type: application/json
      body: '{"accessKey":"{{username}}","secretKey":"{{password}}"}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/minio/webrpc'
      head:
        Content-Type: application/json
      body: '{"id":1,"jsonrpc":"2.0","params":{"username":"{{username}}","password":"{{password}}"},"method":"Web.Login"}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/minio/webrpc'
      head:
        Content-Type: application/json
      body: '{"id":1,"jsonrpc":"2.0","params":{"username":"{{username}}","password":"{{password}}"},"method":"web.Login"}'
      signs: []
