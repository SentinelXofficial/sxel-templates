id: tiny-filemanager-default-login
brief:
    title: Tiny File Manager - Default Login
    by: shelled
    level: high
    about: Tiny File Manager contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
    label:
        - default-login
        - tiny
        - filemanager
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      signs:
        - "on": word
          has:
            - admin
            - You are logged in
            - Tiny File Manager
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: fm_usr={{user}}&fm_pwd={{pass}}&token={{token}}
      signs:
        - "on": word
          has:
            - admin
            - You are logged in
            - Tiny File Manager
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/?p='
      signs:
        - "on": word
          has:
            - admin
            - You are logged in
            - Tiny File Manager
          in: body
          need: all
        - "on": status
          status:
            - 200
