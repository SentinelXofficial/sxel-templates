id: weblogic-weak-login
brief:
    title: WebLogic Default Login
    by: pdteam
    level: high
    about: WebLogic default login credentials were discovered.
    label:
        - default-login
        - weblogic
        - vulhub
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/console/'
      signs:
        - "on": word
          has:
            - /console/index.jsp
            - ADMINCONSOLESESSION
          in: header
          need: all
        - "on": status
          status:
            - 302
    - verb: POST
      to:
        - '{{BaseURL}}/console/j_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: j_username={{ username }}&j_password={{ password }}&j_character_encoding=UTF-8
      signs:
        - "on": word
          has:
            - /console/index.jsp
            - ADMINCONSOLESESSION
          in: header
          need: all
        - "on": status
          status:
            - 302
