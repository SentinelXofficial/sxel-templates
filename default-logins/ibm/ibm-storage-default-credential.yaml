id: ibm-storage-default-login
brief:
    title: IBM Storage Management Default Login
    by: madrobot
    level: high
    about: IBM Storage Management default admin login credentials were discovered.
    label:
        - default-login
        - ibm
        - storage
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/0/Authenticate'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{BaseURL}}'
      body: j_username={{username}}&j_password={{password}}&continue=&submit=submit+form
      signs:
        - "on": word
          has:
            - /0/Console
            - Property of IBM
          in: body
          need: all
        - "on": word
          has:
            - JSESSIONID
          in: header
          need: all
        - "on": status
          status:
            - 200
