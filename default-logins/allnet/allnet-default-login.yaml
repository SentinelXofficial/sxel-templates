id: allnet-default-login
brief:
    title: Allnet - Default Login
    by: ritikchaddha
    level: high
    about: Allnet contains a default login vulnerability. Default admin login password 'admin' was found.
    label:
        - default-login
        - allnet
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/cgi-bin/dispatcher.cgi?cmd=1'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username={{username}}&password={{password}}&login=1
      signs:
        - "on": word
          has:
            - '>LOGOUT</a>'
            - REBOOT</a>
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/cgi-bin/dispatcher.cgi?cmd=3'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username={{username}}&password={{password}}&login=1
      signs:
        - "on": word
          has:
            - '>LOGOUT</a>'
            - REBOOT</a>
          in: body
          need: all
        - "on": status
          status:
            - 200
