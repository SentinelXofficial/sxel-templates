id: klog-server-default-login
brief:
    title: KLog Server - Default Login
    by: s4e-io
    level: high
    about: KLog Server contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
    label:
        - default-login
        - klog-server
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/actions/entree.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user={{username}}&pswd={{password}}&action=login
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/index.php'
      signs: []
