id: osasi-default-login
brief:
    title: OSASI PLC - Default Login
    by: biero-el-corridor
    level: high
    about: Detected OSASI PLC web interface accessible with default credentials, potentially allowing unauthorized administrative access to industrial control systems.
    label:
        - osasi
        - plc
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/users/login'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}/users/login'
      body: _method=POST&data[User][loginid]=1234&data[User][passwd]=1234
      signs: []
