id: visionhub-default-login
brief:
    title: VisionHub Default Login
    by: Techryptic (@Tech)
    level: high
    about: VisionHub application default admin credentials were accepted.
    label:
        - visionhub
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/VisionHubWebApi/api/Login'
      head:
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - 'Set-Cookie: admin'
          in: header
          need: all
        - "on": word
          has:
            - 'Set-Cookie: adminer_key'
            - Log into OpenMage Admin Page
          in: response
          need: all
        - "on": status
          status:
            - 200
