id: oracle-business-intelligence-login
brief:
    title: Oracle Business Intelligence Default Login
    by: milo2012
    level: high
    about: Oracle Business Intelligence default admin credentials were discovered.
    label:
        - oracle
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/xmlpserver/services/XMLPService'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Type: text/xml
        SOAPAction: '""'
      body: |-
        <soapenv:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:rep="http://xmlns.oracle.com/oxp/service/report">
           <soapenv:Header/>
           <soapenv:Body>
              <rep:createSession soapenv:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">
                 <username xsi:type="xsd:string">{{username}}</username>
                 <password xsi:type="xsd:string">{{password}}</password>
                 <domain xsi:type="xsd:string">bi</domain>
              </rep:createSession>
           </soapenv:Body>
        </soapenv:Envelope>
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - createSessionReturn
          in: body
          need: all
