id: infinispan-default-login
brief:
    title: Infinispan - Default Admin Login
    by: DhiyanesDk
    level: high
    about: The Infinispan REST API was found exposed with the default administrator credentials `admin:password`. An unauthenticated network attacker can authenticate via HTTP Digest and gain full read/write ...
    label:
        - default-login
        - infinispan
        - redhat
        - config
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/rest/v2/cache-managers/default'
      head:
        Accept: application/json
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/rest/v2/cache-managers/default'
      head:
        Accept: application/json
        Authorization: Digest username="{{username}}", realm="{{realm}}", nonce="{{nonce}}", uri="/rest/v2/cache-managers/default", qop=auth, nc=00000001, cnonce="0a4f113b", response="{{md5(concat(md5(concat(username,":",realm,":",password)),":",nonce,":00000001:0a4f113b:auth:",md5("GET:/rest/v2/cache-managers/default")))}}", algorithm=MD5
      signs: []
