id: barco-clickshare-default-login
brief:
    title: Barco ClickShare - Default Login
    by: ritikchaddha
    level: high
    about: Barco ClickShare contains a default login vulnerability. Default login password 'admin' was found.
    label:
        - default-login
        - barco
        - clickshare
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/login/log_me_in'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: csrf_protection_token={{token}}&username={{username}}&password={{password}}&eula_accepted=true
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/configuration_wizard'
      signs: []
