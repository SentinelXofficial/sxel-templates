id: prtg-default-login
brief:
    title: PRTG Network Monitor - Hardcoded Credentials
    by: johnk3r
    level: high
    about: PRTG Network Monitor contains a hardcoded credential vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operati...
    label:
        - prtg
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/public/checklogin.htm'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: loginurl=&username={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - OCTOPUS
            - /home
          in: header
          need: all
        - "on": status
          status:
            - 302
