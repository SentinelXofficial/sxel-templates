id: hongdian-default-login
brief:
    title: Hongdian Default Login
    by: gy741
    level: high
    about: Hongdian default login information was detected.
    label:
        - hongdian
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": word
          has:
            - status_main.cgi
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": word
          has:
            - status_main.cgi
          in: body
          need: all
        - "on": status
          status:
            - 200
