id: secnet-ac-default-password
brief:
    title: secnet ac - Default Admin Login
    by: ritikchaddha
    level: high
    about: secnet ac default admin credentials were successful.
    label:
        - default-login
        - secnet
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.cgi'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - window.open('index.htm
          in: body
          need: all
        - "on": word
          has:
            - ac_userid={{username}},ac_passwd=
          in: header
          need: all
        - "on": status
          status:
            - 200
