id: ciphertrust-default-login
brief:
    title: Ciphertrust - Default Login
    by: SleepingBag945
    level: high
    about: Attackers can control the entire platform through the default password （initpass） vulnerability, and use administrator privileges to operate core functions.
    label:
        - default-login
        - ciphertrust
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/v1/auth/tokens/'
      head:
        Content-Type: application/json
      body: '{"username":"{{username}}","connection":"local_account","password":"{{password}}","grant_type":"password","refresh_token_revoke_unused_in":30,"cookies":true,"labels":["web-ui"]}'
      signs: []
