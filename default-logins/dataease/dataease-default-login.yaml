id: dataease-default-login
brief:
    title: Dataease - Default Login
    by: DhiyaneshDK
    level: high
    about: Dataease has a built-in account demo/dataease, and many developers forget to delete or change the account password.
    label:
        - default-login
        - dataease
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/auth/login'
      head:
        Content-Type: application/json
      body: |
        {
          "username": "HmFJtDmMa9MZjlWEpCNAo7Yh/hRBI7mrCRfFTok7wES7qcpIJ04x0OQXW5fwtL4WtN29408wyAupmtMjvvXjag==",
          "password": "sL+oQsnErJMYGiLyzXj/Hy2opaZcSnfjGtYtm48q8tdkkINxzTtAOFI2NgDoorchFE790vWQYIgo1CMyjJ2jnw==",
          "loginType": 0
        }
      signs:
        - "on": word
          has:
            - '"success":true'
            - '"token":'
          in: body
          need: all
        - "on": status
          status:
            - 200
