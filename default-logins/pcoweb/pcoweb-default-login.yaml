id: pcoweb-default-login
brief:
    title: pCOWeb - Default-Login
    by: ritikchaddha
    level: high
    about: ""
    label:
        - pcoweb
        - default-login
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/config/pw_left_bar.html'
      head:
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - System is using
            - pCOWeb
            - Configuration
          in: response
          need: all
        - "on": status
          status:
            - 200
