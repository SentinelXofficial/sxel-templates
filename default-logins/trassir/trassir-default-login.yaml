id: trassir-default-login
brief:
    title: Trassir WebView Default Login - Detect
    by: gtrrnr
    level: high
    about: Trassir WebView contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
    label:
        - default-login
        - trassir
        - webview
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login'
      body: username={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - '"success" :'
            - '"sid" :'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
