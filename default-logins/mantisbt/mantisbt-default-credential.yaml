id: mantisbt-default-credential
brief:
    title: MantisBT Default Admin Login
    by: For3stCo1d
    level: high
    about: A MantisBT default admin login was discovered.
    label:
        - mantisbt
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login_password_page.php'
      signs:
        - "on": word
          has:
            - View Issues
            - Change Log
          in: body_4
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/login_password_page.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: MANTIS_secure_session=1; PHPSESSID={{session}}
      body: return=index.php&username={{username}}
      signs:
        - "on": word
          has:
            - View Issues
            - Change Log
          in: body_4
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/login_password_page.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: MANTIS_secure_session=1; PHPSESSID={{session}}
      body: return=index.php&username={{username}}&password={{password}}&secure_session=on
      signs:
        - "on": word
          has:
            - View Issues
            - Change Log
          in: body_4
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/my_view_page.php'
      signs:
        - "on": word
          has:
            - View Issues
            - Change Log
          in: body_4
          need: all
        - "on": status
          status:
            - 200
