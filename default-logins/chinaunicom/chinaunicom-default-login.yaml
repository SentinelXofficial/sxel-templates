id: chinaunicom-default-login
brief:
    title: China Unicom Modem Default Login
    by: princechaddha
    level: high
    about: Default login credentials were discovered for a China Unicom modem.
    label:
        - chinaunicom
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/cu.html'
      body: frashnum=&action=login&Frm_Logintoken=1&Username={{username}}&Password={{password}}&Username=&Password=
      signs:
        - "on": status
          status:
            - 302
        - "on": word
          has:
            - /menu.gch
          in: header
          need: all
