id: tomcat-examples-login
brief:
    title: Apache Tomcat - Default Login Discovery
    by: 0xelkomy & C0NQR0R
    level: info
    about: Apache Tomcat 10.1.0-M1 to 10.1.0-M16, 10.0.0-M1 to 10.0.22, 9.0.30 to 9.0.64 and 8.5.50 to 8.5.81  default login credentials were successful.
    label:
        - default-login
        - tomcat
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/examples/jsp/security/protected/index.jsp'
      signs:
        - "on": word
          has:
            - You are logged in as remote user
            - '{{username}}'
          in: body
          need: all
    - verb: POST
      to:
        - '{{BaseURL}}/examples/jsp/security/protected/j_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: j_username={{username}}&j_password={{password}}
      signs:
        - "on": word
          has:
            - You are logged in as remote user
            - '{{username}}'
          in: body
          need: all
