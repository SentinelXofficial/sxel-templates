id: apache-hertzbeat-default-login
brief:
    title: Apache HertzBeat - Default Credentials
    by: securitytaters
    level: high
    about: Apache HertzBeat enables default admin (and others) credentials. An attacker can execute unauthorized operations.
    label:
        - apache
        - hertzbeat
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/account/auth/form'
      head:
        Content-Type: application/json
      body: '{"type":0,"identifier":"{{username}}","credential":"{{password}}"}'
      signs:
        - "on": word
          has:
            - '"token":'
            - '{"data":{'
            - 'role":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
