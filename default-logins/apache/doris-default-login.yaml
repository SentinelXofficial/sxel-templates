id: doris-default-login
brief:
    title: Apache Doris - Default Login
    by: icarot
    level: high
    about: Tests if Apache Doris Panel, it is an easy-to-use, high performance and unified analytics database, is using the default password on root/admin user accounts.
    label:
        - apache
        - default-login
        - doris
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/rest/v1/login'
      head:
        Authorization: Basic {{basicAuth}}
        Content-Type: application/json; charset=utf-8
      signs:
        - "on": word
          has:
            - msg":"Login success!"
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
