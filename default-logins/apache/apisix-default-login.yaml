id: apisix-default-login
brief:
    title: Apache Apisix Admin - Default Login
    by: pdteam
    level: high
    about: An Apache Apisix default admin login was discovered.
    label:
        - apisix
        - apache
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/apisix/admin/user/login'
      head:
        Accept: application/json
        Authorization: ""
        Content-Type: application/json;charset=UTF-8
      body: '{"username":"{{user}}","password":"{{pass}}"}'
      signs:
        - "on": word
          has:
            - '"data":'
            - '"token":'
            - '{"code":0'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
