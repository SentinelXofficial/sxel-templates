id: apache-syncope-default-login
brief:
    title: Apache Syncope - Default Login
    by: icarot
    level: high
    about: The Apache Syncope server is configured with default administrative credentials, allowing an attacker to perform unauthorized operations. This template verifies the use of the default username admi...
    label:
        - apache
        - syncope
        - default-login
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/syncope-console/login'
      head:
        Cookie: JSESSIONID=333333444444AAAA555555556666;
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/syncope-console{{location}}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/syncope-console{{loginsubmit}}'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Origin: '{{RootURL}}'
        Wicket-Ajax: "true"
        Wicket-Ajax-BaseURL: '{{location}}'
        X-Requested-With: XMLHttpRequest
      body: username={{username}}&password={{password}}&language=0&domain=0&p%3A%3Asubmit=1
      signs:
        - "on": word
          has:
            - <ajax-response><redirect><![CDATA[.]]></redirect></ajax-response>
            - <ajax-response><redirect><![CDATA[../]]></redirect></ajax-response>
          in: body
          need: all
        - "on": status
          status:
            - 200
