id: couchdb-default-login
brief:
    title: CouchDB - Default Login
    by: thefoggiest
    level: high
    about: CouchDB weak admin credentials were discovered.
    label:
        - default-login
        - couchdb
        - misconfig
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/_session'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: name={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - '{"ok":true'
            - '"name":"'
            - '"roles":['
          in: body
          need: all
        - "on": word
          has:
            - application/json
            - AuthSession=
          in: header
          need: all
        - "on": status
          status:
            - 200
