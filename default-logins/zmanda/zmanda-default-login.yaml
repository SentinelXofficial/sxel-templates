id: zmanda-default-login
brief:
    title: Zmanda Default Login
    by: Techryptic (@Tech)
    level: high
    about: Zmanda default admin credentials admin:admin were discovered.
    label:
        - zmanda
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ZMC_Admin_Login'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: zmc_cookies_enabled=true
      body: login=AEE&last_page=&username={{username}}&password={{password}}&submit=Login&JS_SWITCH=JS_ON
      signs:
        - "on": word
          has:
            - ZMC - Backup Set Management
          in: body
          need: all
        - "on": status
          status:
            - 200
