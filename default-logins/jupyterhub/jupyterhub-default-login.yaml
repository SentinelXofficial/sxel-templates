id: jupyterhub-default-login
brief:
    title: Jupyterhub - Default Admin Discovery
    by: For3stCo1d
    level: high
    about: Jupyterhub default admin credentials were discovered.
    label:
        - jupyterhub
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/hub/login?next='
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username={{user}}&password={{pass}}
      signs:
        - "on": status
          status:
            - 302
