id: loytec-default-password
brief:
    title: Loytec PLC - Default Login
    by: biero-el-corridor
    level: high
    about: Identified Loytec PLC web interfaces that were accessible using default credentials (admin:loytec4u). These devices were commonly deployed in building automation and industrial control environments...
    label:
        - loytec
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/webui/login'
      head:
        Content-Type: application/x-www-form-urlencoded
        X-Create-Session: "1"
      body: username={{username}}&password={{password}}&login=Login
      signs:
        - "on": word
          has:
            - '"sessUser":"admin"'
            - '"loggedIn":true'
          in: body
          need: all
        - "on": status
          status:
            - 200
