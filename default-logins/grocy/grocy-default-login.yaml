id: grocy-default-login
brief:
    title: Grocy - Default Admin Credentials
    by: 0x_Akoko
    level: high
    about: Detected Grocy was found using default credentials admin:admin.Successful authentication grants full access to the household management platform including all stock data, chores, recipes, and user ...
    label:
        - default-login
        - grocy
        - auth
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login'
      head:
        Accept: text/html
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/login'
      head:
        Accept: text/html
        Content-Type: application/x-www-form-urlencoded
      body: username={{username}}&password={{password}}
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/stockoverview'
      head:
        Accept: text/html
      signs: []
