id: cambium-networks-default-login
brief:
    title: Canopy 5.7GHz Access Point - Default Login
    by: defektive
    level: high
    about: Cambium Networks / Motorola Canopy 5750AP ADVANTAGE Access Point 5.7GHz login credentials were discovered.
    label:
        - default-login
        - cambium
        - canopy
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.cgi'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: '&Session=0&CanopyUsername={{username}}&CanopyPassword={{password}}&login=Login&webguisubmit=submit'
      signs:
        - "on": word
          has:
            - Logged in as root
          in: body
          need: all
        - "on": status
          status:
            - 200
