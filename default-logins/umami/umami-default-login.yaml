id: umami-default-login
brief:
    title: Umami Default Login
    by: barthy.koeln
    level: high
    about: Umami default admin credentials were discovered.
    label:
        - umami
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/auth/login'
      head:
        Content-Type: application/json; charset=utf-8
      body: '{"username":"{{username}}","password":"{{password}}"}'
      signs:
        - "on": word
          has:
            - '"token":'
            - '"username":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
