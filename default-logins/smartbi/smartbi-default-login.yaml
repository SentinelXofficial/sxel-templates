id: smartbi-default-login
brief:
    title: SmartBI - Default Login
    by: SleepingBag945
    level: high
    about: Smartbi Default User Weak Password were discovered.
    label:
        - smartbi
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}{{path}}'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: className=UserService&methodName=loginFromDB&params=["{{role}}","0a"]
      signs:
        - "on": word
          has:
            - '"result":true'
            - '"retCode":0'
          in: body
          need: all
        - "on": word
          has:
            - text/plain
          in: header
          need: all
        - "on": status
          status:
            - 200
