id: ricoh-default-login
brief:
    title: Ricoh Default Login
    by: gy741
    level: high
    about: Ricoh default admin credentials were discovered.
    label:
        - ricoh
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/web/guest/tw/websys/webArch/login.cgi'
      head:
        Cookie: cookieOnOffChecker=on;
      body: wimToken=&userid_work=&userid={{base64(username)}}&password_work=&password=&open=
      signs:
        - "on": status
          status:
            - 302
