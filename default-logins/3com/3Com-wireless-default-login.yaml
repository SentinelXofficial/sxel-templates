id: 3Com-wireless-default-login
brief:
    title: 3Com Wireless 8760 Dual Radio - Default Login
    by: ritikchaddha
    level: high
    about: 3COM Wireless 8760 Dual Radio contains a default login vulnerability. Default admin login password 'password' was found.
    label:
        - default-login
        - 3com
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.htm'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: userid={{username}}&passwd={{password}}&Submit=LOGIN
      signs:
        - "on": word
          has:
            - alt="Advanced Configuration"
            - image/setup_wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/login.html'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - alt="Advanced Configuration"
            - image/setup_wizard
          in: body
          need: all
        - "on": status
          status:
            - 200
