id: traggo-default-login
brief:
    title: Traggo - Default Login
    by: 0x_Akoko
    level: high
    about: Detected Traggo time tracking application was found using default admin credentials.
    label:
        - traggo
        - default-login
        - time-tracking
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
      head:
        Content-Type: application/json
      body: '{"operationName":"Login","variables":{"name":"{{username}}","pass":"{{password}}","deviceType":"ShortExpiry"},"query":"mutation Login($name: String!, $pass: String!, $deviceType: DeviceType!) {\n  login(username: $name, pass: $pass, deviceName: \"web ui\", type: $deviceType, cookie: true) {\n    user {\n      id\n      name\n      admin\n      __typename\n    }\n    __typename\n  }\n}\n"}'
      signs: []
