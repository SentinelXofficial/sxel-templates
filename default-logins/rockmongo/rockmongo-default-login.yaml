id: rockmongo-default-login
brief:
    title: Rockmongo Default Login
    by: pikpikcu
    level: high
    about: Rockmongo default admin credentials were discovered.
    label:
        - rockmongo
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php?action=login.index'
      head:
        Content-Type: application/x-www-form-urlencoded
        Referer: '{{Hostname}}/index.php?action=login.index'
      body: more=0&host=0&username={{username}}&password={{password}}&db=&lang=en_us&expire=3
      signs:
        - "on": word
          has:
            - 'Location: /index.php?action=admin.index&host=0'
            - 'Set-Cookie: ROCK_LANG='
          in: header
          need: all
        - "on": status
          status:
            - 302
