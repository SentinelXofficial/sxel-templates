id: dlink-centralized-default-login
brief:
    title: D-Link AC Centralized Management System - Default Login
    by: SleepingBag945
    level: high
    about: D-Link AC Centralized Management System default login credentials were discovered.
    label:
        - default-login
        - dlink
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.cgi'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - Set-Cookie
            - ac_userid
          in: header
          need: all
        - "on": word
          has:
            - window.open
          in: body
          need: all
