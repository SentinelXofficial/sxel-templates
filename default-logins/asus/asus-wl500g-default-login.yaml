id: asus-wl500g-default-login
brief:
    title: ASUS WL-500G - Default Login
    by: ritikchaddha
    level: high
    about: ASUS WL-500 contains a default login vulnerability. Default admin login password 'admin' was found.
    label:
        - default-login
        - asus
        - wl-500
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.asp'
      head:
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - 401 Unauthorized
          in: body
          need: all
        - "on": word
          has:
            - '"Main_Index_AccessPoint.asp'
            - Main_List.asp
          in: body
          need: all
        - "on": status
          status:
            - 200
