id: asus-rtn16-default-login
brief:
    title: ASUS RT-N16 - Default Login
    by: ritikchaddha
    level: high
    about: ASUS RT-N16 contains a default login vulnerability. Default admin login password 'admin' was found.
    label:
        - default-login
        - asus
        - rt-n16
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      head:
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - ASUS
            - RT-N16
            - System Status
            - Network Map
          in: body
          need: all
        - "on": status
          status:
            - 200
