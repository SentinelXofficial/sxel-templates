id: zabbix-default-login
brief:
    title: Zabbix Default Login
    by: pdteam
    level: high
    about: Zabbix default admin credentials were discovered.
    label:
        - zabbix
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}{{path}}'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
      body: name={{username}}&password={{password}}&autologin=1&enter=Sign+in
      signs:
        - "on": word
          has:
            - zabbix.php?action=dashboard.view
          in: header
          need: all
        - "on": status
          status:
            - 302
