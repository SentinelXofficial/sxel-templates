id: pensando-default-login
brief:
    title: AMD Pensando PSM - Default Login
    by: tpierru
    level: high
    about: The AMD Pensando Policy and Services Manager used a default password for the admin account.This allowed instances to be accessed using the default credentials.
    label:
        - pensando
        - default-login
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/v1/login'
      head:
        Content-Type: application/json
      body: '{"username":"{{username}}","password":"{{password}}","tenant":"default"}'
      signs: []
