id: rseenet-default-login
brief:
    title: Advantech R-SeeNet Default Login
    by: princechaddha
    level: high
    about: Advantech R-SeeNet default admin credentials were discovered. R-SeeNet is a software system used for monitoring of status and functions of Advantech routers.
    label:
        - rseenet
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: page=login_change&oper=0&username={{user}}&password={{pass}}&submit=Login
      signs:
        - "on": word
          has:
            - User is succesfully logged.
          in: body
          need: all
