id: solarwinds-default-admin
brief:
    title: SolarWinds Orion Default Login
    by: dwisiswant0
    level: high
    about: SolarWinds Orion default admin credentials were discovered.
    label:
        - solarwinds
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/SolarWinds/InformationService/v3/Json/Query?query=SELECT+Uri+FROM+Orion.Pollers+ORDER+BY+PollerID+WITH+ROWS+1+TO+3+WITH+TOTALROWS'
      head:
        Authorization: Basic {{base64(username)}}
      signs:
        - "on": word
          has:
            - 'Content-Type: application/json'
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/InformationService/v3/Json/Query?query=SELECT+Uri+FROM+Orion.Pollers+ORDER+BY+PollerID+WITH+ROWS+1+TO+3+WITH+TOTALROWS'
      head:
        Authorization: Basic {{base64(username)}}
      signs:
        - "on": word
          has:
            - 'Content-Type: application/json'
          in: header
          need: all
        - "on": status
          status:
            - 200
