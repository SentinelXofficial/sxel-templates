id: sato-default-login
brief:
    title: Sato - Default Login
    by: y0no
    level: high
    about: Sato using default credentials was discovered.
    label:
        - sato
        - default-login
        - printer
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/WebConfig/lua/auth.lua'
      head:
        Content-Type: application/x-www-form-urlencoded
        Referer: '{{BaseURL}}'
      body: group={{username}}&pw={{password}}
      signs:
        - "on": word
          has:
            - '"r":0'
            - groups":["user
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
