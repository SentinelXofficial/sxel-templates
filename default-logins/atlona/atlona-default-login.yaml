id: atlona-default-login
brief:
    title: Atlona AT-OME-MS42 - Default Login
    by: matejsmycka
    level: high
    about: The Atlona AT-OME-MS42, a 4x2 matrix switcher supporting HDMI, USB-C, and DisplayPort inputs, is accessible via a built-in web management interface. By default, this interface uses the factory-set ...
    label:
        - atlona
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/cgi-bin/login.cgi?ssid={{base64(''admin:Atlona'')}}'
      head:
        Accept: application/json, text/javascript, */*; q=0.01
        Authorization: Basic undefined
        Content-Type: application/json
        Cookie: SSID=
        X-Requested-With: XMLHttpRequest
      signs: []
