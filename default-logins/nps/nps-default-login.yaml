id: nps-default-login
brief:
    title: NPS Default Login
    by: pikpikcu
    level: high
    about: NPS default admin credentials were discovered.
    label:
        - nps
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login/verify'
      head:
        Content-Type: application/x-www-form-urlencoded
        Referer: '{{Hostname}}/login/index'
      body: username={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": word
          has:
            - '"msg": "login success"'
            - '"status": 1'
          in: body
          need: all
        - "on": status
          status:
            - 200
