id: aem-default-login
brief:
    title: Adobe AEM Default Login
    by: random-robbie
    level: high
    about: Adobe AEM default login credentials were discovered.
    label:
        - aem
        - default-login
        - adobe
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/libs/granite/core/content/login.html/j_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Origin: '{{BaseURL}}'
        Referer: '{{BaseURL}}/libs/granite/core/content/login.html'
      body: _charset_=utf-8&j_username={{aem_user}}&j_password={{aem_pass}}&j_validate=true
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - login-token
            - crx.default
          in: header
          need: all
