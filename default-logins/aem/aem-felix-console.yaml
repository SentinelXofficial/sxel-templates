id: aem-felix-console
brief:
    title: Adobe Experience Manager Felix Console - Default Login
    by: DhiyaneshDk
    level: high
    about: Adobe Experience Manager Felix Console contains a default admin login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute una...
    label:
        - default-login
        - misconfig
        - aem
        - adobe
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/system/console/bundles'
        - '{{BaseURL}}///system///console///bundles'
      head:
        Authorization: Basic {{base64(username + ':' + password)}}
      signs:
        - "on": word
          has:
            - <title>Adobe Experience Manager Web Console - Bundles</title>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
