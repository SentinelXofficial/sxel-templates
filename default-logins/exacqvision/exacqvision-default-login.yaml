id: exacqvision-default-login
brief:
    title: ExacqVision Default Login
    by: ELSFA7110
    level: high
    about: ExacqVision Web Service default login credentials (admin/admin256) were discovered.
    label:
        - exacqvision
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/service.web'
      head:
        Connection: close
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: action=login&u={{username}}&p={{password}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": word
          has:
            - '"auth":'
            - '"success": true'
          in: body
          need: all
