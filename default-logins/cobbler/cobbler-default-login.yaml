id: cobbler-default-login
brief:
    title: Cobbler Default Login
    by: c-sh0
    level: high
    about: Cobbler default login credentials for the testing module (testing/testing) were discovered.
    label:
        - cobbler
        - default-login
        - api
        - seclists
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}{{BaseURL}}/cobbler_api'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Type: text/xml
      body: |-
        <?xml version='1.0'?>
        <methodCall>
          <methodName>login</methodName>
          <params>
            <param>
              <value>
                <string>{{username}}</string>
              </value>
            </param>
            <param>
              <value>
                <string>{{password}}</string>
              </value>
            </param>
          </params>
        </methodCall>
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - text/xml
          in: header
          need: all
