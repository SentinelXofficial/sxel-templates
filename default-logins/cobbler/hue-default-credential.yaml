id: hue-default-credential
brief:
    title: Cloudera Hue Default Admin Login
    by: For3stCo1d
    level: high
    about: Cloudera Hue default admin credentials were discovered.
    label:
        - hue
        - default-login
        - oss
        - cloudera
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/hue/accounts/login?next=/'
      signs:
        - "on": status
          status:
            - 302
    - verb: POST
      to:
        - '{{BaseURL}}/hue/accounts/login'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: csrfmiddlewaretoken={{csrfmiddlewaretoken}}&username={{user}}&password={{pass}}&next=%2F
      signs:
        - "on": status
          status:
            - 302
