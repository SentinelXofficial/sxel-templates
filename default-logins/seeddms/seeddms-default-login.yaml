id: seeddms-default-login
brief:
    title: SeedDMS Default Login
    by: alifathi-h1
    level: high
    about: SeedDMS default admin credentials were discovered.
    label:
        - default-login
        - seeddms
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/op/op.Login.php'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: login={{username}}&pwd={{password}}&lang=
      signs:
        - "on": word
          has:
            - 'Location: /out/out.ViewFolder.php'
          in: header
          need: all
        - "on": status
          status:
            - 302
