id: pentaho-default-login
brief:
    title: Pentaho Default Login
    by: pussycat0x
    level: high
    about: Pentaho default admin credentials were discovered.
    label:
        - pentaho
        - default-login
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/pentaho/j_spring_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: j_username={{user}}&j_password={{pass}}
      signs:
        - "on": word
          has:
            - pentaho/Home
            - JSESSIONID=
          in: header
          need: all
        - "on": status
          status:
            - 302
