id: wifisky-default-login
brief:
    title: Wifisky Default Login
    by: pikpikcu
    level: high
    about: Wifisky default admin credentials were discovered.
    label:
        - default-login
        - wifisky
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.php?action=login&type=admin'
      head:
        Accept: '*/*'
        Connection: close
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
      body: username={{username}}&password={{password}}
      signs:
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": word
          has:
            - '"success":"true"'
            - '"data":'
          in: body
          need: all
        - "on": status
          status:
            - 200
