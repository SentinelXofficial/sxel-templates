id: dataiku-default-login
brief:
    title: Dataiku - Default Login
    by: random-robbie
    level: high
    about: Dataiku contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations. This vulnerabil...
    label:
        - default-login
        - dataiku
        - vuln
    score: CVSS:8.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/dip/api/login'
      head:
        Content-Type: application/x-www-form-urlencoded;charset=utf-8
      body: login=admin&password=admin
      signs:
        - "on": word
          has:
            - dss_access_token
          in: header
          need: all
        - "on": status
          status:
            - 200
