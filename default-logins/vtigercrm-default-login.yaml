id: vtigercrm-default-login
brief:
    title: Vtiger CRM - Default Login
    by: icarot
    level: high
    about: Detected a Vtiger CRM instance that enabled default admin credentials.
    label:
        - default-login
        - vtiger
        - vtiger_crm
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: module=Users&action=Authenticate&return_module=Users&return_action=Login&user_name={{username}}&user_password={{password}}
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/index.php?action=index&module=Home'
      signs: []
