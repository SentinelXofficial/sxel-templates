id: pkp-lib-open-redirect
brief:
    title: Open Journal Systems pkp-lib - Open Redirect
    by: ritikchaddha
    level: medium
    about: Public Knowledge Project pkp-lib is vulnerable to Open redirect due to a lack of input sanitization in the setLocale function.
    label:
        - pkp
        - ojs
        - open-journal-system
        - pkp-lib
        - redirect
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.php/index/user/setLocale/NEW_LOCALE?source=@oast.me'
      signs: []
