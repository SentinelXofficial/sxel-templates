id: lottie-backdoor
brief:
    title: Lottie Player - Backdoor
    by: nagli-wiz
    level: critical
    about: Detectes vulnerable compormised version of lottie-player JS Library that were compormised with a Web3 wallet pop-up backdoor.
    label:
        - cdn
        - lottie-player
        - backdoor
        - malware
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - lottie-player@2.0.5
            - lottie-player@2.0.6
            - lottie-player@2.0.7
          in: body
