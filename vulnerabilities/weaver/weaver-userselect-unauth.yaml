id: weaver-userselect-unauth
brief:
    title: OA E-Office UserSelect Unauthorized Access
    by: SleepingBag945
    level: high
    about: OA E-Office UserSelect interface has an unauthorized access vulnerability, through which attackers can obtain sensitive information
    label:
        - weaver
        - e-office
        - oa
        - unauth
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/UserSelect/'
      signs:
        - "on": word
          has:
            - <title>选择人员</title>
            - /UserSelect/dept.php
          in: body
          need: all
        - "on": status
          status:
            - 200
