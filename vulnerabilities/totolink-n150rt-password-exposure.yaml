id: totolink-n150rt-password-exposure
brief:
    title: TOTOLINK N150RT - Password Exposure
    by: ritikchaddha
    level: high
    about: Detects password exposure vulnerability in TOTOLINK N150RT router where sensitive credentials are exposed in the password.htm page.
    label:
        - totolink
        - router
        - exposure
        - credentials
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/password.htm'
      signs:
        - "on": word
          has:
            - orgpassword=
            - orgusername=
          in: body
          need: all
        - "on": word
          has:
            - orgpassword=''
          in: body
          need: all
        - "on": status
          status:
            - 200
