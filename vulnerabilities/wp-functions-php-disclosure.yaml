id: functions-php-disclosure
brief:
    title: functions.php Full Path Disclosure
    by: pussycat0x
    level: low
    about: Detected a full server file path disclosure in the WordPress functions.php file. This exposure revealed sensitive directory information that could have aided attackers in further exploitation.
    label:
        - wordpress
        - functions.php
        - disclosure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/wp-admin/install.php'
        - '{{BaseURL}}/feed/'
        - '{{BaseURL}}/?feed=rss2'
      signs:
        - "on": word
          has:
            - name="generator" content="wordpress
          in: body
    - verb: GET
      to:
        - '{{BaseURL}}/{{path}}'
        - '{{BaseURL}}/wp-content/themes/twentytwentyfour/functions.php'
