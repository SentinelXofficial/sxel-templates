id: wordpress-plugins-lifterlms
brief:
    title: WordPress Plugin lifterlms Listing
    by: pussycat0x
    level: info
    about: Searches for sensitive directories present in the lifterlms plugin.
    label:
        - wordpress
        - listing
        - plugin
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/lifterlms/'
      signs:
        - "on": word
          has:
            - Index of
            - /wp-content/plugins/lifterlms/
          in: body
          need: all
        - "on": status
          status:
            - 200
