id: wordpress-plugins-ultimate-member
brief:
    title: WordPress Plugin Ultimate Member
    by: pussycat0x
    level: info
    about: Searches for sensitive directories present in the ultimate-member plugin.
    label:
        - wordpress
        - listing
        - plugin
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/ultimate-member/'
      signs:
        - "on": word
          has:
            - Index of
            - /wp-content/plugins/ultimate-member/
          in: body
          need: all
        - "on": status
          status:
            - 200
