id: wordpress-redirection-plugin-listing
brief:
    title: WordPress Redirection Plugin Directory Listing
    by: dhiyaneshDk
    level: info
    about: Searches for sensitive directories present in the redirection plugin.
    label:
        - wordpress
        - listing
        - plugin
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/redirection/'
      signs:
        - "on": word
          has:
            - Index of
            - /wp-content/plugins/redirection/
          in: body
          need: all
        - "on": status
          status:
            - 200
