id: wp-statistics-sqli
brief:
    title: WordPress WP Statistics Plugin 13.0.7 - SQL Injection
    by: r3Y3r53
    level: high
    about: WordPress Plugin WP Statistics 13.0.7  contains an unauthenticated Time based SQL injection vulnerability. The plugin does not sanitize and escape the id parameter before using it in a SQL statemen...
    label:
        - time-based-sqli
        - sqli
        - unauth
        - exploitdb
        - wp-statistics
        - wp-plugin
        - wordpress
        - wp
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wp-statistics/readme.txt'
      signs:
        - "on": word
          has:
            - WP Statistics
          in: body
