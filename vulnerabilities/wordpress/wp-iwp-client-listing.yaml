id: wp-iwp-client-listing
brief:
    title: WordPress Plugin Iwp-client Listing
    by: pussycat0x
    level: info
    about: Searches for sensitive directories present in the iwp-client plugin.
    label:
        - wordpress
        - listing
        - plugin
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/iwp-client/'
      signs:
        - "on": word
          has:
            - Index of
            - wp-content/plugins/iwp-client/
          in: body
          need: all
        - "on": status
          status:
            - 200
