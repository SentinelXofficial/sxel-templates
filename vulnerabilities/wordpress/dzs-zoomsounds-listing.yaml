id: dzs-zoomsounds-listing
brief:
    title: WordPress Plugin dzs zoomsounds
    by: pussycat0x
    level: info
    about: Searches for sensitive directories present in the dzs-zoomsounds plugin.
    label:
        - wordpress
        - listing
        - wp-plugin
        - wp
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/dzs-zoomsounds/'
      signs:
        - "on": word
          has:
            - Index of
            - /wp-content/plugins/dzs-zoomsounds
          in: body
          need: all
        - "on": status
          status:
            - 200
