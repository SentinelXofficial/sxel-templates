id: easy-media-gallery-pro-listing
brief:
    title: WordPress Plugin Media Gallery Pro Listing
    by: pussycat0x
    level: info
    about: Searches for sensitive directories present in the easy-media-gallery-pro plugin.
    label:
        - wordpress
        - listing
        - wp-plugin
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/easy-media-gallery-pro/'
      signs:
        - "on": word
          has:
            - Index of
            - wp-content/plugins/easy-media-gallery-pro/
          in: body
          need: all
        - "on": status
          status:
            - 200
