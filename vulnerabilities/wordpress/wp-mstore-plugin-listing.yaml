id: wp-mstore-plugin-listing
brief:
    title: Wordpress Plugin MStore API
    by: pussycat0x
    level: low
    about: Searches for sensitive directories present in the mstore-api plugin.
    label:
        - wordpress
        - listing
        - wp-plugin
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/mstore-api/'
      signs:
        - "on": word
          has:
            - Index of
            - /wp-content/plugins/mstore-api
          in: body
          need: all
        - "on": status
          status:
            - 200
