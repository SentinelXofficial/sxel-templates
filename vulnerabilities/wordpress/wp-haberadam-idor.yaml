id: wp-haberadam-idor
brief:
    title: WordPress Themes Haberadam JSON API - IDOR and Path Disclosure
    by: pussycat0x
    level: low
    about: This template is designed to detect a misconfiguration vulnerability in WordPress themes that use the Haberadam JSON API. This vulnerability can lead to an Insecure Direct Object Reference (IDOR) a...
    label:
        - wordpress
        - idor
        - wp-theme
        - disclosure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/themes/haberadam/api/mobile-info.php?id='
        - '{{BaseURL}}/blog/wp-content/themes/haberadam/api/mobile-info.php?id='
      signs:
        - "on": word
          has:
            - '"status"'
            - '"hava"'
            - '"degree"'
            - '"icon"'
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - text/html
          in: header
          need: all
