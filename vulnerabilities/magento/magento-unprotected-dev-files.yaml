id: magento-unprotected-dev-files
brief:
    title: Magento Unprotected development files
    by: TechbrunchFR
    level: high
    about: Magento version 1.9.2.x includes /dev directories or files that might reveal your passwords and other sensitive information. The /dev directories and files are not protected by default. According t...
    label:
        - magento
        - vuln
moves:
