id: webui-rce
brief:
    title: WebUI 1.5b6 - Remote Code Execution
    by: pikpikcu
    level: critical
    about: WebUI 1.5b6 is vulnerable to remote code execution because the 'mainfile.php' endpoint allows remote attackersto execute arbitrary code via the 'Logon' parameter.
    label:
        - webui
        - rce
        - edb
        - vuln
    score: CVSS:10.0
