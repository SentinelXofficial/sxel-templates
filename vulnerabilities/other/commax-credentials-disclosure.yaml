id: commax-credentials-disclosure
brief:
    title: COMMAX Smart Home Ruvie CCTV Bridge DVR - RTSP Credentials Disclosure
    by: gy741
    level: critical
    about: The COMMAX CCTV Bridge for the DVR service allows an unauthenticated attacker to disclose real time streaming protocol (RTSP) credentials in plain-text.
    label:
        - commax
        - exposure
        - camera
        - iot
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/overview.asp'
      signs:
        - "on": word
          has:
            - DVR Lists
            - rtsp://
            - login_check.js
            - 'MAX USER :'
          in: body
          need: all
