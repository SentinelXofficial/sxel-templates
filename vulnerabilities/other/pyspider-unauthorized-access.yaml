id: pyspider-unauthorized-access
brief:
    title: Pyspider Unauthorized Access
    by: ritikchaddha
    level: high
    about: Unauthorized Access exists in PySpider which is an open-source web crawling and web scraping framework written in Python.
    label:
        - pyspider
        - unauth
        - vuln
