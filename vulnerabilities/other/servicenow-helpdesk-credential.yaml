id: servicenow-helpdesk-credential
brief:
    title: ServiceNow Helpdesk Credential Exposure
    by: ok_bye_now
    level: high
    about: Detection of exposed credentials in help the help desk JS file.
    label:
        - servicenow
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{RootURL}}/HelpTheHelpDesk.jsdbx'
      signs:
        - "on": word
          has:
            - 'var httpPassword = "encrypt:'
          in: body
          need: all
        - "on": status
          status:
            - 200
