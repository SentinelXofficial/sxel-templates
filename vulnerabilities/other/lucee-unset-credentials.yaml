id: lucee-unset-credentials
brief:
    title: Lucee - Unset Credentials
    by: jpg0mez
    level: high
    about: The Lucee admin panel has a first-time setup page which allows any user to set the administrator password.
    label:
        - lucee
        - default-login
        - unauth
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/lucee/admin/web.cfm'
        - '{{BaseURL}}/lucee/admin/server.cfm'
      signs:
        - "on": word
          has:
            - Lucee
            - box">New Password</div>
          in: body
          need: all
        - "on": status
          status:
            - 200
