id: phpwiki-lfi
brief:
    title: phpwiki 1.5.4 - Cross-Site Scripting/Local File Inclusion
    by: 0x_Akoko
    level: high
    about: phpwiki 1.5.4 is vulnerable to cross-site scripting and local file inclusion, and allows remote unauthenticated attackers to include and return the content of locally stored files via the 'index.ph...
    label:
        - xss
        - edb
        - phpwiki
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/phpwiki/index.php/passwd'
      signs:
        - "on": status
          status:
            - 200
