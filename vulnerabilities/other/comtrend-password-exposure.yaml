id: comtrend-password-exposure
brief:
    title: Comtrend ADSL - Remote Code Execution
    by: geeknik
    level: high
    about: Comtrend ADSL CT-5367 C01_R12 router is susceptible to remote code execution. A remote user can execute arbitrary commands via the telnet interface, The password for this interface is leaked to una...
    label:
        - router
        - exposure
        - iot
        - rce
        - edb
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/password.cgi'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - pwdAdmin =
            - pwdSupport =
            - pwdUser =
          in: body
          need: all
