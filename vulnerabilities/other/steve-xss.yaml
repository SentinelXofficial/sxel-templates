    by: clem9669
    level: medium
    about: SteVe contains a cross-site scripting vulnerability. An attacker can inject arbitrary script in the browser of an unsuspecting user in the context of the affected site. This can allow the attacker ...
    label:
        - steve
        - xss
        - oss
        - vuln
    score: CVSS:5.4
moves:
