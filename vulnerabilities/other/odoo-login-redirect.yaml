id: odoo-login-redirect
brief:
    title: Reflected Odoo - Open Redirect
    by: DhiyaneshDk
    level: low
    about: Detected an open redirect vulnerability in Odoo where the redirect parameter in web/login was abused to redirect users to an attacker-controlled external URL after the authentication flow.
    label:
        - redirect
        - odoo
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/web/login?db=asdf&redirect=http://interact.sh'
      signs: []
