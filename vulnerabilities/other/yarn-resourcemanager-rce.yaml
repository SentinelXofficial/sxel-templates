id: yarn-resourcemanager-rce
brief:
    title: Apache Hadoop YARN ResourceManager - Remote Code Execution
    by: pdteam
    level: low
    about: Apache Hadoop YARN ResourceManager is susceptible to remote code execution. An attacker can execute malware, obtain sensitive information, modify data, and/or gain full control over a compromised s...
    label:
        - apache
        - rce
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ws/v1/cluster/apps/new-application'
      signs:
        - "on": word
          has:
            - application-id
            - maximum-resource-capability
          in: body
          need: all
        - "on": status
          status:
            - 200
