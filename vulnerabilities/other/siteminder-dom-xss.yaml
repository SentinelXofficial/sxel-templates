id: siteminder-dom-xss
brief:
    title: SiteMinder - DOM Cross-Site Scripting
    by: clarkvoss
    level: high
    about: SiteMinder contains a cross-site scripting vulnerability in the document object model. An attacker can execute arbitrary script in the browser of an unsuspecting user in the context of the affected...
