id: generic-env
brief:
    title: Generic Env File Disclosure
    by: kazet
    level: high
    about: A .env file was discovered containing sensitive information like database credentials and tokens. It should not be publicly accessible.
    label:
        - config
        - exposure
        - env
        - vuln
    score: CVSS:8.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.env'
        - '{{BaseURL}}/.env.bak'
        - '{{BaseURL}}/.env.dev'
        - '{{BaseURL}}/.env.dev.local'
        - '{{BaseURL}}/.env.development.local'
        - '{{BaseURL}}/.env.prod'
        - '{{BaseURL}}/.env.prod.local'
        - '{{BaseURL}}/.env.production'
        - '{{BaseURL}}/.env.production.local'
        - '{{BaseURL}}/.env.local'
        - '{{BaseURL}}/.env.stage'
        - '{{BaseURL}}/.env.live'
        - '{{BaseURL}}/.env.backup'
        - '{{BaseURL}}/.env.save'
        - '{{BaseURL}}/.env.old'
        - '{{BaseURL}}/.env.www'
        - '{{BaseURL}}/.env_1'
        - '{{BaseURL}}/.env_sample'
        - '{{BaseURL}}/.env.{{DN}}'
        - '{{BaseURL}}/.env.{{SD}}'
        - '{{BaseURL}}/api/.env'
      signs:
        - "on": word
          has:
            - <html
          in: body
          need: all
