id: drupal7-elfinder-rce
brief:
    title: Drupal 7 Elfinder - Remote Code Execution
    by: 1337kro
    level: critical
    about: Identifies Drupal sites with the elfinder library installed, which could be vulnerable to unrestricted file upload through the connector.php file.When this component is detected, the site may be vu...
    label:
        - drupal
        - elfinder
        - filemanager
        - exposure
        - vuln
    score: CVSS:9.8
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/sites/all/libraries/elfinder/connectors/php/connector.php'
      signs:
        - "on": word
          has:
            - '{"cwd":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
