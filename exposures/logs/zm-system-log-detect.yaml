id: zm-system-log-detect
brief:
    title: zm-system-log-detect
    by: pussycat0x
    level: low
    about: Zm system log file exposed.
    label:
        - logs
        - zm
        - exposure
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?view=log'
        - '{{BaseURL}}/zm/?view=log'
      signs:
        - "on": word
          has:
            - <title>ZM - System Log</title>
          in: body
          need: all
        - "on": status
          status:
            - 200
