id: roundcube-log-disclosure
brief:
    title: Roundcube Log Disclosure
    by: dhiyaneshDk
    level: medium
    about: Roundcube Log file was disclosed.
    label:
        - exposure
        - logs
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/roundcube/logs/sendmail'
        - '{{BaseURL}}/roundcube/logs/sendmail.log'
        - '{{BaseURL}}/roundcube/logs/errors.log'
        - '{{BaseURL}}/roundcube/logs/errors'
        - '{{BaseURL}}/webmail/logs/sendmail'
        - '{{BaseURL}}/webmail/logs/sendmail.log'
        - '{{BaseURL}}/webmail/logs/errors.log'
        - '{{BaseURL}}/webmail/logs/errors'
        - '{{BaseURL}}/mail/logs/sendmail'
        - '{{BaseURL}}/mail/logs/sendmail.log'
        - '{{BaseURL}}/mail/logs/errors.log'
        - '{{BaseURL}}/mail/logs/errors'
        - '{{BaseURL}}/logs/sendmail'
        - '{{BaseURL}}/logs/sendmail.log'
        - '{{BaseURL}}/logs/errors.log'
        - '{{BaseURL}}/logs/errors'
      signs:
        - "on": word
          has:
            - 'IMAP Error:'
            - Message for
            - 'DB Error:'
            - 'PHP Error:'
            - 'PHP Warning:'
          in: body
          need: all
        - "on": status
          status:
            - 200
