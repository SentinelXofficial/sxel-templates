id: wp-newsletter-log-exposure
brief:
    title: WordPress Newsletter - Log File Exposure
    by: pussycat0x
    level: medium
    about: The Newsletters plugin for WordPress is vulnerable to Sensitive Information Exposure in all versions up to, and including, 4.9.5. This makes it possible for unauthenticated attackers to extract pot...
    label:
        - wordpress
        - wp-plugin
        - newsletter
        - logs
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/plugins/newsletter/error_log'
        - '{{BaseURL}}/wp-content/plugins/newsletter/classes/Newsletter/Logs.php'
      signs: []
