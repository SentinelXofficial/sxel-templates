id: clockwork-php-page
brief:
    title: Clockwork PHP page exposure
    by: organiccrap
    level: high
    about: Clockwork php page was exposed, which allows admins to profile and debug the application, view database queries, HTTP requests, and other details right from the browser's developer tools.
    label:
        - tech
        - clockwork
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/__clockwork/app'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <title>Clockwork</title>
            - <html ng-app="Clockwork" ng-csp="">
          in: body
          need: all
