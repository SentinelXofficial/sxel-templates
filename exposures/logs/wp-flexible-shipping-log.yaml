id: wp-flexible-shipping-log
brief:
    title: WordPress Flexible Shipping - Log File Exposure
    by: DhiyaneshDk
    level: medium
    about: Detected exposed log files generated by the Flexible Shipping (flexible-shipping) plugin via WooCommerce logging (wc_get_logger).
    label:
        - wordpress
        - wp
        - wp-plugin
        - flexible-shipping
        - log
        - exposure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-content/uploads/wpdesk-logs/wpdesk_debug.log'
      signs: []
