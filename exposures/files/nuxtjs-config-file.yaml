id: nuxtjs-config-file
brief:
    title: Nuxtjs Config File - File Disclosure
    by: DhiyaneshDk
    level: low
    about: Nuxtjs Config file is exposed.
    label:
        - exposure
        - files
        - nuxtjs
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/nuxt.config.js'
      signs:
        - "on": word
          has:
            - export default {
            - 'buildModules: ['
          in: body
          need: all
        - "on": word
          has:
            - application/javascript
          in: content_type
          need: all
