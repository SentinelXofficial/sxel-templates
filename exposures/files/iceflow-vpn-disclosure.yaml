id: iceflow-vpn-disclosure
brief:
    title: ICEFlow VPN Disclosure
    by: pikpikcu
    level: low
    about: ICEFlow VPN internal log file is exposed.
    label:
        - exposure
        - files
        - iceflow
        - logs
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/log/system.log'
        - '{{BaseURL}}/log/vpn.log'
        - '{{BaseURL}}/log/access.log'
        - '{{BaseURL}}/log/warn.log'
        - '{{BaseURL}}/log/error.log'
        - '{{BaseURL}}/log/debug.log'
        - '{{BaseURL}}/log/mobile.log'
        - '{{BaseURL}}/log/firewall.log'
      signs:
        - "on": word
          has:
            - 'ICEFLOW VPN:'
            - ICEFLOW SYSTEM
            - ICEFLOW
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - text/plain
            - ICEFLOW
          in: header
          need: all
