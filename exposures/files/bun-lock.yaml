id: bun-lock
brief:
    title: Bun Lock File Disclosure
    by: noraj
    level: info
    about: The bun.lockb file is similar to the package-lock.json file used by npm or the yarn.lock file used by Yarn. It serves as a lock file that ensures consistent and reproducible installations of depend...
    label:
        - exposure
        - files
        - node
        - npm
        - bun
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/bun.lockb'
      signs:
        - "on": word
          has:
            - bun-lockfile-format-v0
            - '#!/usr/bin/env bun'
          in: body
          need: all
        - "on": word
          has:
            - application/octet-stream
          in: header
          need: all
        - "on": status
          status:
            - 200
