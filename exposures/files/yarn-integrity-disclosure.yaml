id: yarn-integrity-disclosure
brief:
    title: Yarn Integrity File Disclosure
    by: pussycat0x
    level: info
    about: Detected the .yarn-integrity file generated by the Yarn package manager and stored in node_modules/.yarn-integrity.Exposure of this file could have revealed sensitive dependency information and aid...
    label:
        - exposure
        - yarn
        - node
        - npm
        - misconfig
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/node_modules/.yarn-integrity'
        - '{{BaseURL}}/.yarn-integrity'
      signs: []
