id: django-secret-key
brief:
    title: Django Secret Key Exposure
    by: geeknik
    level: high
    about: The Django settings.py file containing a secret key was discovered. An attacker may use the secret key to bypass many security mechanisms and potentially obtain other sensitive configuration inform...
    label:
        - django
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/manage.py'
        - '{{BaseURL}}/settings.py'
        - '{{BaseURL}}/app/settings.py'
        - '{{BaseURL}}/django/settings.py'
        - '{{BaseURL}}/settings/settings.py'
        - '{{BaseURL}}/web/settings/settings.py'
        - '{{BaseURL}}/{{app_name}}/settings.py'
      signs:
        - "on": word
          has:
            - SECRET_KEY =
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
