id: gcloud-credentials
brief:
    title: Google Cloud Credentials
    by: DhiyaneshDK
    level: medium
    about: Google Cloud Crdentials file is exposed.
    label:
        - google
        - cloud
        - devops
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/credentials.db'
        - '{{BaseURL}}/.config/gcloud/credentials.db'
      signs:
        - "on": word
          has:
            - SQLite
            - client_id
          in: body
          need: all
        - "on": word
          has:
            - application/octet-stream
          in: header
          need: all
        - "on": status
          status:
            - 200
