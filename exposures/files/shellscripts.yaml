id: shellscripts
brief:
    title: Public shellscripts
    by: panch0r3d
    level: low
    about: This template checks exposure of bash scripts.
    label:
        - bash
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.build.sh'
        - '{{BaseURL}}/.jenkins.sh'
        - '{{BaseURL}}/.travis.sh'
        - '{{BaseURL}}/install.sh'
        - '{{BaseURL}}/update.sh'
        - '{{BaseURL}}/upload.sh'
        - '{{BaseURL}}/config.sh'
        - '{{BaseURL}}/build.sh'
        - '{{BaseURL}}/setup.sh'
        - '{{BaseURL}}/run.sh'
        - '{{BaseURL}}/backup.sh'
        - '{{BaseURL}}/compile.sh'
        - '{{BaseURL}}/env.sh'
        - '{{BaseURL}}/init.sh'
        - '{{BaseURL}}/startup.sh'
        - '{{BaseURL}}/wp-setup.sh'
        - '{{BaseURL}}/deploy.sh'
        - '{{BaseURL}}/aws.sh'
        - '{{BaseURL}}/reminder.sh'
        - '{{BaseURL}}/mysqlbackup.sh'
        - '{{BaseURL}}/dev2local.sh'
        - '{{BaseURL}}/local2dev.sh'
        - '{{BaseURL}}/local2prod.sh'
        - '{{BaseURL}}/prod2local.sh'
        - '{{BaseURL}}/rsync.sh'
        - '{{BaseURL}}/sync.sh'
        - '{{BaseURL}}/test.sh'
      signs:
        - "on": word
          has:
            - application/x-sh
            - text/plain
            - text/x-sh
          in: header
          need: all
        - "on": status
          status:
            - 200
