id: azure-pipelines-exposed
brief:
    title: Azure Pipelines Configuration File Disclosure
    by: DhiyaneshDk
    level: medium
    about: Azure Pipelines internal critical file is disclosed.
    label:
        - config
        - exposure
        - azure
        - microsoft
        - cloud
        - devops
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.azure-pipelines.yml'
        - '{{BaseURL}}/azure-pipelines.yml'
      signs:
        - "on": word
          has:
            - 'trigger:'
            - 'pool:'
            - 'variables:'
          in: body
          need: all
        - "on": status
          status:
            - 200
