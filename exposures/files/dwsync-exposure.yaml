id: dwsync-exposure
brief:
    title: Dreamweaver Dwsync.xml Exposure
    by: KaizenSecurity
    level: info
    about: The Dreamweaver file dwsync.xml was discovered. The dwsync.xml file is a file generated by Dreamweaver which contains information related to what files are in the website directory.
    label:
        - dwsync
        - exposure
        - dreamweaver
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/_notes/dwsync.xml'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - application/xml
          in: header
          need: all
        - "on": word
          has:
            - <dwsync>
            - </dwsync>
          in: body
          need: all
