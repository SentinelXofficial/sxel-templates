id: symfony-security
brief:
    title: Symfony security.yml File Disclosure
    by: DhiyaneshDK
    level: info
    about: ""
    label:
        - symfony
        - devops
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/security.yml'
        - '{{BaseURL}}/config/security.yml'
        - '{{BaseURL}}/app/config/security.yml'
      signs:
        - "on": word
          has:
            - 'security:'
            - 'providers:'
          in: body
          need: all
        - "on": status
          status:
            - 200
