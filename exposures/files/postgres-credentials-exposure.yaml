id: postgres-credentials-exposure
brief:
    title: PostgreSQL Credentials - Exposure
    by: theamanrawat
    level: high
    about: Detects the exposure of PostgreSQL credentials and history files (.pgpass) via HTTP. These files may contain plaintext database usernames and passwords, and their leakage could allow unauthorized a...
    label:
        - exposure
        - config
        - postgres
        - database
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.pgpass'
      signs:
        - "on": status
          status:
            - 200
