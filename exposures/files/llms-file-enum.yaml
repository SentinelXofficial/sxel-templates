      to:
        - '{{BaseURL}}/llms.txt'
      signs:
        - "on": word
          has:
            - MongoDB over HTTP on the native
            - application/javascript
            - application/x-javascript
            - application/json
            - application/xml
            - text/xml
            - <html
            - <!doctype
            - <script
            - <meta
            - image/
            - Response xmlns
          in: response
          need: all
