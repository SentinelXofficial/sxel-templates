id: salesforce-credentials
brief:
    title: Salesforce Credentials - Detect
    by: geeknik
    level: high
    about: Salesforce credentials information was detected.
    label:
        - exposure
        - files
        - salesforce
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/js/salesforce.js'
        - '{{BaseURL}}/salesforce.js'
      signs:
        - "on": word
          has:
            - jsforce.Connection
            - conn.login
            - conn.query
          in: body
          need: all
        - "on": word
          has:
            - text/plain
          in: header
          need: all
        - "on": status
          status:
            - 200
