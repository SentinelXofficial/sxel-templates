id: dot-credentials-exposure
brief:
    title: Dot Credentials - Exposure
    by: theamanrawat
    level: high
    about: Detected the presence of a .credentials file and extracts sensitive authentication tokens, passwords, or API keys.
    label:
        - exposure
        - config
        - credentials
        - sensitive
        - token
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.credentials'
      signs:
        - "on": word
          has:
            - client_id
            - client_secret
            - access_token
            - refresh_token
            - password
            - aws_access_key_id
          in: body
          need: all
        - "on": word
          has:
            - <html
            - <body
            - <!DOCTYPE
            - <script
            - <?php
          in: body
          need: all
        - "on": status
          status:
            - 200
