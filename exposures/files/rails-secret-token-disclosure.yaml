id: rails-secret-token-disclosure
brief:
    title: Ruby on Rails Secret Token Disclosure
    by: dhiyaneshDk
    level: medium
    about: Ruby on Rals Secret Token file is exposed.
    label:
        - exposure
        - files
        - rails
        - ruby
        - token
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/config/initializers/secret_token.rb'
      signs:
        - "on": word
          has:
            - secret_key_base =
            - config.secret_token =
          in: body
          need: all
        - "on": status
          status:
            - 200
