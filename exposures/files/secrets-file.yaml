id: ruby-secrets-file
brief:
    title: Ruby on Rails secrets.yml File Exposure
    by: DhiyaneshDK
    level: high
    about: Ruby on Rails internal secret file is exposed.
    label:
        - cloud
        - devops
        - files
        - exposure
        - misconfig
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/secrets.yml'
        - '{{BaseURL}}/config/secrets.yml'
        - '{{BaseURL}}/test/config/secrets.yml'
        - '{{BaseURL}}/redmine/config/secrets.yml'
      signs:
        - "on": word
          has:
            - application/json
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
