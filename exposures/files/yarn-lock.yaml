id: yarn-lock
brief:
    title: Yarn Lock File Disclosure
    by: oppsec
    level: info
    about: The yarn.lock file stores the versions of each Yarn dependency installed. It's a lock file for package.json.
    label:
        - exposure
        - files
        - yarn
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/yarn.lock'
      signs:
        - "on": word
          has:
            - '# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.'
            - '# yarn lockfile v1'
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
