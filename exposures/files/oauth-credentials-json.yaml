id: oauth-credentials-json
brief:
    title: Oauth Credentials Json
    by: DhiyaneshDK
    level: low
    about: Oauth Credentials file is exposed.
    label:
        - exposure
        - oauth
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/oauth-credentials.json'
      signs:
        - "on": word
          has:
            - '"client_id":'
            - '"client_secret":'
          in: body
          need: all
        - "on": status
          status:
            - 200
