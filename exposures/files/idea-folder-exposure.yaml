id: idea-folder-exposure
brief:
    title: Public .idea Folder containing files with sensitive data
    by: martincodes-de
    level: info
    about: Searches for .idea Folder by querying the /.idea and a few other files with sensitive data.
    label:
        - phpstorm
        - jetbrains
        - idea
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.idea/deployment.xml'
        - '{{BaseURL}}/.idea/workspace.xml'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <?xml version=
            - <project version
          in: body
          need: all
