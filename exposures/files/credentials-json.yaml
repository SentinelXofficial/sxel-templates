id: credentials-json
brief:
    title: Credentials File Disclosure
    by: ritikchaddha
    level: medium
    about: Internal secret file is exposed.
    label:
        - google
        - secret
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/credentials.json'
        - '{{BaseURL}}/assets/credentials.json'
      signs:
        - "on": word
          has:
            - '"client_secret":'
            - '"client_id":'
          in: body
          need: all
        - "on": status
          status:
            - 200
