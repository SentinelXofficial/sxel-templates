id: ruby-rail-storage
brief:
    title: Ruby on Rails storage.yml File Disclosure
    by: DhiyaneshDK
    level: low
    about: Ruby on Rails storage.yml file is disclosed.
    label:
        - exposure
        - ruby
        - devops
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/storage.yml'
        - '{{BaseURL}}/config/storage.yml'
        - '{{BaseURL}}/ruby/config/storage.yml'
        - '{{BaseURL}}/railsapp/config/storage.yml'
      signs:
        - "on": word
          has:
            - 'service:'
            - 'local:'
          in: body
          need: all
        - "on": word
          has:
            - application/json
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
