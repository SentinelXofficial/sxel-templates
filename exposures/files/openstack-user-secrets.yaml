id: openstack-user-secrets
brief:
    title: OpenStack User Secrets Exposure
    by: geeknik
    level: high
    about: Internal user_secrets.yml file is exposed in OpenStack.
    label:
        - openstack
        - config
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/user_secrets.yml'
        - '{{BaseURL}}/user_secrets.yml.old'
      signs:
        - "on": word
          has:
            - '_password:'
            - OpenStack environment
          in: body
          need: all
        - "on": status
          status:
            - 200
