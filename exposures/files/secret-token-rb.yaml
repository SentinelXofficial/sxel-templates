id: secret-token-rb
brief:
    title: Secret Token Ruby - File Disclosure
    by: DhiyaneshDK
    level: medium
    about: Ruby Secret token is exposed.
    label:
        - redmine
        - devops
        - exposure
        - ruby
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/secret_token.rb'
        - '{{BaseURL}}/config/initializers/secret_token.rb'
        - '{{BaseURL}}/redmine/config/initializers/secret_token.rb'
      signs:
        - "on": word
          has:
            - ::Application.config.secret
          in: body
          need: all
        - "on": status
          status:
            - 200
