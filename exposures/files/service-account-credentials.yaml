id: service-account-credentials
brief:
    title: Service Account Credentials File Disclosure
    by: ritikchaddha
    level: medium
    about: Service Account Credentials internal file is exposed.
    label:
        - privatekey
        - exposure
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/assets/other/service-account-credentials.json'
        - '{{BaseURL}}/service-account-credentials.json'
        - '{{BaseURL}}/serviceAccountCredentials.json'
      signs:
        - "on": word
          has:
            - '"private_key_id":'
            - '"private_key":'
          in: body
          need: all
        - "on": status
          status:
            - 200
