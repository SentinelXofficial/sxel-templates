id: aspnet-launchsettings-exposure
brief:
    title: ASP.NET Launch Settings - Exposure
    by: theamanrawat
    level: medium
    about: Detected exposed launchSettings.json files in ASP.NET Core applications. This file contains environment variables and launch configurations that may leak sensitive information.
    label:
        - aspnet
        - config
        - exposure
        - json
        - dotnet
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/Properties/launchSettings.json'
        - '{{BaseURL}}/launchSettings.json'
      signs:
        - "on": word
          has:
            - profiles
            - iisSettings
            - commandName
            - launchBrowser
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
