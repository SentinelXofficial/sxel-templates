id: database-credentials
brief:
    title: Database Credentials File Exposure
    by: Hardik-Solanki
    level: low
    about: Internal file exposed containing database credentials.
    label:
        - exposure
        - database
        - config
        - files
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/database_credentials.inc'
      signs:
        - "on": word
          has:
            - DATABASE_USER
            - DB_USER
            - USERNAME
            - USER
          in: body
          need: all
        - "on": word
          has:
            - DATABASE_PASS
            - DB_PASS
            - PASSWORD
            - PASS
          in: body
          need: all
        - "on": status
          status:
            - 200
            - 401
            - 403
        - "on": word
          has:
            - Access denied
            - Unauthorized
          in: body
          need: all
        - "on": word
          has:
            - 'Content-Type: text/plain'
            - 'Content-Type: application/json'
          in: header
          need: all
