id: rubygems-credentials-exposure
brief:
    title: Ruby Gem::ConfigFile Credential - Exposure
    by: theamanrawat
    level: high
    about: Ruby Gem credentials file is exposed, potentially leaking RubyGems API keys. The ~/.gem/credentials file stores authentication tokens for publishing gems to RubyGems.org or private gem servers.
    label:
        - exposure
        - rubygems
        - credentials
        - config
        - token
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.gem/credentials'
        - '{{BaseURL}}/credentials'
        - '{{BaseURL}}/.gem/credentials.yaml'
      signs:
        - "on": word
          has:
            - ':rubygems_api_key:'
          in: body
          need: all
        - "on": word
          has:
            - <html
            - <body
            - <!DOCTYPE
            - <script
            - <?php
          in: body
          need: all
        - "on": status
          status:
            - 200
