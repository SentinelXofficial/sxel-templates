id: sql-server-dump
brief:
    title: SQL Server - Dump Files
    by: userdehghani
    level: medium
    about: A SQL Server dump file was found
    label:
        - exposure
        - backup
        - sql-server
        - vuln
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/sa.bak'
        - '{{BaseURL}}/wwwroot.bak'
        - '{{BaseURL}}/backup.bak'
        - '{{BaseURL}}/database.bak'
        - '{{BaseURL}}/data.bak'
        - '{{BaseURL}}/db_backup.bak'
        - '{{BaseURL}}/dbdump.bak'
        - '{{BaseURL}}/db.bak'
        - '{{BaseURL}}/dump.bak'
        - '{{BaseURL}}/{{Hostname}}.bak'
        - '{{BaseURL}}/{{Hostname}}_db.bak'
        - '{{BaseURL}}/localhost.bak'
        - '{{BaseURL}}/mysqldump.bak'
        - '{{BaseURL}}/mysql.bak'
        - '{{BaseURL}}/site.bak'
        - '{{BaseURL}}/sql.bak'
        - '{{BaseURL}}/temp.bak'
        - '{{BaseURL}}/translate.bak'
        - '{{BaseURL}}/users.bak'
        - '{{BaseURL}}/www.bak'
        - '{{BaseURL}}/wp-content/uploads/dump.bak'
        - '{{BaseURL}}/wp-content/mysql.bak'
      head:
        Range: bytes=0-500
      signs:
        - "on": status
          status:
            - 200
