id: mysql-dump
brief:
    title: MySQL - Dump Files
    by: geeknik
    level: medium
    about: A MySQL dump file was found
    label:
        - exposure
        - backup
        - mysql
        - vuln
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/1.sql'
        - '{{BaseURL}}/backup.sql'
        - '{{BaseURL}}/database.sql'
        - '{{BaseURL}}/data.sql'
        - '{{BaseURL}}/db_backup.sql'
        - '{{BaseURL}}/dbdump.sql'
        - '{{BaseURL}}/db.sql'
        - '{{BaseURL}}/dump.sql'
        - '{{BaseURL}}/{{Hostname}}.sql'
        - '{{BaseURL}}/{{Hostname}}_db.sql'
        - '{{BaseURL}}/localhost.sql'
        - '{{BaseURL}}/mysqldump.sql'
        - '{{BaseURL}}/mysql.sql'
        - '{{BaseURL}}/site.sql'
        - '{{BaseURL}}/sql.sql'
        - '{{BaseURL}}/temp.sql'
        - '{{BaseURL}}/translate.sql'
        - '{{BaseURL}}/users.sql'
        - '{{BaseURL}}/www.sql'
        - '{{BaseURL}}/wp-content/uploads/dump.sql'
        - '{{BaseURL}}/wp-content/mysql.sql'
      head:
        Range: bytes=0-3000
      signs:
        - "on": status
          status:
            - 200
            - 206
