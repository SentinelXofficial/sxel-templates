id: wordpress-db-exposure
brief:
    title: WordPress Database Backup File - Exposure
    by: 0x_Akoko
    level: high
    about: Detected WordPress database backup files that were publicly accessible, exposing sensitive data including user credentials, email addresses, and site content.
    label:
        - exposure
        - wordpress
        - backup
        - database
        - sql
        - misconfig
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/backup.sql'
        - '{{BaseURL}}/database.sql'
        - '{{BaseURL}}/db.sql'
        - '{{BaseURL}}/dump.sql'
        - '{{BaseURL}}/mysql.sql'
        - '{{BaseURL}}/{{Hostname}}.sql'
        - '{{BaseURL}}/wp-content/uploads/backup.sql'
        - '{{BaseURL}}/wp-content/uploads/database.sql'
        - '{{BaseURL}}/wp-content/uploads/dump.sql'
        - '{{BaseURL}}/wp-content/uploads/{{Hostname}}.sql'
        - '{{BaseURL}}/wp-content/database.sql'
        - '{{BaseURL}}/backups/database.sql'
      signs: []
