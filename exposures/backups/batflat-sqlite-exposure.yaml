id: batflat-sqlite-exposure
brief:
    title: Batflat SQLite Database - Exposure
    by: DhiyaneshDk
    level: high
    about: Detected exposed Batflat CMS SQLite database files that may contain sensitive information including admin credentials, user data, site configuration, and content. Batflat stores its database in the...
    label:
        - batflat
        - database
        - sqlite
        - unauth
        - backup
        - exposure
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/inc/data/database.sdb'
      signs:
        - "on": status
          status:
            - 200
