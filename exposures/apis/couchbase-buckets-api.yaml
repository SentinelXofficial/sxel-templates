id: couchbase-buckets-api
brief:
    title: Couchbase Buckets Unauthenticated REST API - Detect
    by: geeknik
    level: medium
    about: Couchbase Buckets REST API without authentication was detected.
    label:
        - exposure
        - couchbase
        - discovery
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/pools/default/buckets'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"couchbase":'
            - '"bucket":'
            - '"data":'
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
