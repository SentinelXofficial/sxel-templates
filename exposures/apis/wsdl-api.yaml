id: wsdl-api
brief:
    title: WSDL API - Detect
    by: jarijaas
    level: info
    about: WSDL API was detected.
    label:
        - exposure
        - api
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/?wsdl'
        - '{{BaseURL}}?wsdl'
      signs:
        - "on": word
          has:
            - wsdl:definitions
          in: body
          need: all
        - "on": status
          status:
            - 200
