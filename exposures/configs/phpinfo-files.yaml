id: phpinfo-files
brief:
    title: PHPinfo Page - Detect
    by: pdteam
    level: low
    about: PHPinfo page was detected. The output of the phpinfo() command can reveal sensitive and detailed PHP environment information.
    label:
        - config
        - exposure
        - phpinfo
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/php.php'
        - '{{BaseURL}}/php2.php'
        - '{{BaseURL}}/phpinfo.php'
        - '{{BaseURL}}/info.php'
        - '{{BaseURL}}/infophp.php'
        - '{{BaseURL}}/php_info.php'
        - '{{BaseURL}}/test.php'
        - '{{BaseURL}}/i.php'
        - '{{BaseURL}}/a.php'
        - '{{BaseURL}}/p.php'
        - '{{BaseURL}}/pi.php'
        - '{{BaseURL}}/asdf.php'
        - '{{BaseURL}}/pinfo.php'
        - '{{BaseURL}}/phpversion.php'
        - '{{BaseURL}}/time.php'
        - '{{BaseURL}}/inf0.php'
        - '{{BaseURL}}/index.php'
        - '{{BaseURL}}/temp.php'
        - '{{BaseURL}}/old_phpinfo.php'
        - '{{BaseURL}}/infos.php'
        - '{{BaseURL}}/linusadmin-phpinfo.php'
        - '{{BaseURL}}/php-info.php'
        - '{{BaseURL}}/dashboard/phpinfo.php'
        - '{{BaseURL}}/_profiler/phpinfo.php'
        - '{{BaseURL}}/_profiler/phpinfo'
        - '{{BaseURL}}/?phpinfo=1'
        - '{{BaseURL}}/l.php?act=phpinfo'
        - '{{BaseURL}}/testxx.php'
      signs:
        - "on": word
          has:
            - PHP Extension
            - PHP Version
          in: body
          need: all
        - "on": status
          status:
            - 200
