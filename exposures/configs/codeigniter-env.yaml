id: codeigniter-env
brief:
    title: Codeigniter - .env File Discovery
    by: emenalf
    level: high
    about: Codeigniter .env file was discovered.
    label:
        - config
        - exposure
        - codeigniter
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.env'
        - '{{BaseURL}}/.env.dev.local'
        - '{{BaseURL}}/.env.development.local'
        - '{{BaseURL}}/.env.prod.local'
        - '{{BaseURL}}/.env.production.local'
        - '{{BaseURL}}/.env.local'
        - '{{BaseURL}}/.env.example'
        - '{{BaseURL}}/.env.stage'
        - '{{BaseURL}}/.env.live'
        - '{{BaseURL}}/.env_1'
        - '{{BaseURL}}/.env.old'
        - '{{BaseURL}}/.env_sample'
      signs:
        - "on": status
          status:
            - 200
