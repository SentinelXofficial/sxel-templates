id: n8n-config
brief:
    title: N8n - Config
    by: icarot
    level: medium
    about: The `/rest/settings` endpoint in N8n was publicly exposed, which could have disclosed internal configuration details and sensitive application information.
    label:
        - n8n
        - config
        - exposed
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/rest/settings'
      head:
        Content-Type: application/json
      signs:
        - "on": word
          has:
            - isDocker
            - databaseType
            - nodeJsVersion
            - versionCli
            - instanceId
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: content_type
          need: all
        - "on": status
          status:
            - 200
