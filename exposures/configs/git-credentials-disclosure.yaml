id: git-credentials-disclosure
brief:
    title: Git Credentials - Detect
    by: dhiyaneshDk
    level: medium
    about: Git credentials were detected.
    label:
        - exposure
        - config
        - vuln
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.git-credentials'
      signs:
        - "on": word
          has:
            - https://
            - '@github.com'
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - text/html
          in: header
          need: all
