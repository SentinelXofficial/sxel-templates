id: robomongo-credential
brief:
    title: RoboMongo Credential - Exposure
    by: geeknik
    level: high
    about: A MongoDB credentials file used by RoboMongo was detected.
    label:
        - mongodb
        - robomongo
        - disclosure
        - config
        - exposure
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/db/robomongo.json'
        - '{{BaseURL}}/robomongo.json'
      signs:
        - "on": word
          has:
            - databaseName
            - userName
            - userPassword
            - serverHost
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
