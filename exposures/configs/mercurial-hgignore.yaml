id: mercurial-hgignore
brief:
    title: Mercurial Ignore - File Disclosure
    by: DhiyaneshDK
    level: info
    about: Mercurial Ignore file disclosure was detected.
    label:
        - exposure
        - hgignore
        - config
        - mercurial
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.hgignore'
      signs:
        - "on": word
          has:
            - MongoDB over HTTP on the native
            - application/javascript
            - application/x-javascript
            - application/json
            - application/xml
            - html
            - <!doctype
            - <script
            - <meta
            - image/
            - Response xmlns=
            - text/xml
            - <?xml
          in: response
          need: all
