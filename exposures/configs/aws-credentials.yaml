id: aws-credentials
brief:
    title: AWS Credentials - Detect
    by: m4lwhere
    level: high
    about: AWS credentials found via /.aws/credentials endpoint.
    label:
        - config
        - exposure
        - aws
        - credential
        - vuln
    score: CVSS:9.4
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.aws/credentials'
      signs:
        - "on": status
          status:
            - 200
