id: jkstatus-manager
brief:
    title: JK Status Manager - Detect
    by: pdteam
    level: low
    about: Exposed JKStatus manager which is a web-based tool that allows administrators to monitor and manage the connections between the Apache HTTP Server and the Tomcat application server.
    label:
        - config
        - jk
        - status
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/status'
        - '{{BaseURL}}/jkstatus'
        - '{{BaseURL}}/jkstatus-auth'
        - '{{BaseURL}}/jk-status'
        - '{{BaseURL}}/jkmanager'
        - '{{BaseURL}}/jkmanager-auth'
        - '{{BaseURL}}/jdkstatus'
      head:
        X-Forwarded-For: 127.0.0.1
      signs:
        - "on": word
          has:
            - JK Status Manager
          in: body
