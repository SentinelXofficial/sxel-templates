id: htpasswd-detection
brief:
    title: Apache htpasswd Config - Detect
    by: geeknik
    level: high
    about: Apache htpasswd configuration was detected.
    label:
        - config
        - exposure
        - discovery
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.htpasswd'
      signs:
        - "on": word
          has:
            - :{SHA}
            - :$apr1$
            - :$2y$
          in: body
          need: all
        - "on": status
          status:
            - 200
