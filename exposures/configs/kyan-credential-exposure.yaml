id: kyan-credential-exposure
brief:
    title: Kyan Credential - Exposure
    by: pikpikcu
    level: medium
    about: Kyan Network login panel was detected. Password and other credential theft is possible via accessing this panel.
    label:
        - kyan
        - exposure
        - config
        - vuln
    score: CVSS:5.3
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/hosts'
      signs:
        - "on": word
          has:
            - UserName=
            - Password=
          in: body
          need: all
        - "on": word
          has:
            - text/plain
          in: header
          need: all
        - "on": status
          status:
            - 200
