id: sftp-credentials-exposure
brief:
    title: SFTP Configuration File - Credentials Exposure
    by: geeknik
    level: high
    about: SFTP configuration file was detected.
    label:
        - sftp
        - config
        - exposure
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/sftp-config.json'
        - '{{BaseURL}}/ftpsync.settings'
      signs:
        - "on": word
          has:
            - '"host":'
            - '"user":'
            - '"password":'
            - '"remote_path":'
          in: body
          need: all
        - "on": word
          has:
            - file_permissions
            - extra_list_connections
          in: body
          need: all
