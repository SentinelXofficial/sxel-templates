id: deployment-ini
brief:
    title: FTP Deployment Config File - Exposure
    by: Michal Mikolas (nanuqcz)
    level: medium
    about: Config file for "FTP deployment" utility usually contains server's FTP credentials in plain text.
    label:
        - config
        - exposure
        - dg
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/deployment.ini'
        - '{{BaseURL}}/deploy.ini'
        - '{{BaseURL}}/production.ini'
        - '{{BaseURL}}/prod.ini'
        - '{{BaseURL}}/deployment.production.ini'
        - '{{BaseURL}}/deployment.prod.ini'
        - '{{BaseURL}}/deploy.production.ini'
        - '{{BaseURL}}/deploy.prod.ini'
        - '{{BaseURL}}/server.ini'
        - '{{BaseURL}}/ftp.ini'
        - '{{BaseURL}}/ftps.ini'
        - '{{BaseURL}}/sftp.ini'
      signs: []
