id: gmail-api-client-secrets
brief:
    title: GMail API - Detect
    by: geeknik
    level: info
    about: GMail API was detected.
    label:
        - config
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/client_secrets.json'
      signs:
        - "on": word
          has:
            - client_id
            - auth_uri
            - token_uri
          in: body
          need: all
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - application/json
          in: header
          need: all
