id: oracle-ebs-credentials
brief:
    title: Oracle E-Business System Credentials Page - Detect
    by: dhiyaneshDk
    level: high
    about: Oracle E-Business System credentials page was detected.
    label:
        - config
        - exposure
        - oracle
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/OA_HTML/jtfwrepo.xml'
      signs:
        - "on": word
          has:
            - password=
            - <PUSR_LIST>
          in: body
          need: all
        - "on": word
          has:
            - text/xml
          in: header
          need: all
        - "on": status
          status:
            - 200
