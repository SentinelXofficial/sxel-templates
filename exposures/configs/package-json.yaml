id: package-json
brief:
    title: NPM package.json Disclosure
    by: geeknik
    level: info
    about: All NodeJS packages contain a file, usually in the project root, called package.json - this file holds various metadata relevant to the project generated by package managers such as npm, yarn, pnpm.
    label:
        - config
        - exposure
        - node
        - npm
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/package.json'
        - '{{BaseURL}}/package-lock.json'
      signs:
        - "on": word
          has:
            - name
            - version
          in: body
          need: all
        - "on": word
          has:
            - application/json
          in: header
          need: all
        - "on": status
          status:
            - 200
