id: ftp-credentials-exposure
brief:
    title: FTP Credentials Exposure
    by: pikpikcu
    level: high
    about: FTP credentials were detected.
    label:
        - config
        - ftp
        - exposure
        - vuln
    score: CVSS:7.5
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/ftpsync.settings'
      signs:
        - "on": word
          has:
            - FTPSync
            - overwrite_newer_prevention
            - default_folder_permissions
          in: body
          need: all
        - "on": status
          status:
            - 200
