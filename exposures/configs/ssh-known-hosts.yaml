id: ssh-known-hosts
brief:
    title: SSH Known Hosts File - Detect
    by: geeknik
    level: info
    about: SSH known hosts file was detected.
    label:
        - config
        - exposure
        - ssh
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.ssh/known_hosts'
        - '{{BaseURL}}/.ssh/known_hosts.old'
      signs:
        - "on": word
          has:
            - ssh-dss
            - ssh-ed25519
            - ssh-rsa
            - ecdsa-sha2-nistp256
          in: body
          need: all
        - "on": status
          status:
            - 200
