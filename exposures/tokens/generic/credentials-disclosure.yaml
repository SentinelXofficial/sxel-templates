id: credentials-disclosure
brief:
    title: Credentials Disclosure Check
    by: Sy3Omda
    level: info
    about: Look for keys/tokens/passwords in HTTP responses, exposed keys/tokens/secrets requires manual verification for impact evaluation.
    label:
        - exposure
        - token
        - key
        - api
        - secret
        - password
        - generic
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs: []
