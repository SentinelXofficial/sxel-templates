id: azure-apim-secretkey
brief:
    title: Azure - APIM Secret Key
    by: israel comazzetto dos reis
    level: info
    about: Azure APIM Secret Key
    label:
        - azure
        - apim
        - microsoft
        - exposure
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - '"Ocp-Apim-Subscription-Key":'
          in: body
          need: all
        - "on": status
          status:
            - 200
