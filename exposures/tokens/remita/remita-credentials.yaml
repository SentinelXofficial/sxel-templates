id: remita-credentials
brief:
    title: Remita Merchant ID & API Key - Exposure
    by: Lloydcoder
    level: low
    about: Detected exposed Remita merchant IDs, API keys, and secret hashes in application source code, configuration files, or publicly accessible assets.
    label:
        - exposure
        - remita
        - fintech
        - tinlance
        - lloydcoder
        - token
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - remita
            - merchantId
            - publicKey
          in: body
          need: all
