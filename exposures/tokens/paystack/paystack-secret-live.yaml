id: paystack-secret-live
brief:
    title: Paystack Secret/Live Key - Exposure
    by: Lloydcoder
    level: info
    about: Detected exposed Paystack secret keys (test or live) found in application source code, configuration files, or client-side assets.
    label:
        - exposure
        - token
        - paystack
        - fintech
        - tinlance
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - paystack
            - secret_key
            - sk_live
            - sk_test
          in: body
          need: all
