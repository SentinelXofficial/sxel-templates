id: holley-phish
brief:
    title: Holley phishing Detection
    by: rxerium
    level: info
    about: A Holley phishing website was detected
    label:
        - phishing
        - holley
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Holley
            - Holley is home to the top automotive performance brands including Flowmaster exhaust, MSD Ignition, Holley EFI, Hurst Shifters, Accel plug wires, Hooker Headers and many more.
          in: body
          need: all
        - "on": status
          status:
            - 200
