id: vudu-phish
brief:
    title: Vudu phishing Detection
    by: rxerium
    level: info
    about: A Vudu phishing website was detected
    label:
        - phishing
        - vudu
        - streaming
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Vudu
            - title="Fandango at Home"
          in: body
          need: all
        - "on": status
          status:
            - 200
