id: Paypal-phish
brief:
    title: Paypal phishing Detection
    by: rxerium
    level: info
    about: A Paypal phishing website was detected
    label:
        - phishing
        - paypal
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Log in to PayPal automatically for faster checkout without entering your password wherever you're logged in with your Google account.
          in: body
          need: all
        - "on": status
          status:
            - 200
