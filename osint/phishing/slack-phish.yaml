id: slack-phish
brief:
    title: slack phishing Detection
    by: rxerium
    level: info
    about: A slack phishing website was detected
    label:
        - phishing
        - slack
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Slack is a new way to communicate with your team. It’s faster, better organised and more secure than email.
          in: body
          need: all
        - "on": status
          status:
            - 200
