id: twitch-phish
brief:
    title: Twitch phishing Detection
    by: rxerium
    level: info
    about: A twitch phishing website was detected
    label:
        - phishing
        - twitch
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Twitch is an interactive livestreaming service for content spanning gaming, entertainment, sports, music, and more. There’s something for everyone on Twitch.
          in: body
          need: all
        - "on": status
          status:
            - 200
