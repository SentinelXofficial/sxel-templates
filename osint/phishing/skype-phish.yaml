id: skype-phish
brief:
    title: skype phishing Detection
    by: rxerium
    level: info
    about: A skype phishing website was detected
    label:
        - phishing
        - skype
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Skype | Stay connected with free video calls worldwide
          in: body
          need: all
        - "on": status
          status:
            - 200
