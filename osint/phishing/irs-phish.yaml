id: irs-phish
brief:
    title: IRS phishing Detection
    by: rxerium
    level: info
    about: An IRS phishing website was detected
    label:
        - phishing
        - irs
        - government
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Pay your taxes. Get your refund status. Find IRS forms and answers to tax questions. We help you understand and meet your federal tax responsibilities.
          in: body
          need: all
        - "on": status
          status:
            - 200
