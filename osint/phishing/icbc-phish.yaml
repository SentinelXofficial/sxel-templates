id: icbc-phish
brief:
    title: ICBC phishing Detection
    by: rxerium
    level: info
    about: An ICBC phishing website was detected
    label:
        - phishing
        - icbc
        - bank
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - 工商银行金融服务全面介绍，投资理财信息丰富全面，在线交易方便快捷，满足客户专业化、多元化、人性化的金融服务需求，打造集业务、信息、交易、购物、互动于一体综合性金融服务平台。
          in: body
          need: all
        - "on": status
          status:
            - 200
