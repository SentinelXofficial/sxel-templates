id: deezer-phish
brief:
    title: deezer phishing Detection
    by: rxerium
    level: info
    about: A deezer phishing website was detected
    label:
        - phishing
        - deezer
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Deezer | Listen to music | Online music streaming platform
          in: body
          need: all
        - "on": status
          status:
            - 200
