id: monzo-phish
brief:
    title: Monzo phishing Detection
    by: rxerium
    level: info
    about: A Monzo phishing website was detected
    label:
        - phishing
        - monzo
        - fintech
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Organise, save & invest with a free UK current account, joint account or business account. Make your money more Monzo.
          in: body
          need: all
        - "on": status
          status:
            - 200
