id: twitter-phish
brief:
    title: Twitter/X phishing Detection
    by: rxerium
    level: info
    about: A Twitter/X phishing website was detected
    label:
        - phishing
        - twitter
        - x
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Sign in to X
            - Log in to X
            - Sign in to Twitter
            - Log in to Twitter
          in: body
          need: all
        - "on": word
          has:
            - type="password"
            - type='password'
          in: body
          need: all
        - "on": status
          status:
            - 200
