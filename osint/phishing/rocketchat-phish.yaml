id: rocketchat-phish
brief:
    title: Rocket.Chat phishing Detection
    by: rxerium
    level: info
    about: A Rocket.Chat phishing website was detected
    label:
        - phishing
        - rocketchat
        - communication
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>Rocket.Chat | Secure CommsOS™ for Mission-Critical Operations
          in: body
          need: all
        - "on": status
          status:
            - 200
