id: society6-phish
brief:
    title: Society6 phishing Detection
    by: rxerium
    level: info
    about: A Society6 phishing website was detected
    label:
        - phishing
        - society6
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Society6
            - Society6 features art prints, home decor, bed &amp; bath, iPhone cases, apparel and tech accessories you&#39;ll love with designs by artists worldwide.
          in: body
          need: all
        - "on": status
          status:
            - 200
