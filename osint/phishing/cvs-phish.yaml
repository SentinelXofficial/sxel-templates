id: cvs-phish
brief:
    title: CVS phishing Detection
    by: rxerium
    level: info
    about: A CVS phishing website was detected
    label:
        - phishing
        - cvs
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - CVS
            - Refill and transfer prescriptions online or find a CVS Pharmacy near you. Shop online, see ExtraCare deals, find MinuteClinic locations and more.
          in: body
          need: all
        - "on": status
          status:
            - 200
