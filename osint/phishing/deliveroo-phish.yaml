id: deliveroo-phish
brief:
    title: deliveroo phishing Detection
    by: rxerium
    level: info
    about: A deliveroo phishing website was detected
    label:
        - phishing
        - deliveroo
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Deliveroo - Takeaway Food Delivery from Local Restaurants &amp; Shops
          in: body
          need: all
        - "on": status
          status:
            - 200
