id: nab-phish
brief:
    title: NAB phishing Detection
    by: rxerium
    level: info
    about: A NAB phishing website was detected
    label:
        - phishing
        - nab
        - bank
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - NAB personal banking services include online banking, bank accounts, credit cards, home loans and personal loans. We’re here to help you with more than money.
          in: body
          need: all
        - "on": status
          status:
            - 200
