id: namecheap-phish
brief:
    title: Namecheap phishing Detection
    by: rxerium
    level: info
    about: A Namecheap phishing website was detected
    label:
        - phishing
        - namecheap
        - domain
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Register domain names at Namecheap. Buy cheap domain names and enjoy 24/7 support. With over 18 million domains under management, you know you’re in good hands.
          in: body
          need: all
        - "on": status
          status:
            - 200
