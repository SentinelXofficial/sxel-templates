id: scribd-phish
brief:
    title: Scribd phishing Detection
    by: rxerium
    level: info
    about: A Scribd phishing website was detected
    label:
        - phishing
        - scribd
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Scribd
            - Get to the source. Specialized knowledge on any topic, and answers you won’t find anywhere else. Home to the world’s documents, 300M+ and counting.
          in: body
          need: all
        - "on": status
          status:
            - 200
