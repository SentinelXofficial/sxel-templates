id: doordash-phish
brief:
    title: DoorDash phishing Detection
    by: rxerium
    level: info
    about: A DoorDash phishing website was detected
    label:
        - phishing
        - doordash
        - food-delivery
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - DoorDash
            - Get food, grocery, and retail essentials delivered fast. Shop same-day delivery from local stores and restaurants near you.
          in: body
          need: all
        - "on": status
          status:
            - 200
