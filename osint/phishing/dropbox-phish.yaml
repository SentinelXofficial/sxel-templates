id: dropbox-phish
brief:
    title: dropbox phishing Detection
    by: rxerium
    level: info
    about: A dropbox phishing website was detected
    label:
        - phishing
        - dropbox
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Dropbox is a home for all of your work. You can store and share files, collaborate on projects and bring your best ideas to life, whether you’re working alone or as part of a team.
          in: body
          need: all
        - "on": status
          status:
            - 200
