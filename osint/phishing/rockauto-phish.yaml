id: rockauto-phish
brief:
    title: RockAuto phishing Detection
    by: rxerium
    level: info
    about: A RockAuto phishing website was detected
    label:
        - phishing
        - rockauto
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Auto Parts for Your Vehicle at Reliably Low Prices. Fast Online Catalog. DIY-Easy. Your Choice of Quality. Full Manufacturer Warranty.
          in: body
          need: all
        - "on": status
          status:
            - 200
