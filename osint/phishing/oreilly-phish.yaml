id: oreilly-phish
brief:
    title: O'Reilly Auto Parts phishing Detection
    by: rxerium
    level: info
    about: An O'Reilly Auto Parts phishing website was detected
    label:
        - phishing
        - oreilly
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Find auto parts, tools, and more at O&#39;Reilly Auto Parts. Shop online for FREE Next Day shipping or pick up your order at one of more than 6,000 stores.
          in: body
          need: all
        - "on": status
          status:
            - 200
