id: 1password-phish
brief:
    title: 1password phishing Detection
    by: rxerium
    level: info
    about: A 1password phishing website was detected
    label:
        - phishing
        - 1password
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Password Manager for Families, Enterprise &amp; Business | 1Password
          in: body
          need: all
        - "on": status
          status:
            - 200
