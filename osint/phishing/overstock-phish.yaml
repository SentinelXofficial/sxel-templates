id: overstock-phish
brief:
    title: Overstock phishing Detection
    by: rxerium
    level: info
    about: An Overstock phishing website was detected
    label:
        - phishing
        - overstock
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Let Overstock.com help you discover designer brands and home goods at the lowest prices online. See for yourself why shoppers love our selection and award-winning customer service.
          in: body
          need: all
        - "on": status
          status:
            - 200
