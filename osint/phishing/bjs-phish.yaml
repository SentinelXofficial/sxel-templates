id: bjs-phish
brief:
    title: BJ's Wholesale Club phishing Detection
    by: rxerium
    level: info
    about: A BJ's Wholesale Club phishing website was detected
    label:
        - phishing
        - bjs
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - BJ's Wholesale Club
            - BJ's Wholesale Club is a leading operator of membership warehouse clubs.
          in: body
          need: all
        - "on": status
          status:
            - 200
