id: asana-phish
brief:
    title: Asana phishing Detection
    by: rxerium
    level: info
    about: An Asana phishing website was detected
    label:
        - phishing
        - asana
        - productivity
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - window.AsanaStorage.optanonWrapperInitialized
            - Asana
          in: body
          need: all
        - "on": status
          status:
            - 200
