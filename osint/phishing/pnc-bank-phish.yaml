id: pnc-bank-phish
brief:
    title: PNC Bank phishing Detection
    by: rxerium
    level: info
    about: A PNC Bank phishing website was detected
    label:
        - phishing
        - pnc-bank
        - bank
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - PNC Bank offers a wide range of personal banking services including checking and savings accounts, credit cards, mortgage loans, auto loans and much more.
          in: body
          need: all
        - "on": status
          status:
            - 200
