id: kakao-login-phish
brief:
    title: kakao login phishing Detection
    by: hahwul
    level: info
    about: A kakao login phishing website was detected
    label:
        - phishing
        - kakao
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - 카카오계정
            - 로그인
            - 계정 찾기
            - 비밀번호 찾기
          in: body
          need: all
        - "on": status
          status:
            - 200
