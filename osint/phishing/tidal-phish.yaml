id: tidal-phish
brief:
    title: Tidal phishing Detection
    by: rxerium
    level: info
    about: A Tidal phishing website was detected
    label:
        - phishing
        - tidal
        - streaming
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - tidal.com
          in: body
          need: all
        - "on": status
          status:
            - 200
