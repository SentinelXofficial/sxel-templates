id: typeform-phish
brief:
    title: Typeform phishing Detection
    by: rxerium
    level: info
    about: A Typeform phishing website was detected
    label:
        - phishing
        - typeform
        - forms
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - '<title>Typeform: People-Friendly Forms and Surveys'
          in: body
          need: all
        - "on": status
          status:
            - 200
