id: coinbase-phish
brief:
    title: Coinbase phishing Detection
    by: rxerium
    level: info
    about: A Coinbase phishing website was detected
    label:
        - phishing
        - coinbase
        - crypto
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Coinbase - Buy and Sell Bitcoin, Ethereum, and more with trust
            - <title>Coinbase</title>
            - Sign in to Coinbase
            - Log in to Coinbase
          in: body
          need: all
        - "on": word
          has:
            - password
            - signin
            - sign-in
            - login
            - log-in
          in: body
          need: all
        - "on": status
          status:
            - 200
