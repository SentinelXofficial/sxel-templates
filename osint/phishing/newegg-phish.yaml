id: newegg-phish
brief:
    title: Newegg phishing Detection
    by: rxerium
    level: info
    about: A Newegg phishing website was detected
    label:
        - phishing
        - newegg
        - ecommerce
        - osint
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Shop Newegg today for all of your gaming, PC & technology needs. Don’t miss today’s best electronics deals with fast shipping & great customer service!
          in: body
          need: all
        - "on": status
          status:
            - 200
