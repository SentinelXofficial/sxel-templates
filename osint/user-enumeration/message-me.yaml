id: message-me
brief:
    title: Message me User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Message me user name information check was conducted.
    label:
        - osint
        - osint-social
        - message-me
        - discovery
moves:
    - verb: GET
      to:
        - https://mssg.me/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - _id
          in: body
          need: all
