id: mediakits
brief:
    title: Mediakits User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mediakits user name information check was conducted.
    label:
        - osint
        - osint-social
        - mediakits
        - discovery
moves:
    - verb: GET
      to:
        - https://restapi.mediakits.com/mediakits/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - displayName
          in: body
          need: all
