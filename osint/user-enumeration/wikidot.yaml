id: wikidot
brief:
    title: Wikidot User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Wikidot user name information check was conducted.
    label:
        - osint
        - osint-social
        - wikidot
        - discovery
moves:
    - verb: GET
      to:
        - http://www.wikidot.com/user:info/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Wikidot.com:'
          in: body
          need: all
