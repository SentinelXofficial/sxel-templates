id: pokemonshowdown
brief:
    title: Pokemonshowdown User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Pokemonshowdown user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - pokemonshowdown
        - discovery
moves:
    - verb: GET
      to:
        - https://pokemonshowdown.com/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Official ladder
          in: body
          need: all
