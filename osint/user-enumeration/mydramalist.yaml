id: mydramalist
brief:
    title: MyDramaList User Name Information - Detect
    by: princechaddha
    level: info
    about: MyDramaList user name information check was conducted.
    label:
        - osint
        - osint-social
        - mydramalist
        - discovery
moves:
    - verb: GET
      to:
        - https://www.mydramalist.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Profile - MyDramaList
          in: body
          need: all
