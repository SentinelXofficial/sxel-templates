id: secure-donation
brief:
    title: Secure donation User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Secure donation user name information check was conducted.
    label:
        - osint
        - osint-finance
        - secure-donation
        - discovery
moves:
    - verb: GET
      to:
        - https://secure.donationpay.org/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| DonationPay</title>'
          in: body
          need: all
