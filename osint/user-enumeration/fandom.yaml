id: fandom
brief:
    title: Fandom User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Fandom user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - fandom
        - discovery
moves:
    - verb: GET
      to:
        - https://www.fandom.com/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| Profile | Fandom'
          in: body
          need: all
