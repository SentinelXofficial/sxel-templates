id: bandlab
brief:
    title: Bandlab User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Bandlab user name information check was conducted.
    label:
        - osint
        - osint-music
        - bandlab
        - discovery
moves:
    - verb: GET
      to:
        - https://www.bandlab.com/api/v1.3/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - about
          in: body
          need: all
