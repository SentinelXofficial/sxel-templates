id: seoclerks
brief:
    title: SEOClerks User Name Information - Detect
    by: dwisiswant0
    level: info
    about: SEOClerks user name information check was conducted.
    label:
        - osint
        - osint-social
        - seoclerks
        - discovery
moves:
    - verb: GET
      to:
        - https://www.seoclerks.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <div class="user-info container">
          in: body
          need: all
