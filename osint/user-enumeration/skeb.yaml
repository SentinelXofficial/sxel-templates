id: skeb
brief:
    title: Skeb User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Skeb user name information check was conducted.
    label:
        - osint
        - osint-art
        - skeb
        - discovery
moves:
    - verb: GET
      to:
        - https://skeb.jp/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ) | Skeb
          in: body
          need: all
