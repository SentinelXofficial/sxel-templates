id: digitalspy
brief:
    title: Digitalspy User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Digitalspy user name information check was conducted.
    label:
        - osint
        - osint-social
        - digitalspy
        - discovery
moves:
    - verb: GET
      to:
        - https://forums.digitalspy.com/profile/discussions/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - About
          in: body
          need: all
