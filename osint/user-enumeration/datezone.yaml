id: datezone
brief:
    title: Datezone User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Datezone user name information check was conducted.
    label:
        - osint
        - osint-porn
        - datezone
        - discovery
moves:
    - verb: GET
      to:
        - https://www.datezone.com/users/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - profile_status
          in: body
          need: all
