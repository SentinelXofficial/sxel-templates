id: okidoki
brief:
    title: Okidoki User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Okidoki user name information check was conducted.
    label:
        - osint
        - osint-misc
        - okidoki
        - discovery
moves:
    - verb: GET
      to:
        - https://m.okidoki.ee/ru/users/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Пользователь
          in: body
          need: all
