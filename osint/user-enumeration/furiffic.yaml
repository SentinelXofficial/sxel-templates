id: furiffic
brief:
    title: Furiffic User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Furiffic user name information check was conducted.
    label:
        - osint
        - osint-porn
        - furiffic
        - discovery
moves:
    - verb: GET
      to:
        - https://www.furiffic.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Registered Since
          in: body
          need: all
