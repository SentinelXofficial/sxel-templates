id: notabug
brief:
    title: NotABug User Name Information - Detect
    by: dwisiswant0
    level: info
    about: NotABug user name information check was conducted.
    label:
        - osint
        - osint-coding
        - notabug
        - discovery
moves:
    - verb: GET
      to:
        - https://notabug.org/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - followers and is following
          in: body
          need: all
