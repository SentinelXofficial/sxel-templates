id: fatsecret
brief:
    title: FatSecret User Name Information - Detect
    by: dwisiswant0
    level: info
    about: FatSecret user name information check was conducted.
    label:
        - osint
        - osint-health
        - fatsecret
        - discovery
moves:
    - verb: GET
      to:
        - https://www.fatsecret.com/member/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- Member</title>'
          in: body
          need: all
