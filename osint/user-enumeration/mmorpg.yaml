id: mmorpg
brief:
    title: Mmorpg User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mmorpg user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - mmorpg
        - discovery
moves:
    - verb: GET
      to:
        - https://forums.mmorpg.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - MMORPG.com Forums
          in: body
          need: all
