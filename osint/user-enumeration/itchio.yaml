id: itchio
brief:
    title: Itch.io User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Itch.io user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - itchio
        - discovery
moves:
    - verb: GET
      to:
        - https://itch.io/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - A member registered
          in: body
          need: all
