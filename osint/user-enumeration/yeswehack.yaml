id: yeswehack
brief:
    title: Yeswehack User Name Information - Detect
    by: philippedelteil
    level: info
    about: Yeswehack user name information check was conducted. Detection will work if the profile is set to be public.
    label:
        - osint
        - osint-tech
        - yeswehack
        - discovery
moves:
    - verb: GET
      to:
        - https://api.yeswehack.com/hacktivity/{{user}}
      signs:
        - "on": word
          has:
            - '"username":"{{user}}"'
            - '"kyc_status":'
            - hunter_profile
          in: body
          need: all
        - "on": status
          status:
            - 200
