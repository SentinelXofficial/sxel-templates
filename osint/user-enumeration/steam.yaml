id: steam
brief:
    title: Steam User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Steam user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - steam
        - discovery
moves:
    - verb: GET
      to:
        - https://steamcommunity.com/id/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - g_rgProfileData =
          in: body
          need: all
