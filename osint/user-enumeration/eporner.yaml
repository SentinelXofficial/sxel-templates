id: eporner
brief:
    title: EPORNER User Name Information - Detect
    by: dwisiswant0
    level: info
    about: EPORNER user name information check was conducted.
    label:
        - osint
        - osint-porn
        - eporner
        - discovery
moves:
    - verb: GET
      to:
        - https://www.eporner.com/profile/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Video/Pics views
          in: body
          need: all
