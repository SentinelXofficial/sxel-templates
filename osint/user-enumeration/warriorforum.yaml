id: warriorforum
brief:
    title: Warriorforum User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Warriorforum user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - warriorforum
        - discovery
moves:
    - verb: GET
      to:
        - https://www.warriorforum.com/members/{{user}}.html
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| Warrior Forum'
          in: body
          need: all
