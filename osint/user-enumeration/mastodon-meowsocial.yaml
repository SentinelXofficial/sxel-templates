id: mastodon-meowsocial
brief:
    title: Mastodon-meow.social User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mastodon-meow.social user name information check was conducted.
    label:
        - osint
        - osint-social
        - mastodon-meowsocial
        - discovery
moves:
    - verb: GET
      to:
        - https://meow.social/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- the mastodon instances for creatures</title>'
          in: body
          need: all
