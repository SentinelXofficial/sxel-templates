id: apteka
brief:
    title: Apteka User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Apteka user name information check was conducted.
    label:
        - osint
        - osint-social
        - apteka
        - discovery
moves:
    - verb: GET
      to:
        - https://apteka.ee/user/id/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - /gifts/user_id/
          in: body
          need: all
