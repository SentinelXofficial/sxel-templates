id: carbonmade
brief:
    title: Carbonmade User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Carbonmade user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - carbonmade
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.carbonmade.com/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - s online portfolio
          in: body
          need: all
