id: teespring
brief:
    title: Teespring User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Teespring user name information check was conducted.
    label:
        - osint
        - osint-business
        - teespring
        - discovery
moves:
    - verb: GET
      to:
        - https://commerce.teespring.com/v1/stores?slug={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - sellerToken
          in: body
          need: all
