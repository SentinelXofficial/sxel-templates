id: mod-db
brief:
    title: Mod DB User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mod DB user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - mod-db
        - discovery
moves:
    - verb: GET
      to:
        - https://www.moddb.com/members/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - joined <time
          in: body
          need: all
