id: totalwar
brief:
    title: TotalWar User Name Information - Detect
    by: dwisiswant0
    level: info
    about: TotalWar user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - totalwar
        - discovery
moves:
    - verb: GET
      to:
        - https://forums.totalwar.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Total War Forums
          in: body
          need: all
