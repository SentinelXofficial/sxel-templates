id: venmo
brief:
    title: Venmo User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Venmo user name information check was conducted.
    label:
        - osint
        - osint-finance
        - venmo
        - discovery
moves:
    - verb: GET
      to:
        - https://account.venmo.com/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - profileInfo_username__
          in: body
          need: all
