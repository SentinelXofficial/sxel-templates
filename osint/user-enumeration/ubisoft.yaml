id: ubisoft
brief:
    title: Ubisoft User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Ubisoft user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - ubisoft
        - discovery
moves:
    - verb: GET
      to:
        - https://discussions.ubisoft.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| Ubisoft Discussion Forums'
          in: body
          need: all
