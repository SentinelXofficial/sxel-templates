id: drum
brief:
    title: Drum User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Drum user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - drum
        - discovery
moves:
    - verb: GET
      to:
        - https://drum.io/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - firstName
          in: body
          need: all
