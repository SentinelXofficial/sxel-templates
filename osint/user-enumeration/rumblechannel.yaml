id: rumblechannel
brief:
    title: RumbleChannel User Name Information - Detect
    by: dwisiswant0
    level: info
    about: RumbleChannel user name information check was conducted.
    label:
        - osint
        - osint-political
        - rumblechannel
        - discovery
moves:
    - verb: GET
      to:
        - https://rumble.com/c/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - href=https://rumble.com/c/
          in: body
          need: all
