id: codewars
brief:
    title: Codewars User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Codewars user name information check was conducted.
    label:
        - osint
        - osint-coding
        - codewars
        - discovery
moves:
    - verb: GET
      to:
        - https://www.codewars.com/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| Codewars'
          in: body
          need: all
