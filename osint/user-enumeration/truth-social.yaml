id: truth-social
brief:
    title: Truth Social User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Truth Social user name information check was conducted.
    label:
        - osint
        - osint-social
        - truth-social
        - discovery
moves:
    - verb: GET
      to:
        - https://truthsocial.com/api/v1/accounts/lookup?acct={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - display_name
          in: body
          need: all
