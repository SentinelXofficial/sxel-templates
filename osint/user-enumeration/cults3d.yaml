id: cults3d
brief:
    title: Cults3D User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Cults3D user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - cults3d
        - discovery
moves:
    - verb: GET
      to:
        - https://cults3d.com/en/users/{{user}}/creations
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - All the 3D models of
          in: body
          need: all
