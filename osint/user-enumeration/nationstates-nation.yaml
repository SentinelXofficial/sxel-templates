id: nationstates-nation
brief:
    title: NationStates Nation User Name Information - Detect
    by: princechaddha
    level: info
    about: NationStates Nation user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - nationstates
        - discovery
moves:
