id: mix
brief:
    title: Mix User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mix user name information check was conducted.
    label:
        - osint
        - osint-social
        - mix
        - discovery
moves:
    - verb: GET
      to:
        - https://mix.com/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <title>@
          in: body
          need: all
