id: hamaha
brief:
    title: Hamaha User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Hamaha user name information check was conducted.
    label:
        - osint
        - osint-finance
        - hamaha
        - discovery
moves:
    - verb: GET
      to:
        - https://hamaha.net/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- трейдинг форекс фьючерсы акции фондовый рынок '
          in: body
          need: all
