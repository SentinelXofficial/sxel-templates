id: magabook
brief:
    title: MAGABOOK User Name Information - Detect
    by: dwisiswant0
    level: info
    about: MAGABOOK user name information check was conducted.
    label:
        - osint
        - osint-social
        - magabook
        - discovery
moves:
    - verb: GET
      to:
        - https://magabook.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Recent Updates
          in: body
          need: all
