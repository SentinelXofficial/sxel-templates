id: parler-archived-posts
brief:
    title: Parler archived posts User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Parler archived posts user name information check was conducted.
    label:
        - osint
        - osint-archived
        - parler-archived-posts
        - discovery
moves:
    - verb: GET
      to:
        - http://archive.org/wayback/available?url=https://parler.com/profile/{{user}}/posts
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"archived_snapshots": {"closest"'
          in: body
          need: all
