id: muck-rack
brief:
    title: Muck Rack User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Muck Rack user name information check was conducted.
    label:
        - osint
        - osint-news
        - muck-rack
        - discovery
moves:
    - verb: GET
      to:
        - https://muckrack.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - on Muck Rack
          in: body
          need: all
