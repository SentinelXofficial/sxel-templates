id: poshmark
brief:
    title: Poshmark User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Poshmark user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - poshmark
        - discovery
moves:
    - verb: GET
      to:
        - https://poshmark.com/closet/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ' is using Poshmark to sell items from their closet.'
          in: body
          need: all
