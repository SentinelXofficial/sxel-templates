id: teknik
brief:
    title: Teknik User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Teknik user name information check was conducted.
    label:
        - osint
        - osint-tech
        - teknik
        - discovery
moves:
    - verb: GET
      to:
        - https://user.teknik.io/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Public Key
          in: body
          need: all
