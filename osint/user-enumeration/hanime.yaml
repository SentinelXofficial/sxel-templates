id: hanime
brief:
    title: Hanime User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Hanime user name information check was conducted.
    label:
        - osint
        - osint-porn
        - hanime
        - discovery
moves:
    - verb: GET
      to:
        - https://hanime.tv/channels/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Channel Views
          in: body
          need: all
