id: seneporno
brief:
    title: Seneporno User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Seneporno user name information check was conducted.
    label:
        - osint
        - osint-porn
        - seneporno
        - discovery
moves:
    - verb: GET
      to:
        - https://seneporno.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Dernier Login
          in: body
          need: all
