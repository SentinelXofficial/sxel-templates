id: cheezburger
brief:
    title: CHEEZburger User Name Information - Detect
    by: dwisiswant0
    level: info
    about: CHEEZburger user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - cheezburger
        - discovery
moves:
    - verb: GET
      to:
        - https://profile.cheezburger.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - profile-header
          in: body
          need: all
