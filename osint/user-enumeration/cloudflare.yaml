id: cloudflare
brief:
    title: Cloudflare User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Cloudflare user name information check was conducted.
    label:
        - osint
        - osint-tech
        - cloudflare
        - discovery
moves:
    - verb: GET
      to:
        - https://community.cloudflare.com/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- Cloudflare Community'
          in: body
          need: all
