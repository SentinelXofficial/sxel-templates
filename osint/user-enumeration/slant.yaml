id: slant
brief:
    title: Slant User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Slant user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - slant
        - discovery
moves:
    - verb: GET
      to:
        - https://www.slant.co/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - s Profile - Slant
          in: body
          need: all
