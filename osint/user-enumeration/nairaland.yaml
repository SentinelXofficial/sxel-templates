id: nairaland
brief:
    title: Nairaland User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Nairaland user name information check was conducted.
    label:
        - osint
        - osint-news
        - nairaland
        - discovery
moves:
    - verb: GET
      to:
        - https://www.nairaland.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - s Profile
          in: body
          need: all
