id: mastodon-eu-voice
brief:
    title: Mastodon-EU Voice User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mastodon-EU Voice user name information check was conducted.
    label:
        - osint
        - osint-social
        - mastodon-eu-voice
        - discovery
moves:
    - verb: GET
      to:
        - https://social.network.europa.eu/api/v1/accounts/lookup?acct={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - social.network.europa.eu
          in: body
          need: all
