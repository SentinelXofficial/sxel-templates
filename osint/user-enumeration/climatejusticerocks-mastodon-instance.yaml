id: climatejusticerocks-mastodon-instance
brief:
    title: Climatejustice.rocks (Mastodon Instance) User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Climatejustice.rocks (Mastodon Instance) user name information check was conducted.
    label:
        - osint
        - osint-social
        - climatejusticerocks-mastodon-instance
        - discovery
moves:
    - verb: GET
      to:
        - https://climatejustice.rocks/api/v1/accounts/lookup?acct={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - display_name
          in: body
          need: all
