id: okru
brief:
    title: Ok.ru User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Ok.ru user name information check was conducted.
    label:
        - osint
        - osint-social
        - okru
        - discovery
moves:
    - verb: GET
      to:
        - https://ok.ru/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '| OK'
          in: body
          need: all
