id: cameo
brief:
    title: Cameo User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Cameo user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - cameo
        - discovery
moves:
    - verb: GET
      to:
        - https://www.cameo.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - aggregateRating
          in: body
          need: all
