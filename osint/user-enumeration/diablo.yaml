id: diablo
brief:
    title: Diablo User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Diablo user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - diablo
        - discovery
moves:
    - verb: GET
      to:
        - https://diablo2.io/member/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Viewing profile - '
          in: body
          need: all
