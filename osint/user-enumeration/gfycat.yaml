id: gfycat
brief:
    title: Gfycat User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Gfycat user name information check was conducted.
    label:
        - osint
        - osint-misc
        - gfycat
        - discovery
moves:
    - verb: GET
      to:
        - https://gfycat.com/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - gfycat-username
          in: body
          need: all
