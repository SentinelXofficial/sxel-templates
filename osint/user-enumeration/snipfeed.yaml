id: snipfeed
brief:
    title: Snipfeed User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Snipfeed user name information check was conducted.
    label:
        - osint
        - osint-misc
        - snipfeed
        - discovery
moves:
    - verb: GET
      to:
        - https://snipfeed.co/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - creatorLink
          in: body
          need: all
