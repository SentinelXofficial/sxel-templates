id: toyhouse
brief:
    title: Toyhou.se User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Toyhou.se user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - toyhouse
        - discovery
moves:
    - verb: GET
      to:
        - https://toyhou.se/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - display-user
          in: body
          need: all
