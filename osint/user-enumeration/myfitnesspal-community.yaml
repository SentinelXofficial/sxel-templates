id: myfitnesspal-community
brief:
    title: MyFitnessPal Community User Name Information - Detect
    by: dwisiswant0
    level: info
    about: MyFitnessPal Community user name information check was conducted.
    label:
        - osint
        - osint-health
        - myfitnesspal-community
        - discovery
moves:
    - verb: GET
      to:
        - https://community.myfitnesspal.com/en/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '>Last Active<'
          in: body
          need: all
