id: snapchat-stories
brief:
    title: Snapchat Stories User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Snapchat Stories user name information check was conducted.
    label:
        - osint
        - osint-social
        - snapchat-stories
        - discovery
moves:
    - verb: GET
      to:
        - https://story.snapchat.com/s/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - is on Snapchat!
          in: body
          need: all
