id: motokiller
brief:
    title: Motokiller User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Motokiller user name information check was conducted.
    label:
        - osint
        - osint-images
        - motokiller
        - discovery
moves:
    - verb: GET
      to:
        - https://mklr.pl/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Zamieszcza materiały od:'
          in: body
          need: all
