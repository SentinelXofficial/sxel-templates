id: jbzd
brief:
    title: JBZD User Name Information - Detect
    by: dwisiswant0
    level: info
    about: JBZD user name information check was conducted.
    label:
        - osint
        - osint-images
        - jbzd
        - discovery
moves:
    - verb: GET
      to:
        - https://jbzd.com.pl/uzytkownik/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Dzidy użytkownika
          in: body
          need: all
