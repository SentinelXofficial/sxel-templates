id: visnesscard
brief:
    title: Visnesscard User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Visnesscard user name information check was conducted.
    label:
        - osint
        - osint-business
        - visnesscard
        - discovery
moves:
    - verb: GET
      to:
        - https://my.visnesscard.com/Home/GetCard/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - end_point
          in: body
          need: all
