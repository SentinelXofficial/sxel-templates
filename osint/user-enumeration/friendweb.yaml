id: friendweb
brief:
    title: Friendweb User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Friendweb user name information check was conducted.
    label:
        - osint
        - osint-social
        - friendweb
        - discovery
moves:
    - verb: GET
      to:
        - https://friendweb.nl/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - friendweb.nl
          in: body
          need: all
