id: quitterpl
brief:
    title: Quitter.pl User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Quitter.pl user name information check was conducted.
    label:
        - osint
        - osint-social
        - quitterpl
        - discovery
moves:
    - verb: GET
      to:
        - https://quitter.pl/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '@quitter.pl'
          in: body
          need: all
