id: pillowfort
brief:
    title: Pillowfort User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Pillowfort user name information check was conducted.
    label:
        - osint
        - osint-social
        - pillowfort
        - discovery
moves:
    - verb: GET
      to:
        - https://www.pillowfort.social/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <meta property="og:site_name" content="Pillowfort">
          in: body
          need: all
