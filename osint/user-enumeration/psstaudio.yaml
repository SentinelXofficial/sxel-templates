id: psstaudio
brief:
    title: Psstaudio User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Psstaudio user name information check was conducted.
    label:
        - osint
        - osint-porn
        - psstaudio
        - discovery
moves:
    - verb: GET
      to:
        - https://psstaudio.com/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - id="profile_picture"
          in: body
          need: all
