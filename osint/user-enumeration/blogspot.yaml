id: blogspot
brief:
    title: Blogspot User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Blogspot user name information check was conducted.
    label:
        - osint
        - osint-blog
        - blogspot
        - discovery
moves:
    - verb: GET
      to:
        - http://{{user}}.blogspot.com
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Blogger Template Style
          in: body
          need: all
