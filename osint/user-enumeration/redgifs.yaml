id: redgifs
brief:
    title: REDGIFS User Name Information - Detect
    by: dwisiswant0
    level: info
    about: REDGIFS user name information check was conducted.
    label:
        - osint
        - osint-porn
        - redgifs
        - discovery
moves:
    - verb: GET
      to:
        - https://api.redgifs.com/v1/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - followers
          in: body
          need: all
