id: hackster
brief:
    title: Hackster User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Hackster user name information check was conducted.
    label:
        - osint
        - osint-coding
        - hackster
        - discovery
moves:
    - verb: GET
      to:
        - https://www.hackster.io/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- Hackster.io'
          in: body
          need: all
