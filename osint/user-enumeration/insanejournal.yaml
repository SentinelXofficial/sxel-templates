id: insanejournal
brief:
    title: InsaneJournal User Name Information - Detect
    by: dwisiswant0
    level: info
    about: InsaneJournal user name information check was conducted.
    label:
        - osint
        - osint-social
        - insanejournal
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.insanejournal.com/profile
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'User:'
          in: body
          need: all
