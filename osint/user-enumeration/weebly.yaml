id: weebly
brief:
    title: Weebly User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Weebly user name information check was conducted.
    label:
        - osint
        - osint-misc
        - weebly
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.weebly.com/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <div id="navigation">
          in: body
          need: all
