id: vk
brief:
    title: VK User Name Information - Detect
    by: dwisiswant0
    level: info
    about: VK user name information check was conducted.
    label:
        - osint
        - osint-social
        - vk
        - discovery
moves:
    - verb: GET
      to:
        - https://vk.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - id="profile"
          in: body
          need: all
