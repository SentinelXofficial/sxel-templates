id: depop
brief:
    title: Depop User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Depop user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - depop
        - discovery
moves:
    - verb: GET
      to:
        - https://www.depop.com/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - s Shop - Depop
          in: body
          need: all
