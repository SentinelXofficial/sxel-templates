id: expressionalsocial-mastodon-instance
brief:
    title: Expressional.social (Mastodon Instance) User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Expressional.social (Mastodon Instance) user name information check was conducted.
    label:
        - osint
        - osint-social
        - expressionalsocial-mastodon-instance
        - discovery
moves:
    - verb: GET
      to:
        - https://expressional.social/api/v1/accounts/lookup?acct={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - display_name
          in: body
          need: all
