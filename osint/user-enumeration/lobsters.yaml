id: lobsters
brief:
    title: Lobste.rs User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Lobste.rs user name information check was conducted.
    label:
        - osint
        - osint-tech
        - lobsters
        - discovery
moves:
    - verb: GET
      to:
        - https://lobste.rs/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Joined
          in: body
          need: all
