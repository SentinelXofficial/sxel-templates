id: wireclub
brief:
    title: Wireclub User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Wireclub user name information check was conducted.
    label:
        - osint
        - osint-social
        - wireclub
        - discovery
moves:
    - verb: GET
      to:
        - https://www.wireclub.com/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Chat With
          in: body
          need: all
