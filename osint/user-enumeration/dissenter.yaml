id: dissenter
brief:
    title: Dissenter User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Dissenter user name information check was conducted.
    label:
        - osint
        - osint-political
        - dissenter
        - discovery
moves:
    - verb: GET
      to:
        - https://dissenter.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Dissenter | The Comment Section of the Internet
          in: body
          need: all
