id: cashapp
brief:
    title: Cash.app User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Cash.app user name information check was conducted.
    label:
        - osint
        - osint-finance
        - cashapp
        - discovery
moves:
    - verb: GET
      to:
        - https://cash.app/${{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ' on Cash App</title>'
          in: body
          need: all
