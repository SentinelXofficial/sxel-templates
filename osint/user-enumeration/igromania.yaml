id: igromania
brief:
    title: Igromania User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Igromania user name information check was conducted.
    label:
        - osint
        - osint-social
        - igromania
        - discovery
moves:
    - verb: GET
      to:
        - http://forum.igromania.ru/member.php?username={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Форум Игромании - Просмотр профиля:'
          in: body
          need: all
