id: uwuai
brief:
    title: Uwu.ai User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Uwu.ai user name information check was conducted.
    label:
        - osint
        - osint-social
        - uwuai
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.uwu.ai/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - property="twitter:card"
          in: body
          need: all
