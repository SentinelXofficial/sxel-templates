id: myspace
brief:
    title: MySpace User Name Information - Detect
    by: dwisiswant0
    level: info
    about: MySpace user name information check was conducted.
    label:
        - osint
        - osint-social
        - myspace
        - discovery
moves:
    - verb: GET
      to:
        - https://myspace.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <!-- Profile -->
          in: body
          need: all
