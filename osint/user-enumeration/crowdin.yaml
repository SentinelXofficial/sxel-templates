id: crowdin
brief:
    title: Crowdin User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Crowdin user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - crowdin
        - discovery
moves:
    - verb: GET
      to:
        - https://crowdin.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ) – Crowdin
          in: body
          need: all
