id: inkbunny
brief:
    title: InkBunny User Name Information - Detect
    by: dwisiswant0
    level: info
    about: InkBunny user name information check was conducted.
    label:
        - osint
        - osint-porn
        - inkbunny
        - discovery
moves:
    - verb: GET
      to:
        - https://inkbunny.net/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Profile | Inkbunny, the Furry Art Community</title>
          in: body
          need: all
