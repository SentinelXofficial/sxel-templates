id: streamlabs
brief:
    title: StreamLabs User Name Information - Detect
    by: dwisiswant0
    level: info
    about: StreamLabs user name information check was conducted.
    label:
        - osint
        - osint-finance
        - streamlabs
        - discovery
moves:
    - verb: GET
      to:
        - https://streamlabs.com/api/v6/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - display_name
          in: body
          need: all
