id: tapitag
brief:
    title: TAPiTAG User Name Information - Detect
    by: dwisiswant0
    level: info
    about: TAPiTAG user name information check was conducted.
    label:
        - osint
        - osint-business
        - tapitag
        - discovery
moves:
    - verb: GET
      to:
        - https://account.tapitag.co/tapitag/api/v1/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - User details are Showing
          in: body
          need: all
