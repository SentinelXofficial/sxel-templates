id: moto-trip
brief:
    title: Moto-trip User Name Information - Detect
    by: gl0bal01
    level: info
    about: Moto-trip user name information check was conducted.
    label:
        - osint
        - osint-social
        - discovery
moves:
    - verb: GET
      to:
        - https://moto-trip.com/profil/{{user}}
      signs:
        - "on": word
          has:
            - /profil/{{user}}
            - Membre
          in: body
          need: all
        - "on": status
          status:
            - 200
