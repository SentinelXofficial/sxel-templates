id: blipfm
brief:
    title: BLIP.fm User Name Information - Detect
    by: dwisiswant0
    level: info
    about: BLIP.fm user name information check was conducted.
    label:
        - osint
        - osint-music
        - blipfm
        - discovery
moves:
    - verb: GET
      to:
        - https://blip.fm/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - recommended
          in: body
          need: all
