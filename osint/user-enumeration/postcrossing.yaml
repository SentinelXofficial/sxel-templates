id: postcrossing
brief:
    title: Postcrossing User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Postcrossing user name information check was conducted.
    label:
        - osint
        - osint-social
        - postcrossing
        - discovery
moves:
    - verb: GET
      to:
        - https://www.postcrossing.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ', from'
          in: body
          need: all
