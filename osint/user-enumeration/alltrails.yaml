id: alltrails
brief:
    title: AllTrails User Name Information - Detect
    by: dwisiswant0
    level: info
    about: AllTrails user name information check was conducted.
    label:
        - osint
        - osint-health
        - alltrails
        - discovery
moves:
    - verb: GET
      to:
        - https://www.alltrails.com/members/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '''s Profile | '
          in: body
          need: all
