id: homedesign3d
brief:
    title: HomeDesign3D User Name Information - Detect
    by: dwisiswant0
    level: info
    about: HomeDesign3D user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - homedesign3d
        - discovery
moves:
    - verb: GET
      to:
        - https://en.homedesign3d.net/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - userspace
          in: body
          need: all
