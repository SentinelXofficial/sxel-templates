id: bblog-ru
brief:
    title: Bblog ru User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Bblog ru user name information check was conducted.
    label:
        - osint
        - osint-misc
        - bblog-ru
        - discovery
moves:
    - verb: GET
      to:
        - https://www.babyblog.ru/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '@'
          in: body
          need: all
