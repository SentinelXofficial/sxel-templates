id: pronounspage
brief:
    title: Pronouns.Page User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Pronouns.Page user name information check was conducted.
    label:
        - osint
        - osint-social
        - pronounspage
        - discovery
moves:
    - verb: GET
      to:
        - https://pronouns.page/api/profile/get/{{user}}?version=2
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - username
          in: body
          need: all
