id: xbox-gamertag
brief:
    title: Xbox Gamertag User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Xbox Gamertag user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - xbox-gamertag
        - discovery
moves:
    - verb: GET
      to:
        - https://www.xboxgamertag.com/search/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Games Played
          in: body
          need: all
