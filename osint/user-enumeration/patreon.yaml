id: patreon
brief:
    title: Patreon User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Patreon user name information check was conducted.
    label:
        - osint
        - osint-finance
        - patreon
        - discovery
moves:
    - verb: GET
      to:
        - https://www.patreon.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'full_name":'
          in: body
          need: all
