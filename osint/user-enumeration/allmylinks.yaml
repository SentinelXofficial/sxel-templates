id: allmylinks
brief:
    title: Allmylinks User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Allmylinks user name information check was conducted.
    label:
        - osint
        - osint-social
        - allmylinks
        - discovery
moves:
    - verb: GET
      to:
        - https://allmylinks.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - message
          in: body
          need: all
