id: furaffinity
brief:
    title: FurAffinity User Name Information - Detect
    by: dwisiswant0
    level: info
    about: FurAffinity user name information check was conducted.
    label:
        - osint
        - osint-images
        - furaffinity
        - discovery
moves:
    - verb: GET
      to:
        - https://www.furaffinity.net/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <title>Userpage of
          in: body
          need: all
