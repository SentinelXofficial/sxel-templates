id: trackmanialadder
brief:
    title: TrackmaniaLadder User Name Information - Detect
    by: dwisiswant0
    level: info
    about: TrackmaniaLadder user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - trackmanialadder
        - discovery
moves:
    - verb: GET
      to:
        - https://en.tm-ladder.com/{{user}}_rech.php
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Login type :'
          in: body
          need: all
