id: freelancer
brief:
    title: Freelancer User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Freelancer user name information check was conducted.
    label:
        - osint
        - osint-business
        - freelancer
        - discovery
moves:
    - verb: GET
      to:
        - https://www.freelancer.com/u/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '> joined'
          in: body
          need: all
