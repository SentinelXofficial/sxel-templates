id: fiverr
brief:
    title: Fiverr User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Fiverr user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - fiverr
        - discovery
moves:
    - verb: GET
      to:
        - https://www.fiverr.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - member-since
          in: body
          need: all
