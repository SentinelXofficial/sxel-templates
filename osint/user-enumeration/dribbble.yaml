id: dribbble
brief:
    title: Dribbble User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Dribbble user name information check was conducted.
    label:
        - osint
        - osint-art
        - dribbble
        - discovery
moves:
    - verb: GET
      to:
        - https://dribbble.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ' | Dribbble'
          in: body
          need: all
