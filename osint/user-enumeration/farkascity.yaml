id: farkascity
brief:
    title: Farkascity User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Farkascity user name information check was conducted.
    label:
        - osint
        - osint-blog
        - farkascity
        - discovery
moves:
    - verb: GET
      to:
        - https://farkascity.org/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - blog-title
          in: body
          need: all
