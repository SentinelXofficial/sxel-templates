id: inaturalist
brief:
    title: Inaturalist User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Inaturalist user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - inaturalist
        - discovery
moves:
    - verb: GET
      to:
        - https://inaturalist.nz/people/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - s Profile
          in: body
          need: all
