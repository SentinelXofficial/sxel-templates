id: ogugg
brief:
    title: Ogu.gg User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Ogu.gg user name information check was conducted.
    label:
        - osint
        - osint-social
        - ogugg
        - discovery
moves:
    - verb: GET
      to:
        - https://ogu.gg/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Username History
          in: body
          need: all
