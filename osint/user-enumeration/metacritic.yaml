id: metacritic
brief:
    title: Metacritic User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Metacritic user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - metacritic
        - discovery
moves:
    - verb: GET
      to:
        - https://www.metacritic.com/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '''s Profile - Metacritic'
          in: body
          need: all
