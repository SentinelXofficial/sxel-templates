id: yelp
brief:
    title: Yelp User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Yelp user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - yelp
        - discovery
moves:
    - verb: GET
      to:
        - https://www.yelp.com/user_details?userid={{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '''s Reviews |'
          in: body
          need: all
