id: heylink
brief:
    title: Heylink User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Heylink user name information check was conducted.
    label:
        - osint
        - osint-misc
        - heylink
        - discovery
moves:
    - verb: GET
      to:
        - https://heylink.me/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - HeyLink.me |
          in: body
          need: all
