id: friendfinder-x
brief:
    title: FriendFinder-X User Name Information - Detect
    by: dwisiswant0
    level: info
    about: FriendFinder-X user name information check was conducted.
    label:
        - osint
        - osint-dating
        - friendfinder-x
        - discovery
moves:
    - verb: GET
      to:
        - https://www.friendfinder-x.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '''s Dating Profile on FriendFinder-x'
          in: body
          need: all
