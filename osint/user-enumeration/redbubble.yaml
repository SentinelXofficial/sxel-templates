id: redbubble
brief:
    title: Redbubble User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Redbubble user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - redbubble
        - discovery
moves:
    - verb: GET
      to:
        - https://www.redbubble.com/people/{{user}}/shop
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Shop | Redbubble
          in: body
          need: all
