id: hackernoon
brief:
    title: Hackernoon User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Hackernoon user name information check was conducted.
    label:
        - osint
        - osint-tech
        - hackernoon
        - discovery
moves:
    - verb: GET
      to:
        - https://hackernoon.com/_next/data/foL6JC7ro2FEEMD-gMKgQ/u/{{user}}.json
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"profile"'
          in: body
          need: all
