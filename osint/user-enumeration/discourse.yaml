id: discourse
brief:
    title: Discourse User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Discourse user name information check was conducted.
    label:
        - osint
        - osint-misc
        - discourse
        - discovery
moves:
    - verb: GET
      to:
        - https://meta.discourse.org/u/{{user}}/summary.json
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - topics
          in: body
          need: all
