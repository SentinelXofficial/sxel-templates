id: blogger
brief:
    title: Blogger User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Blogger user name information check was conducted.
    label:
        - osint
        - osint-blog
        - blogger
        - discovery
moves:
    - verb: GET
      to:
        - https://www.blogger.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '>On Blogger since'
          in: body
          need: all
