id: dibiz
brief:
    title: DIBIZ User Name Information - Detect
    by: dwisiswant0
    level: info
    about: DIBIZ user name information check was conducted.
    label:
        - osint
        - osint-business
        - dibiz
        - discovery
moves:
    - verb: GET
      to:
        - https://www.dibiz.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - mailto:?subject=
          in: body
          need: all
