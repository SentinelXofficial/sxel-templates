id: gitea
brief:
    title: Gitea User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Gitea user name information check was conducted.
    label:
        - osint
        - osint-coding
        - gitea
        - discovery
moves:
    - verb: GET
      to:
        - https://gitea.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - (Git with a cup of tea)
          in: body
          need: all
