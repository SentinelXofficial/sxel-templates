id: steemit
brief:
    title: Steemit User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Steemit user name information check was conducted.
    label:
        - osint
        - osint-social
        - steemit
        - discovery
moves:
    - verb: GET
      to:
        - https://steemit.com/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - blog
          in: body
          need: all
