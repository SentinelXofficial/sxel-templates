id: livejournal
brief:
    title: Livejournal User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Livejournal user name information check was conducted.
    label:
        - osint
        - osint-blog
        - livejournal
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.livejournal.com
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <link rel="canonical" href="
          in: body
          need: all
