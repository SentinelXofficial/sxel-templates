id: vip-blog
brief:
    title: VIP-blog User Name Information - Detect
    by: dwisiswant0
    level: info
    about: VIP-blog user name information check was conducted.
    label:
        - osint
        - osint-blog
        - vip-blog
        - discovery
moves:
    - verb: GET
      to:
        - http://{{user}}.vip-blog.com
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'blog : '
          in: body
          need: all
