id: bittube
brief:
    title: Bittube User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Bittube user name information check was conducted.
    label:
        - osint
        - osint-video
        - bittube
        - discovery
moves:
    - verb: GET
      to:
        - https://bittube.video/c/{{user}}/videos
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '- BitTube</title>'
          in: body
          need: all
