id: bunpro
brief:
    title: Bunpro User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Bunpro user name information check was conducted.
    label:
        - osint
        - osint-social
        - bunpro
        - discovery
moves:
    - verb: GET
      to:
        - https://community.bunpro.jp/u/{{user}}.json
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - username
          in: body
          need: all
