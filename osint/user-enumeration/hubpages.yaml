id: hubpages
brief:
    title: HubPages User Name Information - Detect
    by: dwisiswant0
    level: info
    about: HubPages user name information check was conducted.
    label:
        - osint
        - osint-blog
        - hubpages
        - discovery
moves:
    - verb: GET
      to:
        - https://hubpages.com/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - name">Followers
          in: body
          need: all
