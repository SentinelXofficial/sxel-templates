id: wordnik
brief:
    title: Wordnik User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Wordnik user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - wordnik
        - discovery
moves:
    - verb: GET
      to:
        - https://www.wordnik.com/users/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Welcome,
          in: body
          need: all
