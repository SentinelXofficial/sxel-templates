id: watchmemorecom
brief:
    title: Watchmemore.com User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Watchmemore.com user name information check was conducted.
    label:
        - osint
        - osint-porn
        - watchmemorecom
        - discovery
moves:
    - verb: GET
      to:
        - https://api.watchmemore.com/api3/profile/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - displayName
          in: body
          need: all
