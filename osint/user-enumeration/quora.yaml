id: quora
brief:
    title: Quora User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Quora user name information check was conducted.
    label:
        - osint
        - osint-social
        - quora
        - discovery
moves:
    - verb: GET
      to:
        - https://www.quora.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Credentials
          in: body
          need: all
