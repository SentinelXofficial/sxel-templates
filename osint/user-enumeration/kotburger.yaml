id: kotburger
brief:
    title: Kotburger User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Kotburger user name information check was conducted.
    label:
        - osint
        - osint-images
        - kotburger
        - discovery
moves:
    - verb: GET
      to:
        - https://kotburger.pl/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Zamieszcza kotburgery od:'
          in: body
          need: all
