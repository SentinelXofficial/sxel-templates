id: hihello
brief:
    title: HiHello User Name Information - Detect
    by: dwisiswant0
    level: info
    about: HiHello user name information check was conducted.
    label:
        - osint
        - osint-business
        - hihello
        - discovery
moves:
    - verb: GET
      to:
        - https://www.hihello.me/author/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '<title>HiHello Blog Author: '
          in: body
          need: all
