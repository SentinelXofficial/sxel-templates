id: olx
brief:
    title: Olx User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Olx user name information check was conducted.
    label:
        - osint
        - osint-shopping
        - olx
        - discovery
moves:
    - verb: GET
      to:
        - https://www.olx.pl/oferty/uzytkownik/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Obserwuj wyszukiwanie
          in: body
          need: all
