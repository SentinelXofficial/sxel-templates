id: our-freedom-book
brief:
    title: Our Freedom Book User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Our Freedom Book user name information check was conducted.
    label:
        - osint
        - osint-social
        - our-freedom-book
        - discovery
moves:
    - verb: GET
      to:
        - https://www.ourfreedombook.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'meta property="og:'
          in: body
          need: all
