id: anobii
brief:
    title: ANobii User Name Information - Detect
    by: dwisiswant0
    level: info
    about: ANobii user name information check was conducted.
    label:
        - osint
        - osint-hobby
        - anobii
        - discovery
moves:
    - verb: GET
      to:
        - https://www.anobii.com/{{user}}/profile/activity
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '>Anobian since'
          in: body
          need: all
