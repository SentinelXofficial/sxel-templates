id: wetransfer
brief:
    title: WeTransfer User Name Information - Detect
    by: dwisiswant0
    level: info
    about: WeTransfer user name information check was conducted.
    label:
        - osint
        - osint-misc
        - wetransfer
        - discovery
moves:
    - verb: GET
      to:
        - https://{{user}}.wetransfer.com
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - default_recipient_email
          in: body
          need: all
