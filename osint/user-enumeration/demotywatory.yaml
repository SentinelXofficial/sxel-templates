id: demotywatory
brief:
    title: Demotywatory User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Demotywatory user name information check was conducted.
    label:
        - osint
        - osint-images
        - demotywatory
        - discovery
moves:
    - verb: GET
      to:
        - https://demotywatory.pl/user/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - 'Z nami od:'
          in: body
          need: all
