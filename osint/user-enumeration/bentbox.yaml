id: bentbox
brief:
    title: Bentbox User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Bentbox user name information check was conducted.
    label:
        - osint
        - osint-porn
        - bentbox
        - discovery
moves:
    - verb: GET
      to:
        - https://bentbox.co/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <div id="user_bar">
          in: body
          need: all
