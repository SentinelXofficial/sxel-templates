id: mybuildercom
brief:
    title: MyBuilder.com User Name Information - Detect
    by: dwisiswant0
    level: info
    about: MyBuilder.com user name information check was conducted.
    label:
        - osint
        - osint-social
        - mybuildercom
        - discovery
moves:
    - verb: GET
      to:
        - https://www.mybuilder.com/profile/view/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - feedback
          in: body
          need: all
