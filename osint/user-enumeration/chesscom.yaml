id: chesscom
brief:
    title: Chess.com User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Chess.com user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - chesscom
        - discovery
moves:
    - verb: GET
      to:
        - https://www.chess.com/member/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Last Online
          in: body
          need: all
