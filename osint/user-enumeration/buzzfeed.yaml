id: buzzfeed
brief:
    title: BuzzFeed User Name Information - Detect
    by: dwisiswant0
    level: info
    about: BuzzFeed user name information check was conducted.
    label:
        - osint
        - osint-social
        - buzzfeed
        - discovery
moves:
    - verb: GET
      to:
        - https://www.buzzfeed.com/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - memberSince
          in: body
          need: all
