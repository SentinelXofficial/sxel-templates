id: internet-archive-account
brief:
    title: Internet Archive Account User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Internet Archive Account user name information check was conducted.
    label:
        - osint
        - osint-misc
        - internet-archive-account
        - discovery
moves:
    - verb: GET
      to:
        - https://archive.org/details/@{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - <title>User Account
          in: body
          need: all
