id: myfitnesspal-author
brief:
    title: MyFitnessPal Author User Name Information - Detect
    by: dwisiswant0
    level: info
    about: MyFitnessPal Author user name information check was conducted.
    label:
        - osint
        - osint-health
        - myfitnesspal-author
        - discovery
moves:
    - verb: GET
      to:
        - https://blog.myfitnesspal.com/author/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - About the Author
          in: body
          need: all
