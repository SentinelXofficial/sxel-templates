id: naturalnews
brief:
    title: NaturalNews User Name Information - Detect
    by: dwisiswant0
    level: info
    about: NaturalNews user name information check was conducted.
    label:
        - osint
        - osint-political
        - naturalnews
        - discovery
moves:
    - verb: GET
      to:
        - https://naturalnews.com/author/{{user}}/
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - All posts by
          in: body
          need: all
