id: mymfans
brief:
    title: Mym.fans User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Mym.fans user name information check was conducted.
    label:
        - osint
        - osint-social
        - mymfans
        - discovery
moves:
    - verb: GET
      to:
        - https://mym.fans/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - posts
          in: body
          need: all
