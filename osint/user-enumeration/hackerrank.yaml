id: hackerrank
brief:
    title: HackerRank User Name Information - Detect
    by: dwisiswant0
    level: info
    about: HackerRank user name information check was conducted.
    label:
        - osint
        - osint-tech
        - hackerrank
        - discovery
moves:
    - verb: GET
      to:
        - https://www.hackerrank.com/profile/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ' | HackerRank</title>'
          in: body
          need: all
