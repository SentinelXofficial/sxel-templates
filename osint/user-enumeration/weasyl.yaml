id: weasyl
brief:
    title: Weasyl User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Weasyl user name information check was conducted.
    label:
        - osint
        - osint-images
        - weasyl
        - discovery
moves:
    - verb: GET
      to:
        - https://www.weasyl.com/~{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '&#39;s profile — Weasyl</title>'
          in: body
          need: all
