id: rsi
brief:
    title: Rsi User Name Information - Detect
    by: dwisiswant0
    level: info
    about: Rsi user name information check was conducted.
    label:
        - osint
        - osint-gaming
        - rsi
        - discovery
moves:
    - verb: GET
      to:
        - https://robertsspaceindustries.com/citizens/{{user}}
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - CITIZEN DOSSIER
          in: body
          need: all
