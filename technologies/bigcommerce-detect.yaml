id: bigcommerce-detect
brief:
    title: BigCommerce Detection
    by: Chirag Mistry
    level: info
    about: An instance running BigCommerce is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - bigcommerce
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/bigcommerce.js'
        - '{{BaseURL}}/stores'
        - '{{BaseURL}}/cart'
        - '{{BaseURL}}/admin'
      signs:
        - "on": word
          has:
            - Powered by BigCommerce
            - X-BigCommerce-Request-Id
            - bigcommerce.com
          in: response
          need: all
        - "on": status
          status:
            - 200
