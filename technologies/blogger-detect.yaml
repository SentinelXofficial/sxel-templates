id: blogger-detect
brief:
    title: Blogger Detection
    by: Chirag Mistry
    level: info
    about: An instance running Blogger is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - blogger
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/blogger.js'
        - '{{BaseURL}}/feeds/posts/default'
        - '{{BaseURL}}/search'
      signs:
        - "on": word
          has:
            - Powered by Blogger
            - blogspot.com
            - X-Powered-By-Blogger
            - blogger.com
          in: response
          need: all
        - "on": status
          status:
            - 200
