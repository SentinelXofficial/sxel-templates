id: squarespace-detect
brief:
    title: Squarespace Detection
    by: Chirag Mistry
    level: info
    about: An instance running Squarespace is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - squarespace
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/_static/'
        - '{{BaseURL}}/squarespace.js'
        - '{{BaseURL}}/config.json'
        - '{{BaseURL}}/media-cache'
      signs:
        - "on": word
          has:
            - Powered by Squarespace
            - X-Squarespace-Request-Id
            - Squarespace Template
          in: response
          need: all
        - "on": status
          status:
            - 200
            - 403
