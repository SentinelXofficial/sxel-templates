id: vmware-detect
brief:
    title: VMware Detection
    by: elouhi
    level: info
    about: Sends a POST request containing a SOAP payload to a vCenter server to obtain version information
    label:
        - tech
        - vcenter
        - vmware
        - discovery
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/sdk/'
      body: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
           <soap:Header>
              <operationID>00000001-00000001</operationID>
           </soap:Header>
           <soap:Body>
              <RetrieveServiceContent xmlns="urn:internalvim25">
                 <_this xsi:type="ManagedObjectReference" type="ServiceInstance">ServiceInstance</_this>
              </RetrieveServiceContent>
           </soap:Body>
        </soap:Envelope>
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - ha-folder-root
            - RetrieveServiceContentResponse
          in: body
          need: all
        - "on": word
          has:
            - text/xml
          in: header
          need: all
