id: kube-api-secrets
brief:
    title: Kube API Secrets
    by: sharath
    level: info
    about: Scans for kube secrets endpoint
    label:
        - tech
        - k8s
        - kubernetes
        - devops
        - kube
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/api/v1/namespaces/default/secrets'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"SecretList":'
            - '"items":'
          in: body
          need: all
