id: kube-api-version
brief:
    title: Kube API Version
    by: sharath
    level: info
    about: Searches for exposed Kubernetes API servers which return version information unauthenticated
    label:
        - tech
        - k8s
        - kubernetes
        - devops
        - kube
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/version'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"major":'
            - '"minor":'
            - '"goVersion":'
          in: body
          need: all
