id: blazor-webassembly-detect
brief:
    title: Blazor WebAssembly - Detect
    by: righettod
    level: info
    about: Blazor WebAssembly application was detected.
    label:
        - blazor
        - webassembly
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/_framework/blazor.boot.json'
      signs:
        - "on": word
          has:
            - dotnet.wasm
            - '"entryAssembly"'
            - '"Microsoft.JSInterop.WebAssembly.dll"'
          in: body
          need: all
        - "on": status
          status:
            - 200
