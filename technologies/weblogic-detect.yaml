id: weblogic-detect
brief:
    title: Detect Weblogic
    by: pdteam
    level: info
    about: ""
    label:
        - tech
        - weblogic
        - intrusive
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/{{randstr}}'
      signs:
        - "on": word
          has:
            - From RFC 2068
