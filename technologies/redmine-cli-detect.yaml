id: redmine-cli-detect
brief:
    title: Detect Redmine CLI Configuration File
    by: geeknik
    level: info
    about: A small command-line utility to interact with Redmine - https://pypi.org/project/Redmine-CLI/
    label:
        - tech
        - redmine
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.redmine-cli'
      signs:
        - "on": word
          has:
            - default
            - my_id
            - root_url
          in: body
          need: all
        - "on": status
          status:
            - 200
