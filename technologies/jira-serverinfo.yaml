id: jira-serverinfo
brief:
    title: Jira Rest API Server Information
    by: pdteam
    level: info
    about: Detected Jira REST API serverInfo endpoint is accessible without authentication, exposing sensitive server information including version, build number, server title, base URL, and server time.
    label:
        - jira
        - tech
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/rest/api/latest/serverInfo'
        - '{{BaseURL}}/rest/api/2/serverInfo'
      signs:
        - "on": word
          has:
            - '"baseUrl"'
            - '"deploymentType"'
          in: body
          need: all
        - "on": status
          status:
            - 200
