id: moinmoin-detect
brief:
    title: MoinMoin wiki detect
    by: cyllective
    level: info
    about: Detects MoinMoin Wiki
    label:
        - tech
        - moin
        - moinmoin
        - wiki
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <a href="http://moinmo.in/" title="This site uses the MoinMoin Wiki software.">MoinMoin Powered</a>
            - <a href="http://moinmo.in/Python" title="MoinMoin is written in Python.">Python Powered</a>
          in: body
          need: all
        - "on": status
          status:
            - 200
