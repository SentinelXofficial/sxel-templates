id: cleo-detect
brief:
    title: Cleo Technology - Detect
    by: rxerium
    level: info
    about: This template detects Cleo technologies, including VLTrader, Harmony, and LexiCom, by inspecting response headers.It also extracts version information for each identified technology.
    label:
        - tech
        - detect
        - cleo
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Cleo VLTrader
            - Cleo Harmony
            - Cleo LexiCom
          in: server
