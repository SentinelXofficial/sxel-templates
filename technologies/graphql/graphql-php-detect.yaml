id: graphql-php-detect
brief:
    title: Graphql PHP Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - php
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query ! {__typename}"}'
      signs:
        - "on": status
          status:
            - 200
            - 400
        - "on": word
          has:
            - 'Syntax Error: Cannot parse the unexpected character "!".'
          in: body
          need: all
