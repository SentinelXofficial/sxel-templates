id: graphql-strawberry-detect
brief:
    title: Graphql Strawberry Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - strawberry
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query @deprecated { __typename }"}'
      signs:
        - "on": status
          status:
            - 200
            - 400
        - "on": word
          has:
            - Directive '@deprecated' may not be used on query.
          in: body
          need: all
