id: graphql-gqlgen-detect
brief:
    title: Graphql Gqlgen Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - gqlgen
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query { __typename { }"}'
      signs:
        - "on": status
          status:
            - 200
            - 400
        - "on": word
          has:
            - expected at least one definition
          in: body
          need: all
