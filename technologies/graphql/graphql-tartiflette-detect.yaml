id: graphql-tartiflette-detect
brief:
    title: Graphql Tartiflette Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - tartiflette
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query @a { __typename }"}'
      signs:
        - "on": status
          status:
            - 200
            - 400
        - "on": word
          has:
            - Unknow Directive < @a >.
          in: body
          need: all
