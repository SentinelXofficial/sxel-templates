id: graphql-ariadne-detect
brief:
    title: Graphql Ariadne Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - ariadne
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query { __typename @abc }"}'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - Unknown directive '@abc'.
          in: body
          need: all
        - "on": word
          has:
            - 'Content-Type: text/html'
          in: header
          need: all
        - "on": word
          has:
            - <html
            - <body
          in: body
          need: all
