id: graphql-apiforwp-detect
brief:
    title: Graphql apiforwp Detect
    by: princechaddha
    level: info
    about: ""
    label:
        - tech
        - graphql
        - wordpress
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/graphql'
        - '{{BaseURL}}/api/graphql'
        - '{{BaseURL}}/query'
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"query":"query aa#aa { __typename }"}'
      signs:
        - "on": status
          status:
            - 200
            - 400
        - "on": word
          has:
            - Unexpected token "END"
          in: body
          need: all
