id: bitrix-detect
brief:
    title: Bitrix Detection
    by: Chirag Mistry
    level: info
    about: An instance running Bitrix is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - bitrix
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/bitrix/js/main/core/core_min.js'
        - '{{BaseURL}}/bitrix/admin/'
        - '{{BaseURL}}/bitrix/templates/'
        - '{{BaseURL}}/bitrix/panel/'
      signs:
        - "on": word
          has:
            - Powered by Bitrix
            - bitrix.com
            - bitrixjs
            - X-Powered-By-Bitrix
          in: response
          need: all
        - "on": status
          status:
            - 200
