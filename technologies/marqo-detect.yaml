id: marqo-detect
brief:
    title: Marqo Vector Search Engine - Detect
    by: rxerium
    level: info
    about: Marqo vector search engine was detected. Marqo is an open-source tensor search and vector database that combines vector search with filtering and text/image search for AI applications.
    label:
        - tech
        - marqo
        - vector-db
        - search
        - ai
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Welcome to Marqo
          in: body
          need: all
        - "on": status
          status:
            - 200
