id: beyondtrust-remotesupport-version
brief:
    title: BeyondTrust Remote Support Version - Detect
    by: missing0x00
    level: info
    about: Detects and extracts version information from BeyondTrust Remote Support installations by querying the /get_rdf endpoint.
    label:
        - tech
        - beyondtrust
        - version
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/get_rdf?comp=sdcust&locale_code=en-us'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - BeyondTrust
          in: response
          need: all
