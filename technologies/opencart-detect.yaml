id: opencart-detect
brief:
    title: OpenCart Detection
    by: Chirag Mistry
    level: info
    about: An instance running OpenCart is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - opencart
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/admin'
        - '{{BaseURL}}/catalog/view/javascript/opencart.js'
        - '{{BaseURL}}/index.php?route=common/home'
        - '{{BaseURL}}/oc-admin'
      signs:
        - "on": word
          has:
            - Powered by OpenCart
            - X-Powered-By-OpenCart
            - OpenCart Store
          in: response
          need: all
        - "on": status
          status:
            - 200
