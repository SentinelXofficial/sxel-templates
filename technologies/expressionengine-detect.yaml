id: expressionengine-detect
brief:
    title: ExpressionEngine Detection
    by: Chirag Mistry
    level: info
    about: An instance running ExpressionEngine is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - expressionengine
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/system/'
        - '{{BaseURL}}/themes/'
        - '{{BaseURL}}/index.php'
        - '{{BaseURL}}/admin.php'
        - '{{BaseURL}}/cp/'
      signs:
        - "on": word
          has:
            - ExpressionEngine
            - Powered by ExpressionEngine
            - expressionengine.com
            - X-Powered-By-ExpressionEngine
          in: response
          need: all
        - "on": status
          status:
            - 200
