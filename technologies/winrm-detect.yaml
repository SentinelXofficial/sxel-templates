id: winrm-detect
brief:
    title: Windows Remote Management - Detection
    by: pussycat0x
    level: info
    about: Detects Windows Remote Management (WinRM) by checking HTTP response headers on ports 5985 (HTTP) and 5986 (HTTPS).
    label:
        - network
        - winrm
        - windows
        - discovery
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wsman'
      signs:
        - "on": status
          status:
            - 401
        - "on": word
          has:
            - 'Www-Authenticate: NTLM'
            - 'Www-Authenticate: Negotiate'
          in: header
          need: all
