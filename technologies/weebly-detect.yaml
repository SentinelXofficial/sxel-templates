id: weebly-detect
brief:
    title: Weebly Detection
    by: Chirag Mistry
    level: info
    about: An instance running Weebly is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - weebly
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/index.php'
        - '{{BaseURL}}/weebly/'
        - '{{BaseURL}}/site/'
      signs:
        - "on": word
          has:
            - Powered by Weebly
            - weebly.com
            - X-Powered-By-Weebly
          in: response
          need: all
        - "on": status
          status:
            - 200
            - 403
