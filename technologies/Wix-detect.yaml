id: wix-detect
brief:
    title: Wix Detection
    by: Chirag Mistry
    level: info
    about: An instance running Wix is detected by looking for specific HTTP headers, HTML tags, and known endpoints.
    label:
        - wix
        - detect
        - tech
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/robots.txt'
        - '{{BaseURL}}/sitemap.xml'
        - '{{BaseURL}}/favicon.ico'
        - '{{BaseURL}}/_static/'
        - '{{BaseURL}}/wix-api'
        - '{{BaseURL}}/user/login'
        - '{{BaseURL}}/wix.js'
      signs:
        - "on": word
          has:
            - Powered by Wix
            - X-Wix-Request-Id
            - Wix Static Site
            - wixsite.com
          in: response
          need: all
        - "on": status
          status:
            - 200
            - 403
            - 404
