id: openethereum-server
brief:
    title: OpenEthereum JSON-RPC HTTP Server Detect
    by: Nullfuzz
    level: info
    about: OpenEthereum is the fastest, lightest, and most "secure" Ethereum client. By default OpenEthereum runs a JSON-RPC HTTP server on port 8545/TCP
    label:
        - tech
        - openethereum
        - ethereum
        - web3
        - blockchain
        - discovery
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Length: "66"
        Content-Type: application/json
      body: '{"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}'
      signs: []
