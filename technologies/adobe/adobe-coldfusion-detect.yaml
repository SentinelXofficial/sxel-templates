id: adobe-coldfusion-detect
brief:
    title: Adobe ColdFusion Detector
    by: philippedelteil
    level: info
    about: With this template we can detect the version number of Coldfusion instances based on their logos.
    label:
        - adobe
        - coldfusion
        - tech
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/CFIDE/administrator/images/mx_login.gif'
        - '{{BaseURL}}/cfide/administrator/images/mx_login.gif'
        - '{{BaseURL}}/CFIDE/administrator/images/background.jpg'
        - '{{BaseURL}}/cfide/administrator/images/background.jpg'
        - '{{BaseURL}}/CFIDE/administrator/images/componentutilslogin.jpg'
        - '{{BaseURL}}/cfide/administrator/images/componentutilslogin.jpg'
      signs: []
