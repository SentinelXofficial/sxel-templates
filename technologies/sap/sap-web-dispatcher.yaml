id: sap-web-dispatcher-detection
brief:
    title: SAP Web Dispatcher detection
    by: randomstr1ng
    level: info
    about: Detection of SAP Web Dispatcher service
    label:
        - sap
        - webserver
        - proxy
        - tech
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/inormalydonotexist'
      signs:
        - "on": word
          has:
            - This error page was generated by SAP Web Dispatcher
          in: body
