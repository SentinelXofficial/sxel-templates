id: sap-message-server-console
brief:
    title: SAP Message Server Console - Exposure
    by: LRVT
    level: info
    about: Detected the SAP Message Server HTTP console on /msgserver. When accessed directly, the message server returns an HTML page.
    label:
        - sap
        - console
        - exposure
moves:
    - verb: GET
      to:
        - '{{RootURL}}/msgserver'
      signs:
        - "on": word
          has:
            - <TITLE>List of commands</TITLE>
            - /msgserver/commands
          in: body
          need: all
        - "on": word
          has:
            - SAP Message Server
          in: header
          need: all
        - "on": status
          status:
            - 200
