id: geth-server-detect
brief:
    title: Go Ethereum JSON-RPC HTTP Server - Detect
    by: Nullfuzz
    level: info
    about: Go-ethereum (aka Geth) is an Ethereum client built in Go. Geth runs a JSON-RPC HTTP server on port 8545/TCP
    label:
        - tech
        - geth
        - ethereum
        - web3
        - blockchain
        - discovery
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/'
      head:
        Content-Type: application/json
      body: '{"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}'
      signs: []
