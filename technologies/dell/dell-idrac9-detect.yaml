id: dell-idrac9-detect
brief:
    title: Detect Dell iDRAC9
    by: kophjager007
    level: info
    about: The Integrated Dell Remote Access Controller (iDRAC) is designed for secure local and remote server management and helps IT administrators deploy, update and monitor Dell EMC PowerEdge servers.
    label:
        - tech
        - dell
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/sysmgmt/2015/bmc/info'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - BuildVersion
            - SystemModelName
          in: body
          need: all
