id: xff-403-bypass
brief:
    title: X-Forwarded-For 403-forbidden bypass
    by: vavkamil
    level: info
    about: Template to detect 403 forbidden endpoint bypass behind Nginx/Apache proxy & load balancers, based on X-Forwarded-For header.
    label:
        - fuzzing
        - xff-403-bypass
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
      head:
        Accept: '*/*'
      signs: []
    - verb: GET
      to:
        - '{{BaseURL}}/'
      head:
        Accept: '*/*'
        X-Forwarded-For: 127.0.0.1, 0.0.0.0, 192.168.0.1, 10.0.0.1, 172.16.0.1
      signs: []
