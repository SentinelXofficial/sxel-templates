id: wordpress-weak-credentials
brief:
    title: WordPress - Weak Credentials
    by: evolutionsec
    level: critical
    about: Weak WordPress Credentials were discovered.
    label:
        - wordpress
        - default-login
        - fuzz
        - fuzzing
        - vuln
    score: CVSS:9.3
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/wp-login.php'
      head:
        Content-Type: application/x-www-form-urlencoded
        Origin: '{{BaseURL}}'
        Referer: '{{BaseURL}}'
      body: log={{users}}&pwd={{passwords}}
      signs:
        - "on": word
          has:
            - /wp-admin
            - wordpress_logged_in
          in: header
          need: all
        - "on": status
          status:
            - 302
