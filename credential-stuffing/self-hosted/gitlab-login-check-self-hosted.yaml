id: gitlab-login-check-self-hosted
brief:
    title: Gitlab Login Check Self Hosted
    by: parthmalhotra
    level: critical
    about: Checks for a valid login on self hosted GitLab instance.
    label:
        - creds-stuffing
        - login-check
        - self-hosted
        - gitlab
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/users/sign_in'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/users/sign_in'
      head:
        Accept-Language: en-US,en;q=0.9,de;q=0.8
        Cache-Control: max-age=0
        Content-Type: application/x-www-form-urlencoded
        DNT: "1"
        Origin: '{{BaseURL}}'
        Referer: '{{BaseURL}}/users/sign_in'
      body: authenticity_token={{url_encode(authenticity_token)}}&user%5Blogin%5D={{username}}&user%5Bpassword%5D={{password}}&user%5Bremember_me%5D=0
      signs: []
