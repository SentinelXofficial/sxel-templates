id: wordpress-login
brief:
    title: WordPress Login Panel - Detect
    by: its0x08
    level: info
    about: WordPress login panel was detected.
    label:
        - panel
        - wordpress
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/wp-login.php'
      signs:
        - "on": word
          has:
            - WordPress</title>
            - Log In</title>
            - /wp-login.php?action=lostpassword">Lost your password?</a>
            - <form name="loginform" id="loginform" action="{{BaseURL}}/wp-login.php" method="post">
          in: body
