id: aruba-via-vpn-panel
brief:
    title: Aruba VIA VPN - Login Panel
    by: rxerium
    level: info
    about: Aruba VIA (Virtual Intranet Access) is HPE Aruba's SSL VPN client and gateway
    label:
        - panel
        - aruba
        - via-vpn
        - vpn
        - hpe
        - network
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/screens/wms/wms.cgi'
      signs:
        - "on": word
          has:
            - <aruba>
            - ArubaOS
          in: body
          need: all
        - "on": word
          has:
            - /screens/wms/
          in: body
          need: all
        - "on": status
          status:
            - 200
