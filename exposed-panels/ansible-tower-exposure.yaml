id: ansible-tower-exposure
brief:
    title: Ansible Tower - Detect
    by: pdteam
    level: info
    about: Ansible Tower was detected. Ansible Tower is a commercial offering that helps teams manage complex multi-tier deployments by adding control, knowledge, and delegation to Ansible-powered environments.
    label:
        - panel
        - ansible
        - redhat
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>Ansible Tower</title>
            - ansible-bootstrap
          in: body
