id: bloofoxcms-login-panel
brief:
    title: bloofoxCMS Login Panel - Detect
    by: theamanrawat
    level: info
    about: ""
    label:
        - panel
        - bloofox
        - cms
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/admin/index.php'
      signs:
