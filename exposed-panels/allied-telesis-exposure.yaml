id: allied-telesis-login
brief:
    title: Allied Telesis Device GUI Login Panel - Detect
    by: prajiteshsingh
    level: info
    about: Allied Telesis Device GUI login panel was detected.
    label:
        - panel
        - allied
        - allied_telesis
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/public/login.html'
      signs:
        - "on": word
          has:
            - <title>Allied Telesis Device GUI</title>
          in: body
          need: all
        - "on": word
          has:
            - text/html
          in: header
          need: all
        - "on": status
          status:
            - 200
