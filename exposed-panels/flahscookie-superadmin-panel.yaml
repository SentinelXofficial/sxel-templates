id: flahscookie-superadmin-panel
brief:
    title: Flahscookie Superadmin Login Panel - Detect
    by: Hardik-Solanki
    level: info
    about: Flahscookie Superadmin login panel was detected.
    label:
        - panel
        - flahscookie
        - superadmin
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/pages/login'
      signs:
        - "on": word
          has:
            - Flahscookie Superadmin
          in: body
          need: all
        - "on": status
          status:
            - 200
