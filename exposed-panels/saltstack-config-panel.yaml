id: saltstack-config-panel
brief:
    title: SaltStack Config Panel - Detect
    by: pussycat0x
    level: info
    about: SaltStack config panel was detected.
    label:
        - panel
        - vmware
        - login
        - saltstack
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login'
      signs:
        - "on": word
          has:
            - SaltStack Config
          in: body
          need: all
        - "on": status
          status:
            - 200
