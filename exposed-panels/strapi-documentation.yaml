id: strapi-documentation
brief:
    title: Strapi CMS Documentation Login Panel - Detect
    by: idealphase
    level: info
    about: Strapi CMS Documentation login panel was detected.
    label:
        - strapi
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/documentation'
        - '{{BaseURL}}/documentation/login'
      signs:
        - "on": word
          has:
            - x-strapi-config
            - https://strapi.io/documentation/
          in: body
          need: all
        - "on": word
          has:
            - <title>Swagger UI</title>
            - <title>Login - Documentation</title>
          in: body
          need: all
        - "on": status
          status:
            - 200
