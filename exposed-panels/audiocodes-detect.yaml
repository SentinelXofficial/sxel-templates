id: audiocodes-detect
brief:
    title: AudioCodes Login - Panel Detect
    by: princechaddha
    level: info
    about: AudioCodes login panel was detected.
    label:
        - panel
        - audiocodes
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - AudioCodes
            - login
          in: body
          need: all
        - "on": status
          status:
            - 203
