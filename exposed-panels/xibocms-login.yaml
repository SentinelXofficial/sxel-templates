id: xibocms-login
brief:
    title: Xibo CMS Login Panel - Detect
    by: ritikchaddha
    level: info
    about: Xibo CMS login panel was detected.
    label:
        - panel
        - xibocms
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login'
      signs:
        - "on": word
          has:
            - xibo-cms
            - class="XiboFormButton
          in: body
          need: all
        - "on": status
          status:
            - 200
