id: lenovo-fp-panel
brief:
    title: Lenovo Fan Power Controller Login Panel - Detect
    by: megamansec
    level: info
    about: Lenovo Fan Power Controller login panel was detected.
    label:
        - panel
        - lenovo
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/login.html'
      signs:
        - "on": word
          has:
            - Avocent Corporation and its affiliates
            - FPC Login
            - Fan and Power Controller
          in: body
          need: all
        - "on": status
          status:
            - 200
