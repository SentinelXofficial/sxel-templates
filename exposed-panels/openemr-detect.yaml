id: openemr-detect
brief:
    title: OpenEMR Product Registration Panel - Detect
    by: pussycat0x
    level: info
    about: OpenEMR Product Registration panel was detected.
    label:
        - panel
        - openemr
        - open-emr
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/interface/login/login.php?site=default'
      signs:
        - "on": word
          has:
            - '"title":"OpenEMR Product Registration"'
          in: body
          need: all
        - "on": status
          status:
            - 200
