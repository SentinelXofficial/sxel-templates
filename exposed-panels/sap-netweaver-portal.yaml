id: sap-netweaver-portal
brief:
    title: SAP NetWeaver Portal - Detect
    by: organiccrap
    level: info
    about: SAP NetWeaver Portal login has been detected. Note that NetWeaver has multiple default passwords as listed in the references.
    label:
        - panel
        - sap
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/irj/portal'
      signs:
        - "on": word
          has:
            - <title>SAP&#x20;NetWeaver&#x20;Portal</title>
          in: body
