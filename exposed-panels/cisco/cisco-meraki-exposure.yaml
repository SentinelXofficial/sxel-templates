id: cisco-meraki-exposure
brief:
    title: Cisco Meraki Cloud Security Appliance Panel - Detect
    by: dhiyaneshDK
    level: info
    about: Cisco Meraki Cloud Security Appliance panel was detected.
    label:
        - panel
        - cisco
        - meraki
        - disclosure
        - edb
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/#connection'
      signs:
        - "on": word
          has:
            - Your client connection
            - This security appliance is directly connected to a local network
          in: body
          need: all
        - "on": status
          status:
            - 200
