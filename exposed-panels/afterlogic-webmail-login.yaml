id: afterlogic-webmail-login
brief:
    title: AfterLogic WebMail Login Panel - Detect
    by: johnk3r
    level: info
    about: AfterLogic WebMail Login panel was detected.
    label:
        - panel
        - afterlogic
        - login
        - detect
        - discovery
moves:
