id: mongodb-ops-manager
brief:
    title: MongoDB Ops Manager Login Panel - Detect
    by: dhiyaneshDK
    level: info
    about: MongoDB Ops Manager login panel was detected.
    label:
        - panel
        - mongodb
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/account/login'
      signs:
