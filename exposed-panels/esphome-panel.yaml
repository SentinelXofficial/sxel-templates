id: esphome-panel
brief:
    title: ESPHome Login Panel - Detect
    by: fabaff
    level: info
    about: ESPHome login panel was detected.
    label:
        - panel
        - esphome
        - iot
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/login'
      signs:
        - "on": word
          has:
            - class="esphome-header
          in: body
          need: all
        - "on": status
          status:
            - 200
