id: zenario-login-panel
brief:
    title: Zenario Admin Login Panel - Detect
    by: __Fazal
    level: info
    about: Zenario admin login panel was detected.
    label:
        - panel
        - zenario
        - tribalsystems
        - discovery
moves:
