id: nconf-panel
brief:
    title: NConf Login Panel - Detect
    by: ritikchaddha
    level: info
    about: NConf login panel was detected.
    label:
        - panel
        - nconf
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
