id: weave-scope-dashboard
brief:
    title: Weave Scope Panel - Detect
    by: e_schultze_
    level: info
    about: Weave Scope panel was detected.
    label:
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>Weave Scope</title>
            - __WEAVEWORKS_CSRF_TOKEN
            - __CSRF_TOKEN_PLACEHOLDER__
          in: body
          need: all
