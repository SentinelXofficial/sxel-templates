id: jedox-web-panel
brief:
    title: Jedox Web Login Panel - Detect
    by: Team Syslifters / Christoph MAHRL
    level: info
    about: Jedox is an Enterprise Performance Management software which is used for planning, analytics and reporting  in finance and other areas such as sales, human resources and procurement.
    label:
        - panel
        - jedox
        - detect
        - discovery
moves:
