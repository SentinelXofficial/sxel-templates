      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/ui/login/'
      signs:
        - "on": word
          has:
            - Jedox Web - Login
            - guide-jedox-software
          in: body
          need: all
        - "on": status
          status:
            - 200
