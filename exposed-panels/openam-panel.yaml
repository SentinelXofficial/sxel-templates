id: openam-panel
brief:
    title: OpenAM Login Panel - Detect
    by: philippedelteil
    level: info
    about: OpenAM login panel was detected.
    label:
        - panel
        - openam
        - opensso
        - login
        - forgerock
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/openam/XUI'
        - '{{BaseURL}}/XUI'
        - '{{BaseURL}}/XUI/#login'
        - '{{BaseURL}}/UI'
        - '{{BaseURL}}/sso/XUI'
        - '{{BaseURL}}/sso/UI'
        - '{{BaseURL}}/sso/UI/#login'
        - '{{BaseURL}}/opensso/UI/Login'
        - '{{BaseURL}}/openam/UI/login'
        - '{{BaseURL}}/openam/UI/#loginlogin'
        - '{{BaseURL}}/openam/UI/Login'
        - '{{BaseURL}}/openam/XUI/Login'
        - '{{BaseURL}}/openam/XUI/login'
        - '{{BaseURL}}/openam/XUI/#login'
        - '{{BaseURL}}/am/UI/Login'
        - '{{BaseURL}}/am/UI/#login'
        - '{{BaseURL}}/am/XUI/'
        - '{{BaseURL}}/am/XUI/Login'
        - '{{BaseURL}}/am/json/serverinfo/*'
        - '{{BaseURL}}/openam/json/serverinfo/*'
      signs:
        - "on": word
          has:
            - 'urlArgs: "v='
            - Sign in to OpenAM
            - ForgeRock
            - forgerock
            - FRForgotUsername
            - successfulUserRegistrationDestination
          in: body
          need: all
        - "on": status
          status:
            - 200
