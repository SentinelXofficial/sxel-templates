id: iomega-emc-shared-nas
brief:
    title: Iomega LenovoEMC NAS Login Panel - Detect
    by: e_schultze_
    level: info
    about: Iomega LenovoEMC NAS login panel was detected.
    label:
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cp/Shares?user=&protocol=webaccess&v=2.3'
      signs:
        - "on": status
          status:
            - 200
        - "on": word
          has:
            - '"access":"read"'
            - '"access":"readwrite"'
          in: body
          need: all
        - "on": word
          has:
            - iomega
          in: header
          need: all
