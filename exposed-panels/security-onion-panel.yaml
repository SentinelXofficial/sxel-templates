id: security-onion-panel
brief:
    title: Security Onion Panel - Detect
    by: rxerium
    level: info
    about: Security Onion is a free and open source Linux distribution for intrusion detection, security monitoring, and log management. It includes CyberChef, NetworkMiner, and many other security tools.
    label:
        - panel
        - security
        - onion
        - detect
        - securityonionsolutions
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/login/'
      signs:
        - "on": word
          has:
            - <title>Security Onion
            - Login to Security Onion
            - Security Onion Solutions
          in: body
          need: all
        - "on": status
          status:
            - 200
