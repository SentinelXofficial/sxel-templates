id: orbeon-forms-exposure
brief:
    title: Orbeon Forms Exposure
    by: ritikchaddha
    level: info
    about: Detects exposed Orbeon Forms interfaces including Form Runner, Form Builder, and Quick Links. Orbeon Forms is a web forms solution that may expose sensitive form data and administrative interfaces ...
    label:
        - exposure
        - orbeon
        - forms
        - form-runner
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/orbeon/'
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Orbeon
            - home</a>
            - Quick Links
          in: body
          need: all
        - "on": status
          status:
            - 200
