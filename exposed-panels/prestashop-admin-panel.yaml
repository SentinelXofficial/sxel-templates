id: prestashop-admin-panel
brief:
    title: Prestashop Admin Login Panel - Detect
    by: mastercho
    level: info
    about: Prestashop admin login panel was detected.
    label:
        - prestashop
        - panel
        - login
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/backoffice/'
        - '{{BaseURL}}/back-office/'
        - '{{BaseURL}}/Backoffice/'
        - '{{BaseURL}}/admin-dev/'
        - '{{BaseURL}}/backend/'
        - '{{BaseURL}}/admin_/'
        - '{{BaseURL}}/mikromanage/'
        - '{{BaseURL}}/manage/'
        - '{{BaseURL}}/manager/'
        - '{{BaseURL}}/adminshop/'
        - '{{BaseURL}}/administrator/'
        - '{{BaseURL}}/administracja/'
        - '{{BaseURL}}/adm/'
        - '{{BaseURL}}/webadmin/'
        - '{{BaseURL}}/admin-web/'
        - '{{BaseURL}}/kontrollpanel/'
        - '{{BaseURL}}/amministra/'
        - '{{BaseURL}}/adminas/'
        - '{{BaseURL}}/admin123/'
        - '{{BaseURL}}/admin0/'
        - '{{BaseURL}}/adminxx/'
        - '{{BaseURL}}/admin/'
        - '{{BaseURL}}/ps-admin/'
        - '{{BaseURL}}/admins/'
        - '{{BaseURL}}/p-office/'
        - '{{BaseURL}}/admin333/'
        - '{{BaseURL}}/admin4444/'
        - '{{BaseURL}}/admin66/'
        - '{{BaseURL}}/backadmin/'
        - '{{BaseURL}}/admin1/'
        - '{{BaseURL}}/BackofficeNEW/'
        - '{{BaseURL}}/4dm1n/'
        - '{{BaseURL}}/administrazione/'
        - '{{BaseURL}}/accesadministrateur/'
        - '{{BaseURL}}/_admin123/'
        - '{{BaseURL}}/iadmin/'
        - '{{BaseURL}}/panel/'
      signs:
        - "on": word
          has:
            - PrestaShop
            - class="show-forgot-password
          in: body
          need: all
        - "on": word
          has:
            - themes/default/css/admin-theme.css
            - class="show-forgot-password
          in: body
          need: all
