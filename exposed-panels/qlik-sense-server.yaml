    by: ricardomaia
    level: info
    about: Qlik Sense Server panel was detected.
    label:
        - panel
        - qlik
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/hub'
        - '{{BaseURL}}/resources/autogenerated/product-info.json'
      signs:
