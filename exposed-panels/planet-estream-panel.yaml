id: planet-estream-panel
brief:
    title: Planet eStream Login Panel - Detect
    by: arafatansari
    level: info
    about: Planet eStream login panel was detected.
    label:
        - panel
        - planet
        - estream
        - planetestream
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/Login.aspx'
      signs:
