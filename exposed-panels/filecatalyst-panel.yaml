id: filecatalyst-panel
brief:
    title: FileCatalyst File Transfer Solution - Detect
    by: DhiyaneshDK
    level: info
    about: Detects the presence of FileCatalyst file transfer solution login panel
    label:
        - panel
        - login
        - filecatalyst
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/workflow/jsp/logon.jsp'
      signs:
        - "on": word
          has:
            - FileCatalyst file transfer solution
          in: body
          need: all
        - "on": status
          status:
            - 200
