id: vmware-cloud-director
brief:
    title: VMware Cloud Director Login Panel - Detect
    by: DhiyaneshDK
    level: info
    about: VMware Cloud Director login panel was detected.
    label:
        - panel
        - vmware
        - discovery
moves:
