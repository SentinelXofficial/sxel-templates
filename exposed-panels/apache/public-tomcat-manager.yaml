id: public-tomcat-manager
brief:
    title: Apache Tomcat Manager Login Panel - Detect
    by: Ahmed Sherif
    level: info
    about: Apache Tomcat Manager login panel was detected.
    label:
        - panel
        - tomcat
        - apache
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/manager/html'
        - '{{BaseURL}}/host-manager/html'
      signs:
        - "on": word
          has:
            - Apache Tomcat
            - Tomcat Manager
          in: response
          need: all
        - "on": status
          status:
            - 401
            - 200
