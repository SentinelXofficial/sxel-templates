id: issabel-login
brief:
    title: Issabel Login Panel - Detect
    by: pikpikcu
    level: info
    about: Issabel login panel was detected.
    label:
        - issabel
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <a href="http://www.issabel.org"
            - <title>Issabel - Login page</title>
          in: body
          need: all
        - "on": status
          status:
            - 200
