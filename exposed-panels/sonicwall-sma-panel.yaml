    by: DhiyaneshDk
    level: info
    about: Detected SonicWall Secure Mobile Access (SMA) appliances — an enterprise SSL-VPN gateway for secure remote access (SMA 1000/6200/7200 series).
    label:
        - sonicwall
        - sma
        - ssl-vpn
        - vpn
        - tech
        - detect
        - login
        - panel
moves:
