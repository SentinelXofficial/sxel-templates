      to:
        - '{{BaseURL}}/'
        - '{{BaseURL}}/workplace/home.action'
      signs:
        - "on": word
          has:
            - EXTRAWEB_REFERER
          in: header
        - "on": word
          has:
            - /__extraweb__/
            - SonicWall
          in: body
          need: all
