id: avatier-password-management
brief:
    title: Avatier Password Management Panel
    by: praetorian-thendrickson
    level: info
    about: An Avatier password management panel was detected.
    label:
        - edb
        - panel
        - avatier
        - aims
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/aims/ps/'
      signs:
        - "on": word
          has:
            - LabelWelcomeToPS
            - Avatier Corporation
            - Welcome to Password Management
          in: body
        - "on": word
          has:
            - Password Management Client
          in: body
