id: phpmyadmin-panel
brief:
    title: phpMyAdmin Panel - Detect
    by: pdteam
    level: info
    about: phpMyAdmin panel was detected.
    label:
        - panel
        - phpmyadmin
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/phpmyadmin/'
        - '{{BaseURL}}/admin/phpmyadmin/'
        - '{{BaseURL}}/_phpmyadmin/'
        - '{{BaseURL}}/administrator/components/com_joommyadmin/phpmyadmin/'
        - '{{BaseURL}}/apache-default/phpmyadmin/'
        - '{{BaseURL}}/blog/phpmyadmin/'
        - '{{BaseURL}}/forum/phpmyadmin/'
        - '{{BaseURL}}/php/phpmyadmin/'
        - '{{BaseURL}}/typo3/phpmyadmin/'
        - '{{BaseURL}}/web/phpmyadmin/'
        - '{{BaseURL}}/xampp/phpmyadmin/'
        - '{{BaseURL}}/phpMyAdmin/'
        - '{{BaseURL}}/phpma/'
        - '{{BaseURL}}/phpMyAdmin/index.php'
      signs:
        - "on": word
          has:
            - alt="phpMyAdmin
            - name="pma_username
            - /pmahomme/
          in: body
