id: neobox-panel
brief:
    title: Neobox Web Server Login Panel - Detect
    by: pikpikcu
    level: info
    about: Neobox Web Server login panel was detected.
    label:
        - panel
        - neobox
        - webserver
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - ng-app="NeoboxUI" ng-controller="GlobalCtrl">
          in: body
          need: all
        - "on": status
          status:
            - 200
