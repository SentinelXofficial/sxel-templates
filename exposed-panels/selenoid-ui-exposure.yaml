id: selenoid-ui-exposure
brief:
    title: Selenoid UI Login Panel - Detect
    by: pdteam
    level: info
    about: Selenoid UI login panel was detected.
    label:
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/admin/login'
      signs:
        - "on": word
          has:
            - <title>Selenoid UI</title>
            - /manifest.json
          in: body
          need: all
