id: symantec-pgp-global-directory
brief:
    title: Symantec PGP Global Directory Panel - Detect
    by: princechaddha
    level: info
    about: Symantec PGP Global Directory panel was detected.
    label:
        - symantec
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/vkd/GetWelcomeScreen.event'
      signs:
        - "on": word
          has:
            - <TITLE>PGP Global Directory</TITLE>
          in: body
          need: all
        - "on": status
          status:
            - 200
