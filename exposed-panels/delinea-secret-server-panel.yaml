id: delinea-secret-server-panel
brief:
    title: Delinea Secret Server - Login Panel
    by: rxerium
    level: info
    about: Delinea Secret Server, formerly Thycotic Secret Server, is an enterprise privileged access management and password vault platform. The login panel was detected.
    label:
        - panel
        - delinea
        - thycotic
        - secretserver
        - pam
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Secret Server
            - Secret%20Server%20-%20SPA/
          in: body
          need: all
        - "on": status
          status:
            - 200
