id: onlyoffice-login-panel
brief:
    title: ONLYOFFICE Login Panel - Detect
    by: eremit4
    level: info
    about: ONLYOFFICE Community Server is a free open-source collaborative system developed to manage documents, projects, customer relationship and email correspondence.
    label:
        - panel
        - onlyoffice
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
        - '{{BaseURL}}/auth.aspx'
      signs:
        - "on": word
          has:
            - ONLYOFFICE
            - title="ONLYOFFICE
            - content="ONLYOFFICE
            - /images/onlyoffice_logo/
            - alt="ONLYOFFICE
          in: body
          need: all
        - "on": status
          status:
            - 200
