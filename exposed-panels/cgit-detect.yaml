id: cgit-detect
brief:
    title: cgit Web Interface - Detection
    by: ritikchaddha
    level: info
    about: Detects cgit web interface for Git repositories. cgit is a hyperfast web frontend for Git repositories written in C. It provides a web-based interface to browse Git repositories, view commits, diff...
    label:
        - tech
        - cgit
        - git
        - panel
        - detect
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/'
        - '{{BaseURL}}/cgit/'
      signs:
        - "on": word
          has:
            - cgit
            - generated by
          in: body
          need: all
        - "on": word
          has:
            - repository list
            - class='list nowrap'
            - id='cgit'
            - cgit.css
          in: body
          need: all
        - "on": status
          status:
            - 200
