id: ibm-security-access-manager
brief:
    title: IBM Security Access Manager Login Panel - Detect
    by: geeknik
    level: info
    about: IBM Security Access Manager login panel was detected.
    label:
        - panel
        - ibm
        - login
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>IBM Security Access Manager</title>
            - IBM Security <em>Access Manager</em>
          in: body
        - "on": word
          has:
            - IBM Security Access Manager for Web
          in: header
        - "on": word
          has:
            - /mga/sps/authsvc/policy/forgot_username
            - /mga/sps/authsvc/policy/forgot_password
          in: body
          need: all
