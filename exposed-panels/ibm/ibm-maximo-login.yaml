id: ibm-maximo-login
brief:
    title: IBM Maximo Login Panel - Detect
    by: ritikchaddha
    level: info
    about: IBM Maximo login panel was detected.
    label:
        - maximo
        - panel
        - ibm
        - login
        - detect
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/maximo/webclient/login/login.jsp?appservauth=true'
      signs:
        - "on": word
          has:
            - maximo-icon.png
            - IBM
          in: body
          need: all
        - "on": status
          status:
            - 200
