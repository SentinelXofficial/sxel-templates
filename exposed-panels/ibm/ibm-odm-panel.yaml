id: ibm-odm-panel
brief:
    title: IBM Operational Decision Manager Panel - Detect
    by: DhiyaneshDK
    level: info
    about: IBM Operational Decision Manager panel was detected.
    label:
        - panel
        - ibm
        - login
        - detect
        - decision-center
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/decisioncenter/login'
      signs:
        - "on": word
          has:
            - <title>Decision Center | Business Console</title>
            - <h1 class="title">Decision Center | Business Console</h1>
            - com/ibm/rules/decisioncenter/setup/Login
          in: body
          need: all
        - "on": status
          status:
            - 200
