id: digi-router-panel
brief:
    title: Digi International Router - Login Panel
    by: rxerium
    level: info
    about: Digi International cellular routers expose a web management interface used in industrial IoT and remote connectivity applications.
    label:
        - panel
        - ics
        - digi
        - router
        - industrial
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - <title>Digi Router</title>
            - __meteor_runtime_config__
            - meteorRelease
          in: body
          need: all
        - "on": status
          status:
            - 200
