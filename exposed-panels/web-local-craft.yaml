id: weblocal-craft-login
brief:
    title: Web Local Craft Terminal Login Panel - Detect
    by: dhiyaneshDK
    level: info
    about: Web Local Craft Terminal login panel was detected.
    label:
        - panel
        - edb
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/home.html'
      signs:
