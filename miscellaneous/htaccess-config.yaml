moves:
    - verb: GET
      to:
        - '{{BaseURL}}/.htaccess'
        - '{{BaseURL}}/example.htaccess'
        - '{{BaseURL}}/_.htaccess'
        - '{{BaseURL}}/sample.htaccess'
        - '{{BaseURL}}/a.htaccess'
        - '{{BaseURL}}/htaccess_for_page_not_found_redirects.htaccess'
      signs:
        - "on": word
          has:
            - RewriteRule
            - </IfModule>
            - <IfModule
          in: body
          need: all
