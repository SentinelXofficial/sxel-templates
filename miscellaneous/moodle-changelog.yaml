id: moodle-changelog
brief:
    title: Moodle Changelog File Detect
    by: oppsec
    level: info
    about: Moodle has a file which describes API changes in core libraries and APIs, and can be used to discover Moodle version.
    label:
        - moodle
        - exposure
        - misc
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/lib/upgrade.txt'
        - '{{BaseURL}}/UPGRADING.md'
      signs: []
