id: wix-takeover
brief:
    title: Wix Takeover Detection
    by: harshinsecurity
    level: high
    about: This subdomain take over would only work on an edge case when the account was deleted. You will need a premium account (~ US$7) to test the take over.
    label:
        - takeover
        - wix
        - vuln
moves:
    - verb: GET
      to:
        - '{{BaseURL}}'
      signs:
        - "on": word
          has:
            - Error ConnectYourDomain occurred
            - wixErrorPagesApp
          in: body
          need: all
        - "on": status
          status:
            - 404
