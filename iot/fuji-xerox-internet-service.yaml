id: fuji-xerox-internet-service
brief:
    title: Fuji Xerox Internet Services Panel - Detect
    by: dhiyaneshDK
    level: info
    about: Fuji Xerox Internet Services panel was detected.
    label:
        - iot
        - edb
        - panel
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/default.htm'
      signs:
        - "on": word
          has:
            - <title>Internet Services</title>
          in: body
          need: all
        - "on": status
          status:
            - 200
