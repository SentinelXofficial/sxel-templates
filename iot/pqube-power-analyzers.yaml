id: pqube-power-analyzers
brief:
    title: PQube 3 Power Analyzers
    by: pussycat0x
    level: low
    about: PQube 3 Power Analyzer panel was detected.
    label:
        - iot
        - exposure
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/status.html'
      signs:
        - "on": word
          has:
            - PQube 3 Information
            - 'Power Configuration:'
          in: body
          need: all
        - "on": status
          status:
            - 200
